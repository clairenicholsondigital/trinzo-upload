name: Tests

# Runs the compact core checks (npm test) on every pull request and on pushes to main.
# Make this check required in Settings > Branches so nothing merges without it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:meeting-agent
      - run: npm test
