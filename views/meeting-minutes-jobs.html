<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; --warning:#f59e0b; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
.container { max-width:1240px; margin:0 auto; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
.nav { margin-bottom:1rem; color:var(--muted); }
a { color:#67e8f9; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, .muted { color:var(--muted); }
.toolbar, .row-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
.toolbar { justify-content:space-between; }
.queue-tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0 .5rem; }
.queue-tab { display:inline-flex; align-items:center; gap:.35rem; padding:.45rem .7rem; border:1px solid var(--border); border-radius:999px; background:#071126; color:#dbeafe; font-weight:700; text-decoration:none; }
.queue-tab[aria-current="page"] { background:rgba(23,208,196,.12); border-color:rgba(23,208,196,.7); color:#e0fffd; }
.queue-tab.disabled { color:var(--muted); opacity:.75; cursor:default; }
button, .button { background:linear-gradient(180deg,var(--accent),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.6rem .85rem; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
button.secondary, .button.secondary { background:#132847; color:#dbeafe; border:1px solid var(--border); }
button.danger { background:#3a1515; color:#fecaca; border:1px solid #7f1d1d; }
button:disabled { opacity:.55; cursor:not-allowed; }
.message { margin-top:1rem; padding:.75rem; border-radius:10px; background:#17233f; border:1px solid var(--border); white-space:pre-wrap; }
.message.error { background:#3a1515; border-color:#7f1d1d; }
.message.success { background:#0f2f29; border-color:#116149; }
.jobs { width:100%; border-collapse:collapse; margin-top:1rem; overflow:hidden; border-radius:12px; }
.jobs th, .jobs td { border-bottom:1px solid var(--border); padding:.75rem; text-align:left; vertical-align:top; }
.jobs th { background:#0b1530; color:var(--muted); font-size:.86rem; }
.jobs tr { background:#071126; }
.jobs tr:hover { background:#0b1730; }
.bulk-bar { display:flex; align-items:center; gap:.65rem; flex-wrap:wrap; margin:.85rem 0 0; padding:.55rem .65rem; border:1px solid var(--border); border-radius:10px; background:var(--soft); color:var(--text); }
.bulk-bar label { display:inline-flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.9rem; cursor:pointer; }
.bulk-bar input, .job-select { accent-color:var(--accent); }
.bulk-bar button { padding:.42rem .65rem; font-size:.86rem; }
.bulk-count { color:var(--muted); font-size:.86rem; min-width:5.5rem; }
.status { display:inline-flex; padding:.25rem .55rem; border-radius:999px; border:1px solid var(--border); font-weight:700; font-size:.82rem; }
.status.running { color:#e0fffd; border-color:rgba(23,208,196,.65); background:rgba(23,208,196,.1); }
.status.completed { color:#bbf7d0; border-color:#166534; background:#052e1b; }
.status.failed, .status.cancelled { color:#fecaca; border-color:#7f1d1d; background:#3a1515; }
.status.queued, .status.retry_wait { color:#fde68a; border-color:#854d0e; background:#3a2c15; }
.status.in_review, .status.final_review { color:#e0fffd; border-color:rgba(23,208,196,.65); background:rgba(23,208,196,.1); }
.staged-detail-card { display:grid; gap:.75rem; border:1px solid var(--border); border-radius:12px; padding:1rem; background:#071126; margin-top:1rem; }
.staged-step-list { display:grid; gap:.5rem; }
.staged-step { display:flex; align-items:center; justify-content:space-between; gap:.75rem; border:1px solid var(--border); border-radius:10px; padding:.65rem .75rem; background:#081227; }
.staged-step.current { border-color:rgba(23,208,196,.65); background:rgba(23,208,196,.1); }
.progress { min-width:160px; }
.track { height:9px; border-radius:999px; background:#061022; border:1px solid var(--border); overflow:hidden; margin:.35rem 0; }
.fill { height:100%; background:linear-gradient(90deg,#17D0C4,#67e8f9); border-radius:999px; }
pre { white-space:pre-wrap; overflow:auto; max-height:620px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; }
.summary-item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.summary-label { color:var(--muted); font-size:.85rem; }
.summary-value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.summary-item input,
.summary-item textarea {
  width:100%;
  margin-top:.35rem;
  background:#050914;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.55rem;
  font:inherit;
  font-weight:700;
}
.summary-item textarea { min-height:74px; resize:vertical; line-height:1.45; }
.objectives-editor { margin-top:1rem; }
.objectives-editor textarea {
  width:100%;
  min-height:118px;
  background:#050914;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.7rem;
  font:inherit;
  line-height:1.45;
  resize:vertical;
}
.result-toolbar { margin:.85rem 0 1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
.advanced-result-tools { flex-basis:100%; margin-top:.25rem; }
.advanced-result-tools summary { display:inline-flex; width:auto; padding:.45rem .65rem; font-size:.86rem; color:var(--muted); background:#071126; }
.advanced-result-tools[open] summary { border-radius:10px; }
.advanced-result-tools .advanced-body { margin-top:.5rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; color:var(--muted); }
.minutes-table-wrap { width:100%; overflow-x:auto; margin-top:1rem; -webkit-overflow-scrolling:touch; }
.minutes-table { width:100%; border-collapse:collapse; min-width:940px; table-layout:fixed; }
.minutes-table th, .minutes-table td { border:1px solid var(--border); padding:.65rem; vertical-align:top; }
.minutes-table th { text-align:left; color:var(--accent); background:#071126; font-size:.9rem; }
.minutes-table td { background:#081227; line-height:1.45; }
.minutes-table .type-cell { width:130px; font-weight:700; }
.minutes-table .topic-cell { width:180px; color:#dbeafe; }
.minutes-table .owner-cell { width:160px; color:#dbeafe; }
.minutes-table .text-cell { width:360px; }
.minutes-table .deadline-cell { width:210px; color:#dbeafe; }
.minutes-table .detail-cell { width:230px; color:#dbeafe; }
.minutes-table .evidence-cell { width:260px; color:#dbeafe; }
.minutes-table select,
.minutes-table input,
.minutes-table textarea {
  display:block;
  width:100%;
  min-width:0;
  background:#050914;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.55rem;
  font:inherit;
}
.minutes-table textarea { min-height:92px; resize:vertical; line-height:1.45; }
.deadline-editor { display:grid; gap:.35rem; }
.deadline-editor input[type="date"] { color-scheme:dark; }
.edit-status { color:var(--muted); }
.edit-status.success { color:#bbf7d0; }
.edit-status.error { color:#fecaca; }
.row-edit-modal-backdrop { position:fixed; inset:0; z-index:1000; background:rgba(2,6,23,.72); display:flex; align-items:center; justify-content:center; padding:1rem; }
.row-edit-modal { width:min(760px,96vw); max-height:90vh; overflow:auto; background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid rgba(148,163,184,.35); border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.45); padding:1rem; }
.row-edit-modal-head { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; margin-bottom:1rem; }
.row-edit-modal-head p { margin:.2rem 0 0; }
.row-edit-modal-fields { display:grid; grid-template-columns:1fr; gap:.85rem; }
.row-edit-modal-fields label { display:grid; gap:.35rem; color:var(--muted); font-weight:700; }
.row-edit-modal-fields input,
.row-edit-modal-fields textarea {
  width:100%;
  background:#050914;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.65rem;
  font:inherit;
}
.row-edit-modal-fields textarea { min-height:8rem; resize:vertical; line-height:1.45; }
.row-edit-modal-actions { display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem; }
.result-section { margin-top:1rem; }
.result-section h3 { margin:.1rem 0 .6rem; font-size:1rem; color:#dbeafe; }
.result-section ul { margin:.35rem 0 0; padding-left:1.25rem; }
.result-section li { margin:.4rem 0; line-height:1.45; }
.result-table-section { margin-top:1.1rem; }
.result-table-section h3 { margin:.1rem 0 .55rem; font-size:1rem; color:#dbeafe; }
.result-table-section .minutes-table-wrap { margin-top:0; }
.result-table-accordion summary { font-size:1rem; color:#dbeafe; }
.result-table-accordion .minutes-table-wrap { margin-top:.75rem; }
.result-empty { color:var(--muted); border:1px dashed var(--border); border-radius:12px; padding:1rem; margin-top:1rem; }
details { margin-top:1rem; }
summary { cursor:pointer; color:var(--accent); font-weight:700; padding:.75rem; background:#071126; border:1px solid var(--border); border-radius:10px; }
details[open] summary { border-bottom-left-radius:0; border-bottom-right-radius:0; }
details pre { margin-top:0; border-top:0; border-top-left-radius:0; border-top-right-radius:0; }
@media (max-width: 860px) {
  .jobs, .jobs thead, .jobs tbody, .jobs tr, .jobs th, .jobs td { display:block; width:100%; }
  .jobs thead { display:none; }
  .jobs td { border-bottom:none; }
  .jobs tr { margin-bottom:.8rem; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .minutes-table { min-width:0; }
  .minutes-table, .minutes-table thead, .minutes-table tbody, .minutes-table tr, .minutes-table th, .minutes-table td { display:block; width:100%; }
  .minutes-table thead { display:none; }
  .minutes-table tr { margin-bottom:.75rem; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .minutes-table td { border:0; border-bottom:1px solid var(--border); padding:.7rem; }
  .minutes-table td::before {
    content: attr(data-label);
    display:block;
    color:var(--accent);
    font-weight:700;
    font-size:.82rem;
    margin-bottom:.35rem;
  }
  .minutes-table textarea { min-height:110px; }
}
</style>

<body class="jobs-page">
<div class="container">
  <nav class="nav" aria-label="Primary navigation">
    <a href="/dashboard">Dashboard</a>
    <a href="/meeting-minutes-final">Meeting transcript to minutes</a>
    <a href="/staged-meeting-minutes">Staged minutes</a>
    <a href="/jobs">Library</a>
    <a href="/project-update-test">Project Updates</a>
  </nav>

  <section id="listPanel" class="panel jobs-shell">
    <div class="jobs-header">
      <div class="jobs-heading">
        <h1>Library</h1>
        <p class="intro">Find and resume your staged meeting-minute reviews.</p>
      </div>
      <div class="jobs-actions">
        <a class="button secondary" href="/staged-meeting-minutes">Process new meeting</a>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
    </div>
    <nav class="queue-tabs" aria-label="Job queues">
      <a class="queue-tab" href="/jobs" aria-current="page">All items</a>
      <a class="queue-tab" href="/jobs?type=staged-meeting-minutes">Staged meeting minutes</a>
    </nav>
    <div id="bulkBar" class="bulk-bar" hidden>
      <label><input id="selectAllJobs" type="checkbox" /> Select all</label>
      <span id="bulkCount" class="bulk-count">0 selected</span>
      <button id="archiveSelectedBtn" class="secondary" type="button" disabled>Archive selected</button>
      <button id="archiveAllBtn" class="secondary" type="button">Archive all</button>
    </div>
    <div id="message" class="message" hidden></div>
    <div id="listView"></div>
  </section>

  <section id="detailPanel" class="panel" hidden>
    <div class="toolbar">
      <h2 id="detailTitle">Library item</h2>
      <div class="row-actions">
        <button id="retryBtn" class="secondary" type="button">Retry</button>
        <button id="cancelBtn" class="danger" type="button">Cancel</button>
      </div>
    </div>
    <div id="detailSummary" class="summary-grid"></div>
    <h2>Result</h2>
    <div id="resultMessage" class="muted">Result will appear here when the job completes.</div>
    <div id="resultActions" class="result-toolbar" hidden></div>
    <div id="resultView"></div>
    <details id="rawResultDetails" hidden>
      <summary>Raw result JSON</summary>
      <pre id="resultJson"></pre>
    </details>
  </section>
</div>

<script>
(function () {
  const listPanel = document.getElementById('listPanel');
  const listView = document.getElementById('listView');
  const message = document.getElementById('message');
  const refreshBtn = document.getElementById('refreshBtn');
  const detailPanel = document.getElementById('detailPanel');
  const detailTitle = document.getElementById('detailTitle');
  const detailSummary = document.getElementById('detailSummary');
  const resultMessage = document.getElementById('resultMessage');
  const resultActions = document.getElementById('resultActions');
  const resultView = document.getElementById('resultView');
  const rawResultDetails = document.getElementById('rawResultDetails');
  const resultJson = document.getElementById('resultJson');
  const retryBtn = document.getElementById('retryBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const bulkBar = document.getElementById('bulkBar');
  const selectAllJobs = document.getElementById('selectAllJobs');
  const bulkCount = document.getElementById('bulkCount');
  const archiveSelectedBtn = document.getElementById('archiveSelectedBtn');
  const archiveAllBtn = document.getElementById('archiveAllBtn');
  const pathMatch = window.location.pathname.match(/(?:\/jobs|\/meeting-minutes-final\/jobs)\/([^/]+)(?:\/result)?$/);
  const resultOnly = /(?:\/jobs|\/meeting-minutes-final\/jobs)\/[^/]+\/result$/.test(window.location.pathname);
  let activeJobId = pathMatch && /^\d+$/.test(pathMatch[1]) ? Number(pathMatch[1]) : null;
  let activeStagedDraftId = pathMatch && !/^\d+$/.test(pathMatch[1]) ? decodeURIComponent(pathMatch[1]) : '';
  let latestResultPayload = null;
  let latestResultRows = [];
  let autosaveTimer = null;
  let editDirty = false;
  let editFocused = false;
  let timer = null;
  let visibleJobs = [];
  const selectedJobs = new Set();

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  function setMessage(text, type = '') {
    message.hidden = !text;
    message.textContent = text || '';
    message.className = type ? `message ${type}` : 'message';
  }

  function formatDate(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('en-GB');
  }

  function toDateInputValue(value) {
    const text = cleanText(value);
    if (!text) return '';
    const isoMatch = text.match(/^(\d{4}-\d{2}-\d{2})/);
    if (isoMatch) return isoMatch[1];
    const ukMatch = text.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if (ukMatch) {
      const [, day, month, year] = ukMatch;
      return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    }
    const date = new Date(text);
    if (Number.isNaN(date.getTime())) return '';
    return date.toISOString().slice(0, 10);
  }

  function runtime(job) {
    const start = job.startedAt || job.createdAt;
    const end = job.completedAt || Date.now();
    if (!start) return '—';
    const ms = new Date(end).getTime() - new Date(start).getTime();
    if (!Number.isFinite(ms) || ms < 0) return '—';
    const seconds = Math.floor(ms / 1000);
    const mins = Math.floor(seconds / 60);
    return mins ? `${mins}m ${seconds % 60}s` : `${seconds}s`;
  }

  function statusClass(status) {
    return String(status || '').toLowerCase().replace(/[^a-z0-9_-]+/g, '_');
  }

  function readStagedDrafts() {
    try {
      const parsed = JSON.parse(localStorage.getItem('stagedMeetingMinutesJobs') || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function deleteStagedDraft(jobId) {
    const drafts = readStagedDrafts().filter((draft) => String(draft.jobId) !== String(jobId));
    localStorage.setItem('stagedMeetingMinutesJobs', JSON.stringify(drafts));
  }

  function archiveStagedDrafts(jobIds) {
    const ids = new Set(jobIds.map(String));
    const drafts = readStagedDrafts().map((draft) => ids.has(String(draft.jobId))
      ? { ...draft, archivedAt: new Date().toISOString() }
      : draft);
    localStorage.setItem('stagedMeetingMinutesJobs', JSON.stringify(drafts));
  }

  function stagedDraftJob(draft) {
    return {
      jobId: draft.jobId,
      jobType: 'staged_meeting_minutes_review',
      status: draft.status || 'in_review',
      stage: draft.stage || 'Details',
      progressPercent: Number(draft.progressPercent || 20),
      statusMessage: draft.statusMessage || 'Reviewer paused in the staged review flow.',
      attempts: 0,
      maxAttempts: 0,
      createdAt: draft.createdAt,
      updatedAt: draft.updatedAt,
      completedAt: '',
      startedAt: draft.createdAt,
      meetingTitle: draft.meetingTitle || 'Staged meeting-minutes review',
      fileName: draft.fileName || 'Browser-saved staged review draft',
      transcriptLength: Number(draft.transcriptLength || 0),
      activeScreen: Number(draft.activeScreen || 0),
      resumeUrl: draft.resumeUrl || `/staged-meeting-minutes?draftId=${encodeURIComponent(draft.jobId)}&screen=${Number(draft.activeScreen || 0)}`
    };
  }

  function stagedJobs() {
    return readStagedDrafts().filter((draft) => !draft.archivedAt).map(stagedDraftJob);
  }

  function isStagedJob(job) {
    return job && (job.jobType === 'staged_meeting_minutes_review' || job.jobType === 'staged_meeting_minutes_stage');
  }

  function isLocalStagedDraft(job) {
    return job && job.jobType === 'staged_meeting_minutes_review';
  }

  function isStaleStagedJob(job) {
    if (!job || job.jobType !== 'staged_meeting_minutes_stage' || !['queued', 'running'].includes(job.status)) return false;
    const updatedAt = new Date(job.updatedAt || job.createdAt || 0).getTime();
    return Number.isFinite(updatedAt) && updatedAt > 0 && Date.now() - updatedAt > 15 * 60 * 1000;
  }

  function friendlyLabel(value) {
    const text = String(value || '').replace(/[_-]+/g, ' ').trim();
    if (!text) return '—';
    return text.replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function cleanText(value) {
    return String(value || '')
      .replace(/\s+/g, ' ')
      .replace(/\s+\./g, '.')
      .trim();
  }

  function cleanMultiline(value) {
    return String(value || '')
      .split(/\r?\n/)
      .map((line) => cleanText(line))
      .filter(Boolean)
      .join('\n');
  }

  function firstDefined(...values) {
    return values.find(value => value !== undefined && value !== null && value !== '');
  }

  function parseLines(value) {
    return String(value || '')
      .split(/\r?\n/)
      .map((line) => cleanText(line))
      .filter(Boolean);
  }

  function joinLines(values) {
    return asArray(values).map((value) => cleanText(value)).filter(Boolean).join('\n');
  }

  function participantList(output, group) {
    return asArray(output?.participants?.[group] || output?.[`participants.${group}`]);
  }

  function objectText(value) {
    if (!value || typeof value !== 'object') return cleanText(value);
    return cleanText(firstDefined(
      value.text,
      value.quote,
      value.snippet,
      value.sourceSnippet,
      value.summary,
      value.evidence,
      ''
    ));
  }

  function valueText(value) {
    if (Array.isArray(value)) {
      return value.map((item) => {
        if (typeof item === 'string') return cleanText(item);
        const text = objectText(item);
        const speaker = cleanText(item?.speaker || '');
        return text && speaker ? `${speaker}: ${text}` : text;
      }).filter(Boolean).join('\n');
    }
    if (value && typeof value === 'object') return objectText(value);
    return cleanText(value);
  }

  function getEvidenceSpeaker(item) {
    const evidence = asArray(item?.evidence || item?._evidence);
    const first = evidence.find((ev) => ev && ev.speaker);
    return first ? first.speaker : '';
  }

  function rowDetail(item) {
    if (!item || typeof item !== 'object') return '';
    const pairs = [
      ['Status', firstDefined(item.status, item.state)],
      ['Dependency', item.dependency],
      ['Normalised term', item.normalisedTerm],
      ['Confidence', item.confidence],
      ['Reason', item.reason],
      ['Category', item.category]
    ];
    return pairs
      .map(([label, value]) => {
        const text = valueText(value);
        return text ? `${label}: ${text}` : '';
      })
      .filter(Boolean)
      .join('\n');
  }

  function rowDeadline(item) {
    if (!item || typeof item !== 'object') return '';
    return cleanText(firstDefined(item.deadline, item.target, item.meetingActionPointDeadline, item.dueDate, item.date, ''));
  }

  function rowEvidence(item) {
    if (!item || typeof item !== 'object') return '';
    return valueText(firstDefined(item.evidence, item.sourceSnippet, item._evidence, item.source, ''));
  }

  function rowTopic(item) {
    if (!item || typeof item !== 'object') return '';
    return cleanText(firstDefined(item.topic, item.itemTopic, item.sectionTopic, item.heading, ''));
  }

  function rowStatus(item) {
    if (!item || typeof item !== 'object') return '';
    return cleanText(firstDefined(item.status, item.state, item.reviewRequired ? 'Review required' : '', ''));
  }

  function rowText(item, textKeyCandidates) {
    if (typeof item === 'string') return cleanText(item);
    if (!item || typeof item !== 'object') return '';
    return cleanText(firstDefined(
      ...textKeyCandidates.map((key) => item[key]),
      item.text,
      item.summary,
      item.topic
    ));
  }

  function meetingLocationText(value) {
    const location = cleanText(value);
    const missingLocationValues = new Set(['', 'not stated', 'not specified', 'unknown', 'n/a', 'none']);
    return missingLocationValues.has(location.toLowerCase()) ? 'Microsoft Teams' : location;
  }

  function discussionTopicLookup(output) {
    const lookup = new Map();
    asArray(output.meetingMinutes).forEach((section) => {
      const topic = cleanText(section?.topic || '');
      if (!topic) return;
      asArray(section?.discussionPoints).forEach((point) => {
        const text = rowText(point, ['discussionPoint', 'text', 'summary']);
        const key = text.toLowerCase();
        if (key && !lookup.has(key)) lookup.set(key, topic);
      });
    });
    return lookup;
  }

  function titleFromType(value) {
    const text = cleanText(value || 'discussion').replace(/[_-]+/g, ' ');
    return text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Discussion';
  }

  function isActionType(value) {
    return cleanText(value || '').toLowerCase().replace(/[\s-]+/g, '_') === 'action';
  }

  function discussionTopics(output) {
    return asArray(output.discussionTopics).filter((topic) => topic && typeof topic === 'object' && asArray(topic.items).length);
  }

  function addRowsFromDiscussionTopics(rows, output, options = {}) {
    discussionTopics(output).forEach((topic, topicIndex) => {
      const topicName = cleanText(topic.topic || topic.title || topic.heading || 'Discussion');
      asArray(topic.items).forEach((item, itemIndex) => {
        if (!item || typeof item !== 'object') return;
        const itemType = cleanText(item.type || 'discussion');
        if (options.actionsOnly !== isActionType(itemType)) return;
        const text = rowText(item, ['text', 'summary', 'point', 'discussionPoint', 'risk', 'issue', 'dependency', 'action', 'decision']);
        if (!text) return;
        rows.push({
          id: `discussion-topic-${topicIndex}-${itemIndex}`,
          type: options.actionsOnly ? 'Action' : 'Discussion',
          topic: topicName,
          itemType: titleFromType(itemType),
          owner: cleanText(firstDefined(item.owner, item.meetingActionPointOwner, '')),
          deadline: rowDeadline(item),
          text,
          detail: rowDetail(item),
          evidence: rowEvidence(item),
          status: rowStatus(item)
        });
      });
    });
  }

  function addRowsFromArray(rows, source, type, textKeyCandidates, options = {}) {
    asArray(source).forEach((item, index) => {
      if (typeof item === 'string') {
        const text = cleanText(item);
        if (text) rows.push({
          id: `${options.idPrefix || type}-${index}`,
          type,
          topic: cleanText(options.topic || options.topicLookup?.get(text.toLowerCase()) || ''),
          itemType: cleanText(options.itemType || ''),
          owner: '',
          deadline: '',
          text,
          detail: '',
          evidence: ''
        });
        return;
      }
      if (!item || typeof item !== 'object') return;
      const text = rowText(item, textKeyCandidates);
      if (!text) return;
      rows.push({
        id: `${options.idPrefix || type}-${index}`,
        type,
        topic: rowTopic(item) || cleanText(options.topic || options.topicLookup?.get(text.toLowerCase()) || ''),
        itemType: cleanText(options.itemType || ''),
        owner: cleanText(firstDefined(item.owner, item.speaker, item.meetingActionPointOwner, getEvidenceSpeaker(item), '')),
        deadline: rowDeadline(item),
        text,
        detail: rowDetail(item),
        evidence: rowEvidence(item)
      });
    });
  }

  function addDiscussionRowsFromMeetingMinutes(rows, output) {
    asArray(output.meetingMinutes).forEach((section, sectionIndex) => {
      const topic = cleanText(section?.topic || '');
      addRowsFromArray(
        rows,
        section?.discussionPoints,
        'Discussion',
        ['discussionPoint', 'text', 'summary'],
        { topic, idPrefix: `meeting-minute-${sectionIndex}` }
      );
    });
  }

  function buildResultRows(output) {
    if (output.humanEdited && Array.isArray(output.editedRows)) {
      return output.editedRows.map((row, index) => ({
        id: `edited-${index}`,
        type: cleanText(row?.type || 'Note') || 'Note',
        topic: cleanText(row?.topic || ''),
        itemType: cleanText(row?.itemType || ''),
        owner: cleanText(row?.owner || ''),
        deadline: cleanText(row?.deadline || ''),
        text: cleanText(row?.text || ''),
        detail: cleanMultiline(row?.detail || ''),
        evidence: cleanMultiline(row?.evidence || '')
      })).filter((row) => row.text);
    }

    const rows = [];
    if (output.executiveSummary) {
      rows.push({ id: 'summary-0', type: 'Summary', topic: '', owner: '', deadline: '', text: cleanText(output.executiveSummary), detail: '', evidence: '' });
    }
    asArray(output.meetingObjectives).forEach((text, index) => {
      const cleaned = cleanText(text);
      if (cleaned) rows.push({ id: `objective-${index}`, type: 'Objective', topic: '', owner: '', deadline: '', text: cleaned, detail: '', evidence: '' });
    });
    const topicLookup = discussionTopicLookup(output);
    const hasNestedDiscussionTopics = discussionTopics(output).length > 0;
    if (hasNestedDiscussionTopics) addRowsFromDiscussionTopics(rows, output, { actionsOnly: false });
    addRowsFromArray(rows, output.actions, 'Action', ['action', 'task', 'meetingActionPoint', 'text']);
    if (hasNestedDiscussionTopics) addRowsFromDiscussionTopics(rows, output, { actionsOnly: true });
    asArray(output.meetingActionPoint).forEach((text, index) => {
      const cleaned = cleanText(text);
      if (!cleaned) return;
      rows.push({
        id: `meeting-action-${index}`,
        type: 'Action',
        topic: '',
        owner: cleanText(asArray(output.meetingActionPointOwner)[index] || ''),
        deadline: cleanText(asArray(output.meetingActionPointDeadline)[index] || ''),
        text: cleaned,
        detail: '',
        evidence: ''
      });
    });
    if (!hasNestedDiscussionTopics) {
      addRowsFromArray(rows, output.decisionDetails, 'Decision', ['decision', 'decisionPoint', 'text', 'summary']);
      addRowsFromArray(rows, output.decisions, 'Decision', ['decision', 'decisionPoint', 'text', 'summary']);
      addRowsFromArray(rows, output.confirmedPoints, 'Confirmed', ['text', 'summary', 'point']);
      addRowsFromArray(rows, output.risksAndIssues, 'Risk / issue', ['text', 'summary', 'risk', 'issue']);
      addRowsFromArray(rows, output.dependencies, 'Dependency', ['text', 'summary', 'dependency']);
      addRowsFromArray(rows, output.complianceFollowUps, 'Compliance follow-up', ['text', 'summary', 'action']);
    }
    addRowsFromArray(rows, output.termsForReview, 'Term for review', ['term', 'text', 'summary', 'normalisedTerm']);
    if (!hasNestedDiscussionTopics) {
      addDiscussionRowsFromMeetingMinutes(rows, output);
      addRowsFromArray(rows, output.finalDiscussionPoints || output.discussionPointDetails, 'Discussion', ['discussionPoint', 'text', 'summary'], { topicLookup });
    }
    addRowsFromArray(rows, output.statusReviewWorkstreams || output.statusReviewPoints, 'Status', ['topic', 'summary', 'text']);
    if (!hasNestedDiscussionTopics) addRowsFromArray(rows, output.discussionPoints, 'Discussion', ['discussionPoint', 'text', 'summary'], { topicLookup });

    const seen = new Set();
    return rows.filter((row) => {
      const key = `${row.type}|${row.owner}|${row.text}`.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function resultOutput(payload) {
    if (!payload || typeof payload !== 'object') return {};
    if (payload.result?.output && typeof payload.result.output === 'object') return payload.result.output;
    if (payload.output && typeof payload.output === 'object') return payload.output;
    if (payload.result && typeof payload.result === 'object') return payload.result;
    return payload;
  }

  function resultMeta(output) {
    return {
      meetingTitle: cleanText(output.meetingTitle || output.title || ''),
      meetingDate: cleanText(output.meetingDate || output.date || ''),
      meetingLocation: meetingLocationText(output.meetingLocation || output.location || ''),
      meetingType: cleanText(output.meetingType || ''),
      meetingObjectives: asArray(output.meetingObjectives).map((value) => cleanText(typeof value === 'string' ? value : firstDefined(value?.text, value?.summary, value?.topic, ''))).filter(Boolean),
      participants: {
        client: participantList(output, 'client').map((value) => cleanText(value)).filter(Boolean),
        trinzo: participantList(output, 'trinzo').map((value) => cleanText(value)).filter(Boolean)
      }
    };
  }

  function renderMetaInput(label, field, value, multiline = false) {
    const type = field === 'meetingDate' ? 'date' : 'text';
    const inputValue = field === 'meetingDate' ? toDateInputValue(value) : value;
    const control = multiline
      ? `<textarea data-edit-field="meta" data-meta-field="${escapeAttribute(field)}">${escapeHtml(value || '')}</textarea>`
      : `<input type="${type}" data-edit-field="meta" data-meta-field="${escapeAttribute(field)}" value="${escapeAttribute(inputValue || '')}" />`;
    return `<label class="summary-item"><span class="summary-label">${escapeHtml(label)}</span>${control}</label>`;
  }

  function renderObjectivesEditor(values) {
    return `
      <section class="result-section objectives-editor">
        <h3>Meeting objectives</h3>
        <textarea data-edit-field="meta" data-meta-field="meetingObjectives" placeholder="One objective per line">${escapeHtml(joinLines(values))}</textarea>
      </section>
    `;
  }

  function renderListSection(title, values) {
    const output = resultOutput(latestResultPayload);
    if (output.humanEdited && Array.isArray(output.editedRows)) return '';
    const items = asArray(values).map((value) => cleanText(typeof value === 'string' ? value : firstDefined(value?.text, value?.summary, value?.topic, value?.decision, value?.discussionPoint, ''))).filter(Boolean);
    if (!items.length) return '';
    return `
      <section class="result-section">
        <h3>${escapeHtml(title)}</h3>
        <ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
      </section>
    `;
  }

  function renderResultTable(rows) {
    latestResultRows = rows.map((row) => ({ ...row }));
    if (!rows.length) return '<div class="result-empty">No reviewable meeting rows found in the completed result.</div>';
    const grouped = new Map();
    rows.forEach((row, index) => {
      const type = cleanText(row.type || 'Note') || 'Note';
      if (!grouped.has(type)) grouped.set(type, []);
      grouped.get(type).push({ row, index });
    });
    return Array.from(grouped.entries())
      .map(([type, groupedRows]) => renderResultTableSection(type, groupedRows))
      .join('');
  }

  function resultSectionTitle(type) {
    return {
      Summary: 'Summary',
      Objective: 'Objectives',
      Confirmed: 'Confirmed points',
      'Risk / issue': 'Risks and issues',
      Dependency: 'Dependencies',
      'Compliance follow-up': 'Compliance follow-ups',
      'Term for review': 'Terms for review',
      Action: 'Actions',
      Decision: 'Decisions',
      Discussion: 'Discussion points',
      Status: 'Status points',
      Note: 'Notes'
    }[type] || `${type} points`;
  }

  function rowEditFieldLabel(field) {
    return {
      type: 'Type',
      topic: 'Topic',
      itemType: 'Subtype',
      owner: 'Owner / speaker',
      deadline: 'Deadline / date',
      text: 'Output',
      detail: 'Notes / context',
      evidence: 'Evidence / source note'
    }[field] || friendlyLabel(field);
  }

  function openRowEditModal(row) {
    if (!row) return;
    const fields = Array.from(row.querySelectorAll('[data-edit-field][data-edit-index]'));
    if (!fields.length) return;
    const existing = document.querySelector('[data-row-edit-modal]');
    if (existing) existing.remove();
    const title = cleanText(row.querySelector('[data-edit-field="text"]')?.value || row.textContent || 'Edit row').slice(0, 140);
    const modal = document.createElement('div');
    modal.className = 'row-edit-modal-backdrop';
    modal.setAttribute('data-row-edit-modal', 'true');
    modal.innerHTML = `
      <div class="row-edit-modal" role="dialog" aria-modal="true" aria-label="Row editor">
        <div class="row-edit-modal-head">
          <div><strong>Edit meeting-minutes row</strong><p class="muted">${escapeHtml(title || 'Review and edit this row')}</p></div>
          <button type="button" class="secondary" data-close-row-modal>Close</button>
        </div>
        <div class="row-edit-modal-fields">
          ${fields.map((field, index) => {
            const key = field.getAttribute('data-edit-field') || '';
            const value = escapeHtml(field.value || '');
            const hidden = field.type === 'hidden';
            if (key === 'deadline') {
              const dateValue = toDateInputValue(field.value || '');
              return `<label>${escapeHtml(rowEditFieldLabel(key))}<input data-modal-field-index="${index}" value="${value}" placeholder="Deadline or date" />${dateValue ? `<small class="muted">Date picker value: ${escapeHtml(dateValue)}</small>` : ''}</label>`;
            }
            if (hidden && ['type', 'topic', 'itemType', 'owner'].includes(key)) {
              return `<label>${escapeHtml(rowEditFieldLabel(key))}<input data-modal-field-index="${index}" value="${value}" /></label>`;
            }
            return `<label>${escapeHtml(rowEditFieldLabel(key))}<textarea data-modal-field-index="${index}">${value}</textarea></label>`;
          }).join('')}
        </div>
        <div class="row-edit-modal-actions"><button type="button" class="primary" data-apply-row-modal>Apply to row</button></div>
      </div>`;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('[data-close-row-modal]').addEventListener('click', close);
    modal.addEventListener('click', (event) => { if (event.target === modal) close(); });
    modal.querySelector('[data-apply-row-modal]').addEventListener('click', () => {
      modal.querySelectorAll('[data-modal-field-index]').forEach((editor) => {
        const field = fields[Number(editor.getAttribute('data-modal-field-index'))];
        if (!field) return;
        field.value = editor.value;
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.dispatchEvent(new Event('change', { bubbles: true }));
      });
      queueAutosave();
      close();
    });
    const firstField = modal.querySelector('[data-modal-field-index]');
    if (firstField) firstField.focus();
  }

  function sectionHasField(groupedRows, field) {
    return groupedRows.some(({ row }) => cleanText(row[field] || ''));
  }

  function hiddenRowFields(type, index, row, visibleFields = {}) {
    return `
      <input type="hidden" data-edit-field="type" data-edit-index="${index}" value="${escapeAttribute(type)}" />
      ${visibleFields.topic ? '' : `<input type="hidden" data-edit-field="topic" data-edit-index="${index}" value="${escapeAttribute(row.topic || '')}" />`}
      ${visibleFields.itemType ? '' : `<input type="hidden" data-edit-field="itemType" data-edit-index="${index}" value="${escapeAttribute(row.itemType || '')}" />`}
      ${visibleFields.owner ? '' : `<input type="hidden" data-edit-field="owner" data-edit-index="${index}" value="${escapeAttribute(row.owner || '')}" />`}
      ${visibleFields.deadline ? '' : `<input type="hidden" data-edit-field="deadline" data-edit-index="${index}" value="${escapeAttribute(row.deadline || '')}" />`}
      ${visibleFields.detail ? '' : `<input type="hidden" data-edit-field="detail" data-edit-index="${index}" value="${escapeAttribute(row.detail || '')}" />`}
      ${visibleFields.evidence ? '' : `<input type="hidden" data-edit-field="evidence" data-edit-index="${index}" value="${escapeAttribute(row.evidence || '')}" />`}
    `;
  }

  function renderDeadlineEditor(index, value) {
    const dateValue = toDateInputValue(value);
    return `
      <div class="deadline-editor">
        <input data-edit-field="deadline" data-edit-index="${index}" value="${escapeAttribute(value || '')}" placeholder="Deadline or date" />
        <input type="date" data-deadline-picker-index="${index}" value="${escapeAttribute(dateValue)}" title="Pick an exact date" aria-label="Pick deadline date" />
      </div>
    `;
  }

  function renderResultTableSection(type, groupedRows) {
    const showTopic = type === 'Discussion' || sectionHasField(groupedRows, 'topic');
    const showItemType = type === 'Discussion' && sectionHasField(groupedRows, 'itemType');
    const showOwner = sectionHasField(groupedRows, 'owner');
    const showDeadline = type === 'Action' || sectionHasField(groupedRows, 'deadline');
    const showDetail = false;
    const showEvidence = false;
    const outputHeader = type === 'Discussion' ? 'Discussion point' : 'Output';
    const sectionTitle = resultSectionTitle(type);
    const tableMarkup = `
      <div class="minutes-table-wrap">
        <table class="minutes-table">
          <thead>
            <tr>
              <th class="type-cell">Edit</th>
              ${showTopic ? '<th>Topic</th>' : ''}
              ${showItemType ? '<th>Type</th>' : ''}
              ${showOwner ? '<th>Owner / speaker</th>' : ''}
              <th>${escapeHtml(outputHeader)}</th>
              ${showDeadline ? '<th>Deadline / date</th>' : ''}
              ${showDetail ? '<th>Notes / context</th>' : ''}
              ${showEvidence ? '<th>Evidence / source note</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${groupedRows.map(({ row, index }) => `
              <tr>
                <td class="type-cell" data-label="Edit"><button type="button" class="secondary" data-expand-minutes-row>Open row</button></td>
                ${showTopic ? `<td class="topic-cell" data-label="Topic"><textarea data-edit-field="topic" data-edit-index="${index}">${escapeHtml(row.topic || '')}</textarea></td>` : ''}
                ${showItemType ? `<td class="topic-cell" data-label="Type"><input data-edit-field="itemType" data-edit-index="${index}" value="${escapeAttribute(row.itemType || '')}" /></td>` : ''}
                ${showOwner ? `<td class="owner-cell" data-label="Owner / speaker"><input data-edit-field="owner" data-edit-index="${index}" value="${escapeAttribute(row.owner || '')}" /></td>` : ''}
                <td class="text-cell" data-label="${escapeAttribute(outputHeader)}">
                  ${hiddenRowFields(type, index, row, { topic: showTopic, itemType: showItemType, owner: showOwner, deadline: showDeadline, detail: showDetail, evidence: showEvidence })}
                  <textarea data-edit-field="text" data-edit-index="${index}">${escapeHtml(row.text)}</textarea>
                </td>
                ${showDeadline ? `<td class="deadline-cell" data-label="Deadline / date">${renderDeadlineEditor(index, row.deadline || '')}</td>` : ''}
                ${showDetail ? `<td class="detail-cell" data-label="Notes / context"><textarea data-edit-field="detail" data-edit-index="${index}" placeholder="Notes, context, dependency or confidence...">${escapeHtml(row.detail || '')}</textarea></td>` : ''}
                ${showEvidence ? `<td class="evidence-cell" data-label="Evidence / source note"><textarea data-edit-field="evidence" data-edit-index="${index}" placeholder="Transcript evidence or source note">${escapeHtml(row.evidence || '')}</textarea></td>` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    if (type === 'Term for review') {
      return `
        <details class="result-table-section result-table-accordion">
          <summary>${escapeHtml(sectionTitle)} (${groupedRows.length})</summary>
          ${tableMarkup}
        </details>
      `;
    }

    return `
      <section class="result-table-section">
        <h3>${escapeHtml(sectionTitle)}</h3>
        ${tableMarkup}
      </section>
    `;
  }

  function renderReadableResult(payload) {
    latestResultPayload = payload;
    const output = resultOutput(payload);
    const meta = resultMeta(output);
    const rows = buildResultRows(output);

    resultView.innerHTML = `
      <div class="summary-grid">
        ${renderMetaInput('Title', 'meetingTitle', meta.meetingTitle)}
        ${renderMetaInput('Date', 'meetingDate', meta.meetingDate)}
        ${renderMetaInput('Location', 'meetingLocation', meta.meetingLocation)}
        ${renderMetaInput('Type', 'meetingType', meta.meetingType)}
        ${renderMetaInput('Client participants', 'participants.client', joinLines(meta.participants.client), true)}
        ${renderMetaInput('Trinzo participants', 'participants.trinzo', joinLines(meta.participants.trinzo), true)}
      </div>
      ${renderObjectivesEditor(meta.meetingObjectives)}
      ${renderResultTable(rows)}
    `;
  }

  function getEditedMetaFromDom() {
    const output = resultOutput(latestResultPayload);
    const meta = resultMeta(output);
    document.querySelectorAll('[data-edit-field="meta"][data-meta-field]').forEach((input) => {
      const field = input.dataset.metaField;
      if (field === 'meetingObjectives') {
        meta.meetingObjectives = parseLines(input.value);
      } else if (field === 'participants.client') {
        meta.participants.client = parseLines(input.value);
      } else if (field === 'participants.trinzo') {
        meta.participants.trinzo = parseLines(input.value);
      } else if (Object.prototype.hasOwnProperty.call(meta, field)) {
        meta[field] = cleanText(input.value || '');
      }
    });
    return meta;
  }

  function getEditedRowsFromDom() {
    const rows = latestResultRows.map((row) => ({ ...row }));
    document.querySelectorAll('[data-edit-field][data-edit-index]').forEach((input) => {
      const index = Number(input.dataset.editIndex);
      const field = input.dataset.editField;
      if (!Number.isNaN(index) && rows[index]) rows[index][field] = input.value;
    });
    return rows
      .map((row) => ({
        type: cleanText(row.type || 'Note') || 'Note',
        topic: cleanText(row.topic || ''),
        itemType: cleanText(row.itemType || ''),
        owner: cleanText(row.owner || ''),
        deadline: cleanText(row.deadline || ''),
        text: cleanText(row.text || ''),
        detail: cleanMultiline(row.detail || ''),
        evidence: cleanMultiline(row.evidence || '')
      }))
      .filter((row) => row.text);
  }

  function editedPayload() {
    return {
      jobId: activeJobId,
      editedMeta: getEditedMetaFromDom(),
      editedRows: getEditedRowsFromDom(),
      raw: latestResultPayload
    };
  }

  function setEditStatus(text, type = '') {
    const status = document.getElementById('editStatus');
    if (!status) return;
    status.textContent = text || '';
    status.className = type ? `edit-status ${type}` : 'edit-status';
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    });
  }

  function downloadText(filename, text) {
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function safeFilename(value) {
    return cleanText(value || 'meeting-minutes')
      .replace(/[^a-z0-9_-]+/gi, '_')
      .replace(/^_+|_+$/g, '')
      .slice(0, 80) || 'meeting-minutes';
  }

  function rowsForPdf(rows, type) {
    const filtered = rows.filter((row) => cleanText(row.type).toLowerCase() === type.toLowerCase());
    if (!filtered.length) return '<tr><td class="empty">None stated</td><td></td><td></td></tr>';
    return filtered.map((row) => `
      <tr>
        <td>${escapeHtml(row.topic || row.itemType || type)}</td>
        <td>${escapeHtml(row.text || '')}${row.detail ? `<br><small>${escapeHtml(row.detail)}</small>` : ''}</td>
        <td>${escapeHtml([row.owner, row.deadline].filter(Boolean).join(' · ') || 'Not stated')}</td>
      </tr>
    `).join('');
  }

  function exportEditedPdf() {
    const meta = getEditedMetaFromDom();
    const rows = getEditedRowsFromDom();
    if (!latestResultPayload || !rows.length) {
      setEditStatus('No completed minutes found to export.', 'error');
      return;
    }
    const title = meta.meetingTitle || `Meeting minutes #${activeJobId || ''}`.trim() || 'Meeting minutes';
    const html = `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>${escapeHtml(title)}</title>
<style>
  @page { size: A4; margin: 14mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #111827; margin: 0; font-size: 11pt; }
  h1 { font-size: 20pt; margin: 0 0 8px; color: #0f172a; }
  h2 { font-size: 13pt; margin: 18px 0 8px; color: #0f172a; }
  .toolbar { position: sticky; top: 0; margin: 0 0 12px; padding: 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; }
  .toolbar button { background: #14b8a6; color: #042f2e; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; page-break-inside: auto; margin-bottom: 12px; }
  tr { page-break-inside: avoid; page-break-after: auto; }
  th, td { border: 1px solid #cbd5e1; padding: 7px 8px; vertical-align: top; text-align: left; }
  th { background: #e2e8f0; font-weight: 700; color: #0f172a; }
  small, .empty, .footer { color: #64748b; }
  .footer { margin-top: 18px; font-size: 9pt; }
  @media print { .toolbar { display: none; } }
</style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="window.print()">Print / Save as PDF</button></div>
  <h1>${escapeHtml(title)}</h1>
  <table>
    <tr><th style="width:28%">Date</th><td>${escapeHtml(meta.meetingDate || 'Not stated')}</td></tr>
    <tr><th>Location</th><td>${escapeHtml(meta.meetingLocation || 'Not stated')}</td></tr>
    <tr><th>Objectives</th><td>${escapeHtml(meta.meetingObjectives.join('\n') || 'Not stated').replace(/\n/g, '<br>')}</td></tr>
    <tr><th>Client participants</th><td>${escapeHtml(meta.participants.client.join('\n') || 'Not stated').replace(/\n/g, '<br>')}</td></tr>
    <tr><th>Trinzo participants</th><td>${escapeHtml(meta.participants.trinzo.join('\n') || 'Not stated').replace(/\n/g, '<br>')}</td></tr>
  </table>
  <h2>Discussion points</h2>
  <table><thead><tr><th style="width:24%">Topic</th><th>Point</th><th style="width:22%">Owner / date</th></tr></thead><tbody>${rowsForPdf(rows, 'Discussion')}</tbody></table>
  <h2>Decisions</h2>
  <table><thead><tr><th style="width:24%">Topic</th><th>Decision</th><th style="width:22%">Owner / date</th></tr></thead><tbody>${rowsForPdf(rows, 'Decision')}</tbody></table>
  <h2>Actions</h2>
  <table><thead><tr><th style="width:24%">Topic</th><th>Action</th><th style="width:22%">Owner / deadline</th></tr></thead><tbody>${rowsForPdf(rows, 'Action')}</tbody></table>
  <div class="footer">Generated from Trinzo meeting minutes job #${escapeHtml(activeJobId || '')}. Review before sharing.</div>
  <script>window.addEventListener('load', () => { window.focus(); setTimeout(() => window.print(), 400); });<\/script>
</body>
</html>`;
    const printWindow = window.open('about:blank', '_blank', 'width=1100,height=800');
    if (!printWindow) {
      downloadText(`${safeFilename(title)}.html`, html);
      setEditStatus('Popup blocked, so an HTML export was downloaded. Open it and choose Print → Save as PDF.', 'success');
      return;
    }
    printWindow.document.open();
    printWindow.document.write(html);
    printWindow.document.close();
    printWindow.focus();
    setEditStatus('PDF export opened. Choose “Save as PDF” in the print dialog.', 'success');
  }

  function editedTextExport() {
    const meta = getEditedMetaFromDom();
    const parts = [
      `Title: ${meta.meetingTitle || '—'}`,
      `Date: ${meta.meetingDate || '—'}`,
      `Location: ${meta.meetingLocation || '—'}`,
      `Type: ${meta.meetingType || '—'}`,
      `Client participants: ${meta.participants.client.join(', ') || '—'}`,
      `Trinzo participants: ${meta.participants.trinzo.join(', ') || '—'}`
    ];
    if (meta.meetingObjectives.length) {
      parts.push(`Meeting objectives:\n${meta.meetingObjectives.map((objective) => `- ${objective}`).join('\n')}`);
    }
    const rows = getEditedRowsFromDom()
      .map((row) => {
        const details = [
          row.text,
          row.deadline ? `Deadline: ${row.deadline}` : '',
          row.detail ? `Detail: ${row.detail}` : '',
          row.evidence ? `Evidence: ${row.evidence}` : ''
        ].filter(Boolean).join('\n');
        const label = [row.type, row.topic, row.itemType, row.owner].filter(Boolean).join(' | ');
        return `${label || row.type}\n${details}`;
      })
      .join('\n\n');
    return rows ? `${parts.join('\n')}\n\n${rows}` : parts.join('\n');
  }

  async function saveEditedResult(automatic = false) {
    if (!activeJobId) return;
    const rows = getEditedRowsFromDom();
    try {
      const payload = await fetchJson(`/api/meeting-minutes-final/jobs/${encodeURIComponent(activeJobId)}/result`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ editedMeta: getEditedMetaFromDom(), editedRows: rows })
      });
      latestResultPayload = payload.result || latestResultPayload;
      if (payload.result) resultJson.textContent = JSON.stringify(payload.result, null, 2);
      editDirty = false;
      setEditStatus(`${automatic ? 'Autosaved' : 'Saved'} at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success');
    } catch (error) {
      setEditStatus(error.message || 'Could not save edits.', 'error');
    }
  }

  function queueAutosave() {
    editDirty = true;
    setEditStatus('Unsaved changes...');
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => saveEditedResult(true), 1000);
  }

  function renderProgress(job) {
    const pct = Math.max(0, Math.min(100, Number(job.progressPercent || 0)));
    return `
      <div class="progress">
        <div>${pct}% · ${escapeHtml(friendlyLabel(job.stage || job.status || 'queued'))}</div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <small class="muted">${escapeHtml(job.statusMessage || '')}</small>
      </div>
    `;
  }

  function jobTypeLabel(job) {
    const type = String(job.jobType || '').toLowerCase();
    if (type === 'staged_meeting_minutes_review') return 'Staged meeting minutes';
    if (type === 'staged_meeting_minutes_stage') return 'Staged stage generation';
    if (type === 'project_update_generate') return 'Project update';
    return 'Meeting minutes';
  }

  function jobTitle(job) {
    const fallback = job.jobType === 'project_update_generate' ? 'Project update job' : 'Meeting minutes job';
    if (isStagedJob(job)) return job.meetingTitle || 'Staged meeting-minutes review';
    return job.meetingTitle || fallback;
  }

  function currentQueueType() {
    const type = new URLSearchParams(window.location.search).get('type') || '';
    return type === 'staged-meeting-minutes' ? type : '';
  }

  function updateQueueTabs() {
    const current = currentQueueType();
    document.querySelectorAll('.queue-tab[href]').forEach((tab) => {
      const url = new URL(tab.getAttribute('href'), window.location.origin);
      const tabType = url.searchParams.get('type') || '';
      if (tabType === current) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  function renderJobs(jobs) {
    visibleJobs = jobs;
    selectedJobs.clear();
    updateBulkControls();
    if (!jobs.length) {
      const type = currentQueueType();
      listView.innerHTML = `<p class="muted">No ${type === 'project-updates' ? 'project-update' : type === 'meeting-minutes' ? 'meeting-minutes' : ''} items yet.</p>`;
      return;
    }
    listView.innerHTML = `
      <div class="jobs-table-wrap">
        <table class="jobs">
          <thead>
            <tr>
              <th aria-label="Select"></th>
              <th>Meeting</th>
              <th>Started</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${jobs.map((job) => `
              <tr>
                <td data-label="Select"><input class="job-select" type="checkbox" data-select-job="${escapeHtml(job.jobId)}" aria-label="Select ${escapeHtml(jobTitle(job))}" ${canArchive(job) ? '' : 'disabled'} /></td>
                <td data-label="Meeting"><strong>${escapeHtml(jobTitle(job))}</strong></td>
                <td data-label="Started">${escapeHtml(formatDate(job.createdAt))}</td>
                <td data-label="Status"><span class="status ${statusClass(job.status)}">${escapeHtml(friendlyLabel(job.status || 'queued'))}</span>${job.stage && job.stage !== job.status ? `<br><small class="muted">${escapeHtml(friendlyLabel(job.stage))}</small>` : ''}${job.errorMessage ? `<br><small class="muted">${escapeHtml(job.errorMessage)}</small>` : ''}</td>
                <td data-label="Actions" class="row-actions">
                  ${isLocalStagedDraft(job) ? `<a class="button" href="${escapeAttribute(job.resumeUrl)}">Resume</a><button class="danger" data-delete-staged="${escapeHtml(job.jobId)}" type="button">Delete</button>` : ''}
                  ${job.jobType === 'staged_meeting_minutes_stage' ? `<a class="button resume-staged" href="${escapeAttribute(job.resumeUrl)}">Resume staged review <span aria-hidden="true">›</span></a>` : ''}
                  ${!isStagedJob(job) && job.status === 'completed' ? `<a class="button" target="_blank" rel="noopener" href="/jobs/${encodeURIComponent(job.jobId)}/result">${job.jobType === 'project_update_generate' ? 'Open job' : 'Open result'}</a>` : ''}
                  ${!isStagedJob(job) && job.status === 'failed' ? `<button class="secondary" data-retry="${escapeHtml(job.jobId)}" type="button">Retry</button>` : ''}
                  ${!isStagedJob(job) && (job.status === 'queued' || job.status === 'running') ? `<button class="danger" data-cancel="${escapeHtml(job.jobId)}" type="button">Cancel</button>` : ''}
                  ${!isStagedJob(job) && ['completed', 'failed', 'cancelled'].includes(job.status) ? `<button class="danger" data-delete="${escapeHtml(job.jobId)}" type="button">Delete</button>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function canArchive(job) {
    return Boolean(job);
  }

  function updateBulkControls() {
    const eligible = visibleJobs.filter(canArchive);
    const selectedCount = [...selectedJobs].filter((id) => eligible.some((job) => String(job.jobId) === id)).length;
    bulkBar.hidden = !eligible.length;
    bulkCount.textContent = `${selectedCount} selected`;
    archiveSelectedBtn.disabled = selectedCount === 0;
    archiveAllBtn.disabled = eligible.length === 0;
    selectAllJobs.checked = eligible.length > 0 && selectedCount === eligible.length;
    selectAllJobs.indeterminate = selectedCount > 0 && selectedCount < eligible.length;
  }

  async function archiveJobs(jobs, allFinished = false) {
    if (!jobs.length) return;
    const prompt = allFinished
      ? 'Archive every staged meeting-minutes item in Library?'
      : `Archive ${jobs.length} selected item${jobs.length === 1 ? '' : 's'}?`;
    if (!window.confirm(`${prompt} They will be hidden, not deleted.`)) return;
    const localIds = jobs.filter(isLocalStagedDraft).map((job) => job.jobId);
    const serverIds = jobs.filter((job) => !isLocalStagedDraft(job)).map((job) => job.jobId);
    try {
      if (serverIds.length || allFinished) {
        await fetchJson('/api/jobs/archive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(allFinished ? { archiveAll: true } : { jobIds: serverIds })
        });
      }
      if (localIds.length) archiveStagedDrafts(localIds);
      setMessage(`${jobs.length} item${jobs.length === 1 ? '' : 's'} archived.`, 'success');
      await loadList();
    } catch (error) {
      setMessage(error.message || 'Could not archive the selected items.', 'error');
    }
  }

  function summaryItem(label, value) {
    return `<div class="summary-item"><div class="summary-label">${escapeHtml(label)}</div><div class="summary-value">${escapeHtml(value || '—')}</div></div>`;
  }

  function progressSummary(job) {
    const pct = Math.max(0, Math.min(100, Number(job.progressPercent || 0)));
    const label = friendlyLabel(job.stage || job.status || 'queued');
    return `${pct}% · ${label}`;
  }

  function renderDetail(payload) {
    const job = payload.job;
    if (!job) return;
    activeJobId = job.jobId;
    detailPanel.hidden = false;
    detailTitle.textContent = `${jobTypeLabel(job)} #${job.jobId}: ${jobTitle(job)}`;
    retryBtn.disabled = job.status !== 'failed' && job.status !== 'completed' && !isStaleStagedJob(job);
    cancelBtn.disabled = job.status !== 'queued' && job.status !== 'running';
    retryBtn.style.display = '';
    cancelBtn.style.display = '';
    detailSummary.innerHTML = [
      summaryItem('Status', friendlyLabel(job.status)),
      summaryItem('Type', jobTypeLabel(job)),
      summaryItem('Progress', progressSummary(job)),
      summaryItem('Message', job.statusMessage || job.errorMessage),
      summaryItem('Runtime', runtime(job)),
      summaryItem('Attempts', `${job.attempts || 0} / ${job.maxAttempts || 0}`),
      summaryItem('Created', formatDate(job.createdAt)),
      summaryItem('Updated', formatDate(job.updatedAt))
    ].join('');

    if (job.jobType === 'staged_meeting_minutes_stage' && job.status !== 'completed') {
      resultMessage.textContent = isStaleStagedJob(job)
        ? 'This staged generation appears stalled. Resume will safely requeue the stage and return you to the review screen.'
        : 'This staged generation is still in progress. Resume opens the staged review and keeps checking for the completed screen.';
      resultActions.hidden = false;
      resultActions.innerHTML = `
        <a class="button" href="${escapeAttribute(job.resumeUrl)}">Resume staged review</a>
        <a class="button secondary" href="/staged-meeting-minutes">Start another staged review</a>
      `;
      resultView.innerHTML = '';
      rawResultDetails.hidden = true;
      resultJson.textContent = '';
      return;
    }

    if (job.status === 'completed' && payload.result) {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      resultMessage.textContent = 'Completed result:';
      resultActions.hidden = false;
      if (job.jobType === 'project_update_generate') {
        const saved = payload.result?.result?.projectReportPersistence || payload.result?.projectReportPersistence || {};
        const reportId = saved.reportId || saved.report_id || '';
        resultActions.innerHTML = `
          <a class="button" target="_blank" rel="noopener" href="/jobs/${encodeURIComponent(job.jobId)}/result">Open result in new tab</a>
          ${reportId ? `<a class="button secondary" target="_blank" rel="noopener" href="/project-update-test/reports/${encodeURIComponent(reportId)}">Open saved report</a>` : ''}
        `;
        resultView.innerHTML = `
          <div class="result-section">
            <h3>Project update ready</h3>
            <p class="muted">${reportId ? 'The draft report was saved and can be reviewed from Reports.' : 'The generation result is stored on this job. Raw result JSON is below for support review.'}</p>
          </div>
        `;
      } else if (job.jobType === 'staged_meeting_minutes_stage') {
        const resumeUrl = payload.result?.resumeUrl || payload.result?.result?.resumeUrl || job.resumeUrl || `/staged-meeting-minutes?stageJobId=${encodeURIComponent(job.jobId)}`;
        resultActions.innerHTML = `
          <a class="button" href="${escapeAttribute(resumeUrl)}">Resume staged review</a>
          <a class="button secondary" href="/staged-meeting-minutes">Start another staged review</a>
          <button class="danger" data-delete="${escapeHtml(job.jobId)}" type="button">Delete job</button>
        `;
        resultView.innerHTML = `
          <div class="result-section">
            <h3>Staged screen ready</h3>
            <p class="muted">This stage finished in the backend. Resume the staged tool to review the generated screen.</p>
          </div>
        `;
      } else {
        resultActions.innerHTML = `
          <a class="button" target="_blank" rel="noopener" href="/jobs/${encodeURIComponent(job.jobId)}/result">Open result in new tab</a>
          <button id="saveEditedResultBtn" type="button">Save edits</button>
          <button id="copyEditedTableBtn" class="secondary" type="button">Copy table text</button>
          <button id="exportEditedPdfBtn" class="secondary" type="button">Export PDF</button>
          <button id="clearEditedRowsBtn" class="danger" type="button">Clear rows</button>
          <details class="advanced-result-tools">
            <summary>Advanced / debug</summary>
            <div class="advanced-body">
              <button id="downloadEditedJsonBtn" class="secondary" type="button">Download edited JSON</button>
              <span>Raw result JSON is below for troubleshooting.</span>
            </div>
          </details>
          <span id="editStatus" class="edit-status"></span>
        `;
        renderReadableResult(payload.result);
      }
      rawResultDetails.hidden = false;
      const rawSummary = rawResultDetails.querySelector('summary');
      if (rawSummary) rawSummary.textContent = 'Advanced: raw result JSON';
      resultJson.textContent = JSON.stringify(payload.result, null, 2);
    } else {
      resultMessage.textContent = job.status === 'failed'
        ? (job.errorMessage || 'This job failed.')
        : 'Result will appear here when the job completes.';
      resultActions.hidden = true;
      resultActions.innerHTML = '';
      resultView.innerHTML = '';
      rawResultDetails.hidden = true;
      resultJson.textContent = '';
    }
  }

  function renderStagedDetail(job) {
    if (!job) return;
    activeStagedDraftId = job.jobId;
    detailPanel.hidden = false;
    detailTitle.textContent = `${jobTypeLabel(job)}: ${jobTitle(job)}`;
    retryBtn.disabled = true;
    cancelBtn.disabled = true;
    retryBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    detailSummary.innerHTML = [
      summaryItem('Status', friendlyLabel(job.status)),
      summaryItem('Type', jobTypeLabel(job)),
      summaryItem('Progress', progressSummary(job)),
      summaryItem('Current screen', job.stage),
      summaryItem('Created', formatDate(job.createdAt)),
      summaryItem('Updated', formatDate(job.updatedAt))
    ].join('');
    resultMessage.textContent = 'This is a staged review draft. Resume opens the screen where the reviewer last left off.';
    resultActions.hidden = false;
    resultActions.innerHTML = `
      <a class="button" href="${escapeAttribute(job.resumeUrl)}">Resume staged review</a>
      <a class="button secondary" href="/staged-meeting-minutes">Start another staged review</a>
      <button class="danger" data-delete-staged-detail="${escapeHtml(job.jobId)}" type="button">Remove draft</button>
    `;
    const steps = ['Details', 'Summary', 'Discussion', 'Actions', 'Final review'];
    resultView.innerHTML = `
      <section class="staged-detail-card">
        <h3>Review progress</h3>
        <div class="staged-step-list">
          ${steps.map((step, index) => `
            <div class="staged-step ${index === job.activeScreen ? 'current' : ''}">
              <strong>${index + 1}. ${escapeHtml(step)}</strong>
              <span>${index < job.activeScreen ? 'Checked' : index === job.activeScreen ? 'Resume here' : 'Not reached'}</span>
            </div>
          `).join('')}
        </div>
        <p class="muted">Paused staged reviews are saved in this browser. AI-generated staged screens run as backend jobs, so you can close the tab while a stage is being generated.</p>
      </section>
    `;
    rawResultDetails.hidden = true;
    resultJson.textContent = '';
  }

  async function fetchJson(url, options) {
    const response = await fetch(url, { credentials: 'same-origin', ...(options || {}) });
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload || payload.ok === false) {
      throw new Error(payload?.error || `Request failed with status ${response.status}`);
    }
    return payload;
  }

  async function loadList() {
    if (resultOnly) return;
    updateQueueTabs();
    const type = currentQueueType();
    const staged = stagedJobs();
    const payload = await fetchJson('/api/jobs?limit=100&type=staged-meeting-minutes');
    const jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
    renderJobs(staged.concat(jobs));
  }

  async function loadDetail() {
    if (activeStagedDraftId) {
      renderStagedDetail(stagedJobs().find((job) => String(job.jobId) === String(activeStagedDraftId)));
      return;
    }
    if (!activeJobId) return;
    if (editDirty || editFocused || autosaveTimer) return;
    const payload = await fetchJson(`/api/jobs/${encodeURIComponent(activeJobId)}`);
    renderDetail(payload);
  }

  async function refresh() {
    try {
      await loadList();
      await loadDetail();
      setMessage('', '');
    } catch (error) {
      setMessage(error.message || 'Could not refresh jobs.', 'error');
    }
  }

  async function act(action, jobId) {
    try {
      await fetchJson(`/api/jobs/${encodeURIComponent(jobId)}/${action}`, { method: 'POST' });
      setMessage(action === 'retry' ? 'Job queued for retry.' : 'Job cancellation requested.', 'success');
      await refresh();
    } catch (error) {
      setMessage(error.message || `Could not ${action} job.`, 'error');
    }
  }

  async function deleteJob(jobId) {
    if (!window.confirm('Delete this job, stored transcript and generated result?')) return;
    try {
      await fetchJson(`/api/jobs/${encodeURIComponent(jobId)}`, { method: 'DELETE' });
      setMessage('Job deleted.', 'success');
      if (String(activeJobId) === String(jobId)) {
        activeJobId = null;
        detailPanel.hidden = true;
        history.replaceState(null, '', '/jobs');
      }
      await refresh();
    } catch (error) {
      setMessage(error.message || 'Could not delete job.', 'error');
    }
  }

  listView.addEventListener('click', (event) => {
    const retry = event.target.closest('[data-retry]');
    const cancel = event.target.closest('[data-cancel]');
    const deleteButton = event.target.closest('[data-delete]');
    const deleteStagedButton = event.target.closest('[data-delete-staged]');
    if (retry) act('retry', retry.dataset.retry);
    if (cancel) act('cancel', cancel.dataset.cancel);
    if (deleteButton) deleteJob(deleteButton.dataset.delete);
    if (deleteStagedButton) {
      if (!window.confirm('Remove this staged review draft from this browser?')) return;
      deleteStagedDraft(deleteStagedButton.dataset.deleteStaged);
      refresh();
    }
  });
  listView.addEventListener('change', (event) => {
    const checkbox = event.target.closest('[data-select-job]');
    if (!checkbox) return;
    const id = String(checkbox.dataset.selectJob);
    if (checkbox.checked) selectedJobs.add(id);
    else selectedJobs.delete(id);
    updateBulkControls();
  });
  selectAllJobs.addEventListener('change', () => {
    selectedJobs.clear();
    if (selectAllJobs.checked) visibleJobs.filter(canArchive).forEach((job) => selectedJobs.add(String(job.jobId)));
    listView.querySelectorAll('[data-select-job]').forEach((checkbox) => { checkbox.checked = selectedJobs.has(String(checkbox.dataset.selectJob)); });
    updateBulkControls();
  });
  archiveSelectedBtn.addEventListener('click', () => archiveJobs(visibleJobs.filter((job) => selectedJobs.has(String(job.jobId)))));
  archiveAllBtn.addEventListener('click', () => archiveJobs(visibleJobs.filter(canArchive), true));
  resultActions.addEventListener('click', (event) => {
    const deleteBackendJob = event.target.closest('[data-delete]');
    if (deleteBackendJob) {
      deleteJob(deleteBackendJob.dataset.delete);
      return;
    }
    const deleteStagedDetail = event.target.closest('[data-delete-staged-detail]');
    if (deleteStagedDetail) {
      if (!window.confirm('Remove this staged review draft from this browser?')) return;
      deleteStagedDraft(deleteStagedDetail.dataset.deleteStagedDetail);
      activeStagedDraftId = '';
      detailPanel.hidden = true;
      history.replaceState(null, '', '/jobs?type=staged-meeting-minutes');
      refresh();
      return;
    }
    if (event.target.closest('#saveEditedResultBtn')) saveEditedResult(false);
    if (event.target.closest('#copyEditedTableBtn')) {
      copyText(editedTextExport());
      setEditStatus('Copied table text.', 'success');
    }
    if (event.target.closest('#exportEditedPdfBtn')) exportEditedPdf();
    if (event.target.closest('#downloadEditedJsonBtn')) {
      downloadText(`meeting-minutes-job-${activeJobId || 'result'}-edited.json`, JSON.stringify(editedPayload(), null, 2));
      setEditStatus('Downloaded edited JSON.', 'success');
    }
    if (event.target.closest('#clearEditedRowsBtn')) {
      if (!window.confirm('Clear all edited rows from this result? Save afterwards only if you want the empty table to persist.')) return;
      latestResultRows = [];
      const tbody = resultView.querySelector('.minutes-table tbody');
      if (tbody) tbody.innerHTML = '';
      setEditStatus('Rows cleared. Save to persist this empty edited table.', 'error');
    }
  });
  resultView.addEventListener('input', (event) => {
    if (event.target.closest('[data-edit-field]')) queueAutosave();
  });
  resultView.addEventListener('click', (event) => {
    const expand = event.target.closest('[data-expand-minutes-row]');
    if (!expand) return;
    openRowEditModal(expand.closest('tr'));
  });
  resultView.addEventListener('change', (event) => {
    const picker = event.target.closest('[data-deadline-picker-index]');
    if (!picker || !picker.value) return;
    const input = Array.from(resultView.querySelectorAll('[data-edit-field="deadline"][data-edit-index]'))
      .find((candidate) => candidate.dataset.editIndex === picker.dataset.deadlinePickerIndex);
    if (!input) return;
    input.value = picker.value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  });
  resultView.addEventListener('focusin', (event) => {
    if (event.target.closest('[data-edit-field], [data-deadline-picker-index]')) editFocused = true;
  });
  resultView.addEventListener('focusout', () => {
    setTimeout(() => {
      editFocused = Boolean(resultView.querySelector('[data-edit-field]:focus, [data-deadline-picker-index]:focus'));
    }, 0);
  });
  retryBtn.addEventListener('click', () => activeJobId && act('retry', activeJobId));
  cancelBtn.addEventListener('click', () => activeJobId && act('cancel', activeJobId));
  refreshBtn.addEventListener('click', refresh);

  if (resultOnly) {
    listPanel.hidden = true;
    document.title = activeJobId ? `Job result #${activeJobId}` : 'Job result';
  }
  refresh();
  timer = setInterval(refresh, 5000);
  window.addEventListener('beforeunload', () => clearInterval(timer));
})();
</script>
</body>
</html>
