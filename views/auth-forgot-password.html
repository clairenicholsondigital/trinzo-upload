<!doctype html><html lang="en"><head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
<meta charset='utf-8'><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Trinzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .auth-wrap { max-width: 460px; margin: 8vh auto 0; padding: 0 1rem; }
  .auth-wrap .brand-logo { height: 28px; margin-bottom: 1.25rem; }
  .auth-wrap .field { margin: 0 0 .8rem; }
  .auth-wrap .step { margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
  .auth-wrap #out { color: var(--muted); }
</style>
  <link rel="stylesheet" href="/static/trinzo.css">
  <script defer src="/static/trinzo.js"></script>
</head><body>
<div class="auth-wrap">
  <img class="brand-logo" src="/static/trinzo-logo-dark.svg" alt="Trinzo">
  <div class="panel">
    <p class="eyebrow">Account</p>
    <h1>Reset password</h1>
    <p class="muted"><a href='/auth/login'>Back to login</a></p>

    <div class="field"><label for="email">Email</label>
      <input id='email' placeholder='you@example.com'></div>
    <button class="button" id='forgot'>Request reset token</button>

    <div class="step">
      <div class="field"><label for="token">Reset token</label>
        <input id='token' placeholder='Paste the reset token'></div>
      <div class="field"><label for="newPassword">New password</label>
        <input id='newPassword' type='password' placeholder='New password'></div>
      <button class="button" id='reset'>Reset password</button>
    </div>

    <p id='out' role='status'></p>
  </div>
</div>
<script>
forgot.onclick=async()=>{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const data=await r.json().catch(()=>({}));out.textContent=r.ok?'Password reset requested. Check the configured delivery channel for the reset token.':(data.error||'Could not request a reset token.')};
reset.onclick=async()=>{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value,newPassword:newPassword.value})});const data=await r.json().catch(()=>({}));out.textContent=r.ok?'Password reset. You can now log in.':(data.error||'Could not reset password.')};
</script>
</body></html>
