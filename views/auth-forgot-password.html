<!doctype html><html><head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
<meta charset='utf-8'><title>Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  body { font-family:"Roboto",sans-serif; font-optical-sizing:auto; font-style:normal; font-variation-settings:"wdth" 100; }
</style>
</head><body><h1>Reset password</h1>
<p><a href='/auth'>Back to auth</a></p>
<input id='email' placeholder='Email'><button id='forgot'>Request reset token</button>
<input id='token' placeholder='Reset token'><input id='newPassword' type='password' placeholder='New password'><button id='reset'>Reset password</button><p id='out' role='status'></p>
<script>
forgot.onclick=async()=>{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const data=await r.json().catch(()=>({}));out.textContent=r.ok?'Password reset requested. Check the configured delivery channel for the reset token.':(data.error||'Could not request a reset token.')};
reset.onclick=async()=>{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value,newPassword:newPassword.value})});const data=await r.json().catch(()=>({}));out.textContent=r.ok?'Password reset. You can now log in.':(data.error||'Could not reset password.')};
</script></body></html>
