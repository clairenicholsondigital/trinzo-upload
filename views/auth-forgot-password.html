<!doctype html><html><head><meta charset='utf-8'><title>Forgot Password</title></head><body><h1>Forgot Password</h1>
<p><a href='/auth'>Back to auth</a></p>
<input id='email' placeholder='Email'><button id='forgot'>Request reset token</button>
<input id='token' placeholder='Reset token'><input id='newPassword' type='password' placeholder='New password'><button id='reset'>Reset Password</button><pre id='out'></pre>
<script>
forgot.onclick=async()=>{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});out.textContent=JSON.stringify(await r.json(),null,2)};
reset.onclick=async()=>{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value,newPassword:newPassword.value})});out.textContent=JSON.stringify(await r.json(),null,2)};
</script></body></html>
