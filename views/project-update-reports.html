<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project update reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
.container { max-width:1280px; margin:0 auto; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
a { color:#67e8f9; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, .muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.75rem; }
.item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.label { color:var(--muted); font-size:.85rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:920px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
.actions { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; }
.bulk-actions { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:.75rem; }
.bulk-actions .status { margin:0; }
.select-cell { width:3rem; text-align:center; }
.select-cell input { width:auto; margin:0; }
.brand { display:flex; gap:.75rem; align-items:center; margin-right:auto; }
.brand img { width:132px; height:auto; background:#071126; border:1px solid var(--border); border-radius:6px; padding:.45rem; }
.print-only { display:none; }
.json-tools { display:flex; justify-content:flex-start; margin:.75rem 0 .5rem; }
.json-tools button { opacity:.82; padding:.42rem .62rem; font-size:.9rem; }
.button-link, button { display:inline-block; background:#132847; color:#dbeafe; border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; font-weight:700; text-decoration:none; white-space:nowrap; cursor:pointer; font:inherit; }
button.primary { background:linear-gradient(180deg,var(--accent),#0fb5ab); border-color:#0fb5ab; color:#02173B; }
button.danger { background:#7f1d1d; border-color:#dc2626; color:#fee2e2; }
button:disabled { opacity:.6; cursor:not-allowed; }
label { display:block; color:var(--muted); font-size:.86rem; font-weight:700; }
input, select, textarea { width:100%; margin-top:.35rem; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.65rem; font:inherit; }
textarea { min-height:7rem; resize:vertical; }
.json-editor { min-height:36rem; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.9rem; }
.inline-edit-table textarea { min-height:4.5rem; }
.inline-edit-table input, .inline-edit-table select, .inline-edit-table textarea { min-width:10rem; }
.inline-edit-table td { min-width:12rem; }
.inline-edit-table .narrow { min-width:8rem; }
.editor-note { margin:.35rem 0 .75rem; color:var(--muted); }
.row-tools { display:flex; gap:.4rem; flex-wrap:wrap; }
pre { white-space:pre-wrap; overflow:auto; max-height:560px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.support-details { background:rgba(7,17,38,.35); border:1px solid rgba(148,163,184,.22); border-radius:12px; padding:.7rem .85rem; color:var(--muted); }
.support-details summary { cursor:pointer; color:#cbd5e1; font-weight:700; }
.support-details[open] { background:rgba(7,17,38,.62); }
.support-details details { border-top:1px solid rgba(148,163,184,.16); padding-top:.65rem; }
.support-details textarea, .support-details pre { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.9rem; }
.status { margin:.75rem 0; color:var(--muted); }
.status.error { color:#fecaca; }
.status.success { color:#bbf7d0; }
.status-badge { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:999px; padding:.2rem .55rem; font-size:.88rem; font-weight:700; color:#dbeafe; background:#132847; white-space:nowrap; }
.status-completed, .status-approved, .status-resolved { background:rgba(22,163,74,.18); border-color:rgba(34,197,94,.45); color:#bbf7d0; }
.status-on_track, .status-stable { background:rgba(37,99,235,.18); border-color:rgba(59,130,246,.45); color:#bfdbfe; }
.status-at_risk, .status-delayed, .status-replanned, .status-in_review { background:rgba(245,158,11,.18); border-color:rgba(245,158,11,.45); color:#fde68a; }
.status-blocked, .status-deteriorating { background:rgba(220,38,38,.18); border-color:rgba(248,113,113,.45); color:#fecaca; }
.status-not_started, .status-draft, .status-unknown { background:rgba(148,163,184,.14); border-color:rgba(148,163,184,.35); color:#cbd5e1; }
.safeguard-banner { margin:.75rem 0; padding:.75rem; border-radius:10px; background:rgba(23,208,196,.08); border:1px solid rgba(23,208,196,.35); color:#dbeafe; }
.safeguard-banner.quiet { background:rgba(15,23,42,.42); border-color:rgba(148,163,184,.28); color:#cbd5e1; }
.safeguard-banner.warning { background:#3a2c15; border-color:#7f5f1d; color:#fde68a; }
.safeguard-banner.success { background:#0f2f29; border-color:#116149; color:#bbf7d0; }
.summary { max-width:56rem; }
.colour-field { display:flex; align-items:center; justify-content:center; min-height:1.6rem; }
.colour-swatch { display:inline-block; width:1.35rem; height:1.35rem; border-radius:999px; border:2px solid rgba(238,243,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); }
.colour-swatch.unknown { background:transparent; border-style:dashed; border-color:var(--muted); }
.colour-with-label { display:inline-flex; align-items:center; gap:.45rem; }
@media print {
  body { background:#fff; color:#111827; padding:0; }
  .nav, .actions, .edit-panel, details { display:none !important; }
  .print-only { display:inline-block; }
  .panel { background:#fff; color:#111827; border-color:#d1d5db; break-inside:avoid; }
  .print-footer { display:block !important; position:fixed; left:0; right:0; bottom:0; color:#6b7280; font-size:8px; border-top:1px solid #d1d5db; padding-top:2mm; }
  .print-footer::after { content:"Page " counter(page); float:right; }
  a { color:#111827; }
  th { background:#f3f4f6; color:#111827; }
  th, td, .table-scroll { border-color:#d1d5db; }
  .colour-field { min-height:auto; }
  .colour-swatch {
    width:10px;
    height:10px;
    border-width:1px;
    border-color:#111827;
    box-shadow:none;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
    forced-color-adjust:none;
  }
  .colour-swatch.unknown { border-color:#6b7280; }
}
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/meeting-minutes-final">Meeting transcript to minutes</a>
    <a href="/project-update-test?stage=reports">← Back to workspace</a>
    <a href="/project-update-test/roadmap">Roadmap</a>
    <a href="/archive">Archive</a>
  </nav>
  <main id="app">
    <section class="panel"><h1>Project update reports</h1><p class="intro">Loading saved reports...</p></section>
  </main>
</div>
<script>
(function () {
  const app = document.getElementById('app');

  function authedFetch(url, options = {}) {
    return fetch(url, { credentials: 'same-origin', ...options });
  }

  function authMessage() {
    return 'You need to log in before changing project reports. Open /auth/login, then retry this action.';
  }
  const reportMatch = location.pathname.match(/\/project-update-test\/reports\/(\d+)$/);
  const reportId = reportMatch ? reportMatch[1] : '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateValue(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value).replace(/T/g, ' ').replace(/Z$/i, '') : date.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  }

  function displayDate(value) {
    if (!value) return '-';
    const text = String(value || '').trim();
    const isoDate = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
    const usDate = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (isoDate) return `${isoDate[3]}/${isoDate[2]}/${isoDate[1]}`;
    if (usDate) return `${usDate[2].padStart(2, '0')}/${usDate[1].padStart(2, '0')}/${usDate[3]}`;
    const date = new Date(text);
    return Number.isNaN(date.getTime()) ? text : date.toLocaleDateString('en-GB');
  }

  function friendlyLabel(value) {
    const key = String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    const labels = {
      draft: 'Draft',
      in_review: 'In review',
      approved: 'Approved',
      archived: 'Archived',
      completed: 'Completed',
      on_track: 'On track',
      at_risk: 'At risk',
      delayed: 'Delayed',
      blocked: 'Blocked',
      not_started: 'Not started',
      unknown: 'Not yet assessed',
      stable: 'Stable',
      improving: 'Improving',
      deteriorating: 'Deteriorating',
      replanned: 'Replanned',
      new_update: 'New update',
      new_risk: 'New risk',
      resolved: 'Resolved',
      manual_edit: 'Manual edit',
      autosave: 'Autosave',
      generated: 'Generated'
    };
    if (labels[key]) return labels[key];
    const label = String(value || '').replace(/[_-]+/g, ' ').trim();
    return label ? label.replace(/\b\w/g, (letter) => letter.toUpperCase()) : '-';
  }

  function statusBadge(value) {
    const key = String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'unknown';
    return `<span class="status-badge status-${escapeHtml(key)}">${escapeHtml(friendlyLabel(value))}</span>`;
  }

  function titleLabel(value) {
    return String(value || '').replace(/[_-]+/g, ' ').trim().replace(/\b\w/g, (letter) => letter.toUpperCase()) || '-';
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function staticText(value) {
    if (Array.isArray(value)) return value.map((item) => String(item || '').trim()).filter(Boolean).join('\n') || '-';
    return String(value || '').trim() || '-';
  }

  function proseOrLabel(value) {
    const text = String(value || '').trim();
    if (!text) return '-';
    const looksLikeEnum = /^[a-z0-9_-]+$/i.test(text) && !text.includes(' ');
    return looksLikeEnum ? friendlyLabel(text) : text;
  }

  function colourValue(value) {
    const key = String(value || '').trim().toLowerCase().replace(/[^a-z]+/g, '_');
    const colours = {
      blue: '#2563eb',
      green: '#16a34a',
      amber: '#f59e0b',
      yellow: '#facc15',
      red: '#dc2626',
      blocked: '#7f1d1d',
      off_track: '#dc2626',
      at_risk: '#f59e0b',
      on_track: '#16a34a',
      completed: '#2563eb'
    };
    return colours[key] || '';
  }

  function renderColour(value) {
    const colour = colourValue(value);
    const label = friendlyLabel(value);
    return `<span class="colour-field" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"><span class="colour-swatch ${colour ? '' : 'unknown'}" style="${colour ? `background:${escapeHtml(colour)}` : ''}"></span></span>`;
  }

  function renderColourWithLabel(value) {
    return `<span class="colour-with-label">${renderColour(value)}<span>${escapeHtml(friendlyLabel(value))}</span></span>`;
  }

  function combinedNextSteps(item) {
    const seen = new Set();
    return ['blocking_factors', 'next_steps'].flatMap((field) => {
      const value = item && item[field];
      if (Array.isArray(value)) return value.map((entry) => String(entry || '').trim()).filter(Boolean);
      const text = String(value || '').trim();
      return text ? [text] : [];
    }).filter((value) => {
      const key = value.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function latestPayload(report) {
    const versions = Array.isArray(report.versions) ? report.versions : [];
    return versions[0] && versions[0].payload ? versions[0].payload : {};
  }

  function parseEditedReport() {
    const editor = document.getElementById('projectReportJsonEditor');
    if (!editor) return null;
    const parsed = JSON.parse(editor.value || '{}');
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
      throw new Error('Project report JSON must be an object.');
    }
    return parsed;
  }

  function updateEditedReportField(path, value) {
    const editor = document.getElementById('projectReportJsonEditor');
    if (!editor) return;
    let report;
    try {
      report = parseEditedReport();
    } catch (error) {
      return;
    }
    const parts = path.split('.');
    let node = report;
    parts.slice(0, -1).forEach((part) => {
      if (!node[part] || typeof node[part] !== 'object') node[part] = {};
      node = node[part];
    });
    node[parts[parts.length - 1]] = value;
    editor.value = JSON.stringify(report, null, 2);
  }

  function linesValue(value) {
    if (Array.isArray(value)) return value.map((item) => String(item || '').trim()).filter(Boolean).join('\n');
    return String(value || '').trim();
  }

  function linesArray(value) {
    return String(value || '').split(/\r?\n/).map((item) => item.trim()).filter(Boolean);
  }

  function fieldValue(row, field) {
    const node = row.querySelector(`[data-field="${field}"]`);
    return node ? node.value.trim() : '';
  }

  function editableCell(field, value, label, tag = 'textarea') {
    const escaped = escapeHtml(value || '');
    if (tag === 'input') return `<input aria-label="${escapeHtml(label)}" data-field="${escapeHtml(field)}" type="text" value="${escaped}" />`;
    if (tag === 'select-health') {
      const options = ['', 'on_track', 'at_risk', 'off_track', 'blocked', 'completed', 'green', 'amber', 'red'];
      return `<select aria-label="${escapeHtml(label)}" data-field="${escapeHtml(field)}">${options.map((option) => `<option value="${escapeHtml(option)}" ${String(value || '') === option ? 'selected' : ''}>${escapeHtml(option ? friendlyLabel(option) : '-')}</option>`).join('')}</select>`;
    }
    return `<textarea aria-label="${escapeHtml(label)}" data-field="${escapeHtml(field)}">${escaped}</textarea>`;
  }

  function renderHealthAreaEditorRows(areas) {
    const entries = Object.entries(areas || {});
    return entries.map(([key, area]) => `
      <tr data-health-area-row="${escapeHtml(key)}">
        <td>${escapeHtml(titleLabel(key))}</td>
        <td>${editableCell('status', area.status || '', `${titleLabel(key)} status`, 'select-health')}</td>
        <td>${editableCell('trend', area.trend || '', `${titleLabel(key)} trend`, 'input')}</td>
        <td>${editableCell('evidenceNotes', area.evidenceNotes || linesValue(asArray(area.evidence).map((item) => item.text || item.source || '').filter(Boolean)), `${titleLabel(key)} evidence`)}</td>
      </tr>`).join('') || '<tr><td colspan="4">No health areas yet. Save generated report data first, then edit here.</td></tr>';
  }

  function renderMilestoneEditorRows(milestones) {
    return asArray(milestones).map((item, index) => `
      <tr data-milestone-edit-row>
        <td>${editableCell('milestone', item.milestone || '', `Milestone ${index + 1}`, 'input')}</td>
        <td>${editableCell('baseline_finish_date', item.baseline_finish_date || item.baselineDeadline || item.deadline || '', `Milestone ${index + 1} baseline`, 'input')}</td>
        <td>${editableCell('forecast_finish_date', item.forecast_finish_date || item.forecastDeadline || item.deadline || '', `Milestone ${index + 1} forecast`, 'input')}</td>
        <td>${editableCell('delivery_status', item.delivery_status || item.status || '', `Milestone ${index + 1} delivery status`, 'input')}</td>
        <td>${editableCell('agreed_rag_status', item.agreed_rag_status || item.rag_status || '', `Milestone ${index + 1} RAG`, 'select-health')}</td>
        <td>${editableCell('health_assessment', item.health_assessment || '', `Milestone ${index + 1} health assessment`)}</td>
        <td>${editableCell('normalised_evidence_summary', item.normalised_evidence_summary || item.excerpt || '', `Milestone ${index + 1} summary`)}</td>
        <td>${editableCell('next_steps', linesValue(combinedNextSteps(item)), `Milestone ${index + 1} next steps`)}</td>
        <td class="narrow"><button type="button" class="danger" data-remove-editor-row>Remove</button></td>
      </tr>`).join('') || '';
  }

  function renderRiskEditorRows(risks) {
    return asArray(risks).map((risk, index) => `
      <tr data-risk-edit-row>
        <td>${editableCell('riskTitle', risk.riskTitle || '', `Risk ${index + 1} title`, 'input')}</td>
        <td>${editableCell('description', risk.description || '', `Risk ${index + 1} description`)}</td>
        <td>${editableCell('suggestedMitigation', risk.suggestedMitigation || risk.mitigation || '', `Risk ${index + 1} mitigation`)}</td>
        <td>${editableCell('relatedMilestone', risk.relatedMilestone || '', `Risk ${index + 1} milestone`, 'input')}</td>
        <td class="narrow"><button type="button" class="danger" data-remove-editor-row>Remove</button></td>
      </tr>`).join('') || '';
  }

  function renderActionEditorRows(actions) {
    return asArray(actions).map((action, index) => `
      <tr data-action-edit-row>
        <td>${editableCell('action', action.action || action.meetingActionPoint || '', `Action ${index + 1}`)}</td>
        <td>${editableCell('owner', action.owner || action.meetingActionPointOwner || '', `Action ${index + 1} owner`, 'input')}</td>
        <td>${editableCell('deadline', action.deadline || action.meetingActionPointDeadline || '', `Action ${index + 1} deadline`, 'input')}</td>
        <td>${editableCell('relatedMilestone', action.related_milestone || action.relatedMilestone || '', `Action ${index + 1} milestone`, 'input')}</td>
        <td class="narrow"><button type="button" class="danger" data-remove-editor-row>Remove</button></td>
      </tr>`).join('') || '';
  }

  function renderError(error) {
    app.innerHTML = `<section class="panel"><h1>Project update reports</h1><p class="status">${escapeHtml(error.message || 'Could not load reports.')}</p></section>`;
  }

  function renderList(reports) {
    app.innerHTML = `
      <section class="panel">
        <h1>Project update reports</h1>
        <p class="intro">${reports.length ? `${reports.length} saved report${reports.length === 1 ? '' : 's'}.` : 'No saved reports yet.'}</p>
      </section>
      <section class="panel">
        <div class="bulk-actions">
          <p id="bulkReportStatus" class="status">Select reports to enable bulk actions.</p>
          <button id="bulkDeleteReportsBtn" class="danger" type="button" disabled>Archive selected</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th class="select-cell"><input id="selectAllReports" type="checkbox" aria-label="Select all reports" /></th><th>Report</th><th>Project</th><th>Period</th><th>Status</th><th>Overall health</th><th>Updated</th><th>Actions</th></tr></thead>
            <tbody>
              ${reports.map((report) => `
                <tr>
                  <td class="select-cell"><input type="checkbox" data-report-select="${escapeHtml(report.reportId)}" data-report-name="${escapeHtml(report.reportName || `Report ${report.reportId}`)}" aria-label="Select ${escapeHtml(report.reportName || `Report ${report.reportId}`)}" /></td>
                  <td><a href="/project-update-test/reports/${escapeHtml(report.reportId)}">${escapeHtml(report.reportName || `Report ${report.reportId}`)}</a><div class="muted">${escapeHtml(report.fileName || '')}</div></td>
                  <td>${escapeHtml(report.projectName || '-')}</td>
                  <td>${escapeHtml(report.periodLabel || '-')}</td>
                  <td>${escapeHtml(friendlyLabel(report.reportStatus))}</td>
                  <td>${escapeHtml(proseOrLabel(report.overallHealth))}</td>
                  <td>${escapeHtml(dateValue(report.updatedAt || report.createdAt))}</td>
                  <td class="actions">
                    <a class="button-link" href="/project-update-test/reports/${escapeHtml(report.reportId)}">Open report</a>
                    <button class="danger" type="button" data-delete-report="${escapeHtml(report.reportId)}" data-report-name="${escapeHtml(report.reportName || `Report ${report.reportId}`)}">Archive</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>
    `;
    app.querySelectorAll('[data-delete-report]').forEach((button) => {
      button.addEventListener('click', async () => {
        const id = button.getAttribute('data-delete-report');
        const name = button.getAttribute('data-report-name') || `Report ${id}`;
        if (!window.confirm(`Archive ${name}? This keeps its version history but removes it from active reports and project context.`)) return;
        button.disabled = true;
        try {
          const response = await authedFetch(`/api/project-update-test/reports/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const result = await response.json().catch(() => null);
          if (!response.ok || !result || result.ok === false) {
            throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
          }
          await load();
        } catch (error) {
          window.alert(error.message || 'Could not archive report.');
          button.disabled = false;
        }
      });
    });
    const bulkStatus = document.getElementById('bulkReportStatus');
    const bulkDeleteButton = document.getElementById('bulkDeleteReportsBtn');
    const selectAll = document.getElementById('selectAllReports');
    const checkboxes = Array.from(app.querySelectorAll('[data-report-select]'));
    function selectedReports() {
      return checkboxes.filter((checkbox) => checkbox.checked).map((checkbox) => ({
        id: checkbox.getAttribute('data-report-select'),
        name: checkbox.getAttribute('data-report-name') || `Report ${checkbox.getAttribute('data-report-select')}`
      }));
    }
    function updateBulkActions() {
      const selected = selectedReports();
      if (bulkDeleteButton) bulkDeleteButton.disabled = selected.length === 0;
      if (bulkStatus) bulkStatus.textContent = selected.length ? `${selected.length} report${selected.length === 1 ? '' : 's'} selected.` : 'Select reports to enable bulk actions.';
      if (selectAll) {
        selectAll.checked = checkboxes.length > 0 && selected.length === checkboxes.length;
        selectAll.indeterminate = selected.length > 0 && selected.length < checkboxes.length;
      }
    }
    if (selectAll) {
      selectAll.addEventListener('change', () => {
        checkboxes.forEach((checkbox) => { checkbox.checked = selectAll.checked; });
        updateBulkActions();
      });
    }
    checkboxes.forEach((checkbox) => checkbox.addEventListener('change', updateBulkActions));
    if (bulkDeleteButton) {
      bulkDeleteButton.addEventListener('click', async () => {
        const selected = selectedReports();
        if (!selected.length) return;
        const preview = selected.slice(0, 8).map((report) => `• ${report.name}`).join('\n');
        const suffix = selected.length > 8 ? `\n…and ${selected.length - 8} more.` : '';
        if (!window.confirm(`Archive ${selected.length} selected report${selected.length === 1 ? '' : 's'}? This keeps their version history but removes them from active reports and project context.\n\n${preview}${suffix}`)) return;
        bulkDeleteButton.disabled = true;
        if (bulkStatus) bulkStatus.textContent = `Archiving ${selected.length} report${selected.length === 1 ? '' : 's'}...`;
        try {
          const response = await authedFetch('/api/project-update-test/reports/bulk-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reportIds: selected.map((report) => report.id) })
          });
          const result = await response.json().catch(() => null);
          if (!response.ok || !result || result.ok === false) {
            throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
          }
          await load();
        } catch (error) {
          window.alert(error.message || 'Could not archive selected reports.');
          updateBulkActions();
        }
      });
    }
    updateBulkActions();
  }

  function renderDetail(report) {
    const payload = latestPayload(report);
    const projectReport = payload.projectReport || {};
    const versions = Array.isArray(report.versions) ? report.versions : [];
    const areas = projectReport.healthAreas && typeof projectReport.healthAreas === 'object' ? projectReport.healthAreas : {};
    const milestones = asArray(projectReport.milestones);
    const risks = asArray(projectReport.risks);
    const actions = asArray(projectReport.actions);
    const statusDiagnostics = projectReport.statusClassifierDiagnostics || payload.statusClassifierDiagnostics || {};
    const statusOptions = ['draft', 'in_review', 'approved', 'archived'];
    const approvalText = report.approvedAt
      ? `${report.approvedBy ? `Approved by ${report.approvedBy}` : 'Approved'} on ${dateValue(report.approvedAt)}`
      : 'Not approved yet. Approve only after the report is good enough to become future project memory.';
    const statusLabel = String(report.reportStatus || projectReport.reportStatus || 'draft').toLowerCase();
    const reviewBanner = statusLabel === 'approved'
      ? '<div class="safeguard-banner success"><strong>Approved report:</strong> this has been marked approved. Re-check any edits before exporting or sharing a new copy.</div>'
      : `<div class="safeguard-banner warning"><strong>Draft / review required:</strong> this report is ${escapeHtml(friendlyLabel(statusLabel))}. Check evidence, dates, risks and actions before approval or client sharing.</div>`;
    const statusCrossCheck = statusDiagnostics && Object.keys(statusDiagnostics).length
      ? `<div class="item"><div class="label">Status cross-check</div><div class="value">${statusDiagnostics.decisionUse === 'diagnostics_only' ? 'Review aid only' : 'Review before use'}</div><div class="muted">${escapeHtml(statusDiagnostics.reason || `${statusDiagnostics.itemCount || 0} signal${Number(statusDiagnostics.itemCount || 0) === 1 ? '' : 's'} found`)}</div></div>`
      : '';
    const overallSummarySection = `
      <section class="panel">
        <h2>Overall summary</h2>
        <p class="intro">A quick view of the main health areas before you get into editing the detailed report.</p>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Area</th><th>Status</th><th>Trend</th><th>Evidence</th></tr></thead>
            <tbody>
              ${Object.keys(areas).map((key) => {
                const area = areas[key] || {};
                const evidence = asArray(area.evidence).map((item) => item.text || item.source || '').filter(Boolean).join('\n');
                return `<tr><td>${escapeHtml(titleLabel(key))}</td><td>${statusBadge(area.status)}</td><td>${statusBadge(area.trend)}</td><td>${escapeHtml(evidence || area.evidenceNotes || '-')}</td></tr>`;
              }).join('') || '<tr><td colspan="4"><strong>No overall summary saved.</strong><br />Create or edit a report summary before sharing this report.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>`;
    app.innerHTML = `
      <section class="panel">
        <div class="actions">
          <div class="brand">
            <img class="print-only" src="/static/trinzo-logo.svg" alt="Trinzo logo" />
            <h1>${escapeHtml(report.reportName || `Report ${report.reportId}`)}</h1>
          </div>
          <button id="exportReportPdfBtn" type="button">Export PDF</button>
          <button id="saveReportBtn" class="primary" type="button">Save report</button>
        </div>
        <p class="intro summary">${escapeHtml(projectReport.summary || 'No summary saved for this report.')}</p>
        ${reviewBanner}
        <div class="safeguard-banner quiet"><strong>Data handling:</strong> this saved report keeps the report draft and any available source transcript so it can be reviewed, edited and audited later. Archive reports that should no longer appear in the active workspace.</div>
        <div class="print-footer" style="display:none">Exported ${escapeHtml(new Date().toLocaleString())}</div>
        <p id="reportSaveStatus" class="status"></p>
        <div class="grid">
          <div class="item"><div class="label">Project</div><div class="value">${escapeHtml(report.projectName || '-')}</div></div>
          <div class="item"><div class="label">Period</div><div class="value">${escapeHtml(report.periodLabel || '-')}</div></div>
          <div class="item"><div class="label">Status</div><div class="value">${statusBadge(report.reportStatus)}</div></div>
          <div class="item"><div class="label">Approval</div><div class="value">${escapeHtml(approvalText)}</div></div>
          <div class="item"><div class="label">Overall health</div><div class="value">${escapeHtml(proseOrLabel(projectReport.overallHealth))}</div></div>
          <div class="item"><div class="label">Overall status</div><div class="value">${renderColourWithLabel(projectReport.overallHealthRag)}</div></div>
          ${statusCrossCheck}
        </div>
      </section>
      ${overallSummarySection}
      <section class="panel edit-panel">
        <h2>Edit report</h2>
        <p class="editor-note">Edit the report in normal fields, like a working document. Changes autosave to the server after a short pause. The advanced JSON view is only there for support/debugging.</p>
        <div class="grid">
          <label>Report name
            <input id="reportNameEditor" type="text" value="${escapeHtml(report.reportName || `Report ${report.reportId}`)}" />
          </label>
          <label>Report status
            <select id="reportStatusEditor">
              ${statusOptions.map((status) => `<option value="${escapeHtml(status)}" ${status === (report.reportStatus || projectReport.reportStatus) ? 'selected' : ''}>${escapeHtml(friendlyLabel(status))}</option>`).join('')}
            </select>
          </label>
          <label>Executive summary
            <textarea id="reportSummaryEditor">${escapeHtml(projectReport.summary || '')}</textarea>
          </label>
        </div>
        <h3>Overall health areas</h3>
        <div class="table-scroll">
          <table class="inline-edit-table">
            <thead><tr><th>Area</th><th>Status</th><th>Trend</th><th>Evidence / rationale</th></tr></thead>
            <tbody id="healthAreaEditorRows">${renderHealthAreaEditorRows(areas)}</tbody>
          </table>
        </div>
        <h3>Milestones</h3>
        <div class="row-tools"><button id="addMilestoneRowBtn" type="button">Add milestone row</button></div>
        <div class="table-scroll" style="margin-top:.5rem">
          <table class="inline-edit-table">
            <thead><tr><th>Milestone</th><th>Baseline</th><th>Forecast</th><th>Delivery status</th><th>RAG</th><th>Health assessment</th><th>Summary</th><th>Next steps</th><th></th></tr></thead>
            <tbody id="milestoneEditorRows">${renderMilestoneEditorRows(milestones) || '<tr class="empty-editor-row"><td colspan="9">No milestone rows yet. Add one if the report needs a milestone update.</td></tr>'}</tbody>
          </table>
        </div>
        <h3>Risks</h3>
        <div class="row-tools"><button id="addRiskRowBtn" type="button">Add risk row</button></div>
        <div class="table-scroll" style="margin-top:.5rem">
          <table class="inline-edit-table">
            <thead><tr><th>Risk</th><th>Description</th><th>Mitigation</th><th>Milestone</th><th></th></tr></thead>
            <tbody id="riskEditorRows">${renderRiskEditorRows(risks) || '<tr class="empty-editor-row"><td colspan="5">No risk rows yet. Add one if the report needs a risk.</td></tr>'}</tbody>
          </table>
        </div>
        <h3>Actions</h3>
        <div class="row-tools"><button id="addActionRowBtn" type="button">Add action row</button></div>
        <div class="table-scroll" style="margin-top:.5rem">
          <table class="inline-edit-table">
            <thead><tr><th>Action</th><th>Owner</th><th>Deadline</th><th>Milestone</th><th></th></tr></thead>
            <tbody id="actionEditorRows">${renderActionEditorRows(actions) || '<tr class="empty-editor-row"><td colspan="5">No action rows yet. Add one if the report needs an action.</td></tr>'}</tbody>
          </table>
        </div>
        <details class="support-details raw-json" style="margin-top:.75rem">
          <summary>Support / audit details</summary>
          <p class="muted">Kept out of the main report view. Use only if you need to audit the source transcript, report data, version history, or backend response.</p>
          <div class="json-tools">
            <button id="copySavedProjectReportBtn" class="secondary" type="button">Copy report data</button>
          </div>
          <details style="margin-top:.75rem">
            <summary>Editable report JSON</summary>
            <label style="margin-top:.75rem">Project report JSON
              <textarea id="projectReportJsonEditor" class="json-editor" spellcheck="false">${escapeHtml(JSON.stringify(projectReport, null, 2))}</textarea>
            </label>
          </details>
          <details style="margin-top:.75rem">
            <summary>Transcript used for report</summary>
            <pre>${escapeHtml(report.source && report.source.transcriptText ? report.source.transcriptText : 'Transcript text is not available for this report.')}</pre>
          </details>
          <details style="margin-top:.75rem">
            <summary>Version history</summary>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Version</th><th>Type</th><th>Change</th><th>Saved by</th><th>Created</th><th>Details</th></tr></thead>
                <tbody>
                  ${versions.map((version) => `
                    <tr>
                      <td>${escapeHtml(version.versionNumber || '')}</td>
                      <td>${statusBadge(version.changeType)}</td>
                      <td>${escapeHtml(version.changeSummary || version.changeType || '')}</td>
                      <td>${escapeHtml(version.savedBy || '-')}</td>
                      <td>${escapeHtml(dateValue(version.createdAt))}</td>
                      <td><details><summary>View version data</summary><pre>${escapeHtml(JSON.stringify(version.payload || {}, null, 2))}</pre></details></td>
                    </tr>
                  `).join('') || '<tr><td colspan="6">No version history available.</td></tr>'}
                </tbody>
              </table>
            </div>
          </details>
          <details style="margin-top:.75rem">
            <summary>Backend response</summary>
            <pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre>
          </details>
        </details>
      </section>
      <section class="panel">
        <h2>Milestones</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Milestone</th><th>Baseline</th><th>Forecast</th><th>Delivery status</th><th>Status</th><th>Health</th><th>Summary</th><th>Next steps</th></tr></thead>
            <tbody>
              ${milestones.map((item) => `<tr><td>${escapeHtml(titleLabel(item.milestone))}</td><td>${escapeHtml(displayDate(item.baseline_finish_date || item.baselineDeadline || item.deadline))}</td><td>${escapeHtml(displayDate(item.forecast_finish_date || item.forecastDeadline || item.deadline))}</td><td>${statusBadge(item.delivery_status || item.status)}</td><td>${renderColour(item.agreed_rag_status || item.rag_status)}</td><td>${statusBadge(item.health_assessment)}</td><td>${escapeHtml(staticText(item.normalised_evidence_summary || item.excerpt))}</td><td>${escapeHtml(staticText(combinedNextSteps(item)))}</td></tr>`).join('') || '<tr><td colspan="8"><strong>No milestones saved.</strong><br />Add milestones in Setup or edit this report before approval.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Risks</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Risk</th><th>Description</th><th>Mitigation</th><th>Milestone</th></tr></thead>
            <tbody>
              ${risks.map((risk) => `<tr><td>${escapeHtml(staticText(risk.riskTitle))}</td><td>${escapeHtml(staticText(risk.description))}</td><td>${escapeHtml(staticText(risk.suggestedMitigation))}</td><td>${escapeHtml(staticText(risk.relatedMilestone))}</td></tr>`).join('') || '<tr><td colspan="4"><strong>No risks saved.</strong><br />That may be fine, but check the transcript before approval.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Actions</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Action</th><th>Owner</th><th>Deadline</th><th>Milestone</th></tr></thead>
            <tbody>
              ${actions.map((action) => `<tr><td>${escapeHtml(staticText(action.action || action.meetingActionPoint))}</td><td>${escapeHtml(staticText(action.meetingActionPointOwner || action.owner))}</td><td>${escapeHtml(displayDate(action.deadline || action.meetingActionPointDeadline))}</td><td>${escapeHtml(staticText(action.related_milestone || action.relatedMilestone))}</td></tr>`).join('') || '<tr><td colspan="4"><strong>No actions saved.</strong><br />If the transcript contains actions, add them before approval.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
    `;
    const saveButton = document.getElementById('saveReportBtn');
    const exportButton = document.getElementById('exportReportPdfBtn');
    const statusNode = document.getElementById('reportSaveStatus');
    const nameEditor = document.getElementById('reportNameEditor');
    const statusEditor = document.getElementById('reportStatusEditor');
    const summaryEditor = document.getElementById('reportSummaryEditor');
    const jsonEditor = document.getElementById('projectReportJsonEditor');
    const copySavedProjectReportBtn = document.getElementById('copySavedProjectReportBtn');
    let autosaveTimer = null;

    function setSaveStatus(text, type) {
      statusNode.textContent = text || '';
      statusNode.className = type ? `status ${type}` : 'status';
    }

    function removeEmptyPlaceholder(tbody) {
      const placeholder = tbody && tbody.querySelector('.empty-editor-row');
      if (placeholder) placeholder.remove();
    }

    function syncStructuredEditorsToJson() {
      const reportData = parseEditedReport();
      reportData.summary = summaryEditor.value;
      reportData.reportStatus = statusEditor.value;

      const nextHealthAreas = {};
      document.querySelectorAll('[data-health-area-row]').forEach((row) => {
        const key = row.getAttribute('data-health-area-row');
        const existing = (reportData.healthAreas && reportData.healthAreas[key]) || {};
        const evidenceNotes = fieldValue(row, 'evidenceNotes');
        nextHealthAreas[key] = {
          ...existing,
          status: fieldValue(row, 'status'),
          trend: fieldValue(row, 'trend'),
          evidenceNotes,
          evidence: evidenceNotes ? [{ text: evidenceNotes }] : []
        };
      });
      if (Object.keys(nextHealthAreas).length) reportData.healthAreas = nextHealthAreas;

      reportData.milestones = Array.from(document.querySelectorAll('[data-milestone-edit-row]')).map((row) => ({
        milestone: fieldValue(row, 'milestone'),
        baseline_finish_date: fieldValue(row, 'baseline_finish_date'),
        forecast_finish_date: fieldValue(row, 'forecast_finish_date'),
        delivery_status: fieldValue(row, 'delivery_status'),
        agreed_rag_status: fieldValue(row, 'agreed_rag_status'),
        health_assessment: fieldValue(row, 'health_assessment'),
        normalised_evidence_summary: fieldValue(row, 'normalised_evidence_summary'),
        next_steps: linesArray(fieldValue(row, 'next_steps'))
      })).filter((item) => Object.values(item).some((value) => Array.isArray(value) ? value.length : String(value || '').trim()));

      reportData.risks = Array.from(document.querySelectorAll('[data-risk-edit-row]')).map((row) => ({
        riskTitle: fieldValue(row, 'riskTitle'),
        description: fieldValue(row, 'description'),
        suggestedMitigation: fieldValue(row, 'suggestedMitigation'),
        relatedMilestone: fieldValue(row, 'relatedMilestone')
      })).filter((item) => Object.values(item).some((value) => String(value || '').trim()));

      reportData.actions = Array.from(document.querySelectorAll('[data-action-edit-row]')).map((row) => ({
        action: fieldValue(row, 'action'),
        owner: fieldValue(row, 'owner'),
        deadline: fieldValue(row, 'deadline'),
        relatedMilestone: fieldValue(row, 'relatedMilestone')
      })).filter((item) => Object.values(item).some((value) => String(value || '').trim()));

      jsonEditor.value = JSON.stringify(reportData, null, 2);
      return reportData;
    }

    function wireStructuredEditors() {
      document.querySelectorAll('.inline-edit-table input, .inline-edit-table select, .inline-edit-table textarea').forEach((node) => {
        if (node.dataset.structuredEditorWired === 'true') return;
        node.dataset.structuredEditorWired = 'true';
        node.addEventListener('input', queueAutosave);
        node.addEventListener('change', queueAutosave);
      });
      document.querySelectorAll('[data-remove-editor-row]').forEach((button) => {
        if (button.dataset.structuredEditorWired === 'true') return;
        button.dataset.structuredEditorWired = 'true';
        button.addEventListener('click', () => {
          button.closest('tr').remove();
          queueAutosave();
        });
      });
    }

    function appendRows(tbody, html) {
      removeEmptyPlaceholder(tbody);
      tbody.insertAdjacentHTML('beforeend', html);
      wireStructuredEditors();
      queueAutosave();
    }

    async function saveReport(automatic) {
      clearTimeout(autosaveTimer);
      let editedReport;
      try {
        editedReport = syncStructuredEditorsToJson();
      } catch (error) {
        setSaveStatus(error.message || 'Project report data is invalid.', 'error');
        return;
      }
      saveButton.disabled = true;
      setSaveStatus(automatic ? 'Autosaving server draft...' : 'Saving report...');
      try {
        const response = await authedFetch(`/api/project-update-test/reports/${encodeURIComponent(report.reportId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reportName: nameEditor.value,
            reportStatus: statusEditor.value,
            projectReport: editedReport,
            changeSummary: automatic ? 'Autosaved draft from report detail page.' : 'Saved from report detail page.',
            autosave: automatic
          })
        });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) {
          throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        }
        setSaveStatus(`${automatic ? 'Autosaved server draft' : 'Saved'} at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success');
        report = result.report;
        if (!automatic) renderDetail(result.report);
      } catch (error) {
        setSaveStatus(error.message || 'Could not save report.', 'error');
      } finally {
        saveButton.disabled = false;
      }
    }

    function queueAutosave() {
      setSaveStatus('Unsaved changes — server autosave will run shortly.');
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => saveReport(true), 900);
    }

    nameEditor.addEventListener('input', queueAutosave);
    summaryEditor.addEventListener('input', () => {
      updateEditedReportField('summary', summaryEditor.value);
      queueAutosave();
    });
    statusEditor.addEventListener('change', () => {
      updateEditedReportField('reportStatus', statusEditor.value);
      queueAutosave();
    });
    jsonEditor.addEventListener('input', queueAutosave);
    wireStructuredEditors();
    document.getElementById('addMilestoneRowBtn').addEventListener('click', () => appendRows(document.getElementById('milestoneEditorRows'), renderMilestoneEditorRows([{}])));
    document.getElementById('addRiskRowBtn').addEventListener('click', () => appendRows(document.getElementById('riskEditorRows'), renderRiskEditorRows([{}])));
    document.getElementById('addActionRowBtn').addEventListener('click', () => appendRows(document.getElementById('actionEditorRows'), renderActionEditorRows([{}])));
    copySavedProjectReportBtn.addEventListener('click', async () => {
      syncStructuredEditorsToJson();
      await navigator.clipboard.writeText(jsonEditor.value || '{}');
      setSaveStatus('Project report data copied to clipboard.', 'success');
    });
    saveButton.addEventListener('click', () => saveReport(false));
    exportButton.addEventListener('click', () => window.print());
  }

  async function load() {
    const response = await authedFetch(reportId ? `/api/project-update-test/reports/${reportId}` : '/api/project-update-test/reports');
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload || payload.ok === false) {
      throw new Error(response.status === 401 ? authMessage() : (payload && payload.error ? payload.error : `Request failed with status ${response.status}.`));
    }
    if (reportId) renderDetail(payload.report);
    else renderList(payload.reports || []);
  }

  load().catch(renderError);
}());
</script>
</body>
</html>
