<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project update reports</title>
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Arial, Helvetica, sans-serif; }
.container { max-width:1280px; margin:0 auto; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
a { color:#67e8f9; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, .muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.75rem; }
.item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.label { color:var(--muted); font-size:.85rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:920px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
.button-link { display:inline-block; background:#132847; color:#dbeafe; border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; font-weight:700; text-decoration:none; white-space:nowrap; }
pre { white-space:pre-wrap; overflow:auto; max-height:560px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.status { margin:.75rem 0; color:var(--muted); }
.summary { max-width:56rem; }
.colour-field { display:flex; align-items:center; justify-content:center; min-height:1.6rem; }
.colour-swatch { display:inline-block; width:1.35rem; height:1.35rem; border-radius:999px; border:2px solid rgba(238,243,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); }
.colour-swatch.unknown { background:transparent; border-style:dashed; border-color:var(--muted); }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="/project-update-test">Project update test</a>
    <a href="/project-update-test/reports">Reports</a>
    <a href="/project-update-test/milestones">Milestones</a>
  </nav>
  <main id="app">
    <section class="panel"><h1>Project update reports</h1><p class="intro">Loading saved reports...</p></section>
  </main>
</div>
<script>
(function () {
  const app = document.getElementById('app');
  const reportMatch = location.pathname.match(/\/project-update-test\/reports\/(\d+)$/);
  const reportId = reportMatch ? reportMatch[1] : '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateValue(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
  }

  function friendlyLabel(value) {
    const label = String(value || '').replace(/[_-]+/g, ' ').trim().replace(/\b\w/g, (letter) => letter.toUpperCase());
    return label ? label.charAt(0).toUpperCase() + label.slice(1).toLowerCase() : '-';
  }

  function titleLabel(value) {
    return String(value || '').replace(/[_-]+/g, ' ').trim().replace(/\b\w/g, (letter) => letter.toUpperCase()) || '-';
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function staticText(value) {
    if (Array.isArray(value)) return value.map((item) => String(item || '').trim()).filter(Boolean).join('\n') || '-';
    return String(value || '').trim() || '-';
  }

  function colourValue(value) {
    const key = String(value || '').trim().toLowerCase().replace(/[^a-z]+/g, '_');
    const colours = {
      blue: '#2563eb',
      green: '#16a34a',
      amber: '#f59e0b',
      yellow: '#facc15',
      red: '#dc2626',
      blocked: '#7f1d1d',
      off_track: '#dc2626',
      at_risk: '#f59e0b',
      on_track: '#16a34a',
      completed: '#2563eb'
    };
    return colours[key] || '';
  }

  function renderColour(value) {
    const colour = colourValue(value);
    const label = friendlyLabel(value);
    return `<span class="colour-field" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"><span class="colour-swatch ${colour ? '' : 'unknown'}" style="${colour ? `background:${escapeHtml(colour)}` : ''}"></span></span>`;
  }

  function latestPayload(report) {
    const versions = Array.isArray(report.versions) ? report.versions : [];
    return versions[0] && versions[0].payload ? versions[0].payload : {};
  }

  function renderError(error) {
    app.innerHTML = `<section class="panel"><h1>Project update reports</h1><p class="status">${escapeHtml(error.message || 'Could not load reports.')}</p></section>`;
  }

  function renderList(reports) {
    app.innerHTML = `
      <section class="panel">
        <h1>Project update reports</h1>
        <p class="intro">${reports.length ? `${reports.length} saved report${reports.length === 1 ? '' : 's'}.` : 'No saved reports yet.'}</p>
      </section>
      <section class="panel">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Report</th><th>Project</th><th>Period</th><th>Status</th><th>Overall health</th><th>Updated</th><th>Action</th></tr></thead>
            <tbody>
              ${reports.map((report) => `
                <tr>
                  <td><a href="/project-update-test/reports/${escapeHtml(report.reportId)}">Report ${escapeHtml(report.reportId)}</a><div class="muted">${escapeHtml(report.fileName || '')}</div></td>
                  <td>${escapeHtml(report.projectName || '-')}</td>
                  <td>${escapeHtml(report.periodLabel || '-')}</td>
                  <td>${escapeHtml(friendlyLabel(report.reportStatus))}</td>
                  <td>${escapeHtml(friendlyLabel(report.overallHealth))}</td>
                  <td>${escapeHtml(dateValue(report.updatedAt || report.createdAt))}</td>
                  <td><a class="button-link" href="/project-update-test/reports/${escapeHtml(report.reportId)}">Edit Report</a></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>
    `;
  }

  function renderDetail(report) {
    const payload = latestPayload(report);
    const projectReport = payload.projectReport || {};
    const versions = Array.isArray(report.versions) ? report.versions : [];
    const areas = projectReport.healthAreas && typeof projectReport.healthAreas === 'object' ? projectReport.healthAreas : {};
    const milestones = asArray(projectReport.milestones);
    const risks = asArray(projectReport.risks);
    const actions = asArray(projectReport.actions);
    app.innerHTML = `
      <section class="panel">
        <h1>Report ${escapeHtml(report.reportId)}</h1>
        <p class="intro summary">${escapeHtml(projectReport.summary || 'No summary saved for this report.')}</p>
        <div class="grid">
          <div class="item"><div class="label">Project</div><div class="value">${escapeHtml(report.projectName || '-')}</div></div>
          <div class="item"><div class="label">Period</div><div class="value">${escapeHtml(report.periodLabel || '-')}</div></div>
          <div class="item"><div class="label">Status</div><div class="value">${escapeHtml(friendlyLabel(report.reportStatus))}</div></div>
          <div class="item"><div class="label">Overall health</div><div class="value">${escapeHtml(friendlyLabel(projectReport.overallHealth))}</div></div>
          <div class="item"><div class="label">Overall colour</div><div class="value">${renderColour(projectReport.overallHealthRag)}</div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Executive summary</h2>
        <p class="summary">${escapeHtml(projectReport.summary || '-')}</p>
      </section>
      <section class="panel">
        <h2>Overall summary</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Area</th><th>Status</th><th>Trend</th><th>Evidence</th></tr></thead>
            <tbody>
              ${Object.keys(areas).map((key) => {
                const area = areas[key] || {};
                const evidence = asArray(area.evidence).map((item) => item.text || item.source || '').filter(Boolean).join('\n');
                return `<tr><td>${escapeHtml(titleLabel(key))}</td><td>${escapeHtml(friendlyLabel(area.status))}</td><td>${escapeHtml(friendlyLabel(area.trend))}</td><td>${escapeHtml(evidence || area.evidenceNotes || '-')}</td></tr>`;
              }).join('') || '<tr><td colspan="4">-</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Milestones</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Milestone</th><th>Baseline</th><th>Forecast</th><th>Delivery status</th><th>Status</th><th>Health</th><th>Summary</th><th>Blockers</th><th>Next steps</th></tr></thead>
            <tbody>
              ${milestones.map((item) => `<tr><td>${escapeHtml(titleLabel(item.milestone))}</td><td>${escapeHtml(staticText(item.baseline_finish_date || item.baselineDeadline || item.deadline))}</td><td>${escapeHtml(staticText(item.forecast_finish_date || item.forecastDeadline || item.deadline))}</td><td>${escapeHtml(friendlyLabel(item.delivery_status || item.status))}</td><td>${renderColour(item.agreed_rag_status || item.rag_status)}</td><td>${escapeHtml(friendlyLabel(item.health_assessment))}</td><td>${escapeHtml(staticText(item.normalised_evidence_summary || item.excerpt))}</td><td>${escapeHtml(staticText(item.blocking_factors))}</td><td>${escapeHtml(staticText(item.next_steps))}</td></tr>`).join('') || '<tr><td colspan="9">-</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Risks</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Risk</th><th>Description</th><th>Mitigation</th><th>Milestone</th></tr></thead>
            <tbody>
              ${risks.map((risk) => `<tr><td>${escapeHtml(staticText(risk.riskTitle))}</td><td>${escapeHtml(staticText(risk.description))}</td><td>${escapeHtml(staticText(risk.suggestedMitigation))}</td><td>${escapeHtml(staticText(risk.relatedMilestone))}</td></tr>`).join('') || '<tr><td colspan="4">-</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Actions</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Action</th><th>Owner</th><th>Deadline</th><th>Milestone</th></tr></thead>
            <tbody>
              ${actions.map((action) => `<tr><td>${escapeHtml(staticText(action.action || action.meetingActionPoint))}</td><td>${escapeHtml(staticText(action.meetingActionPointOwner || action.owner))}</td><td>${escapeHtml(staticText(action.deadline || action.meetingActionPointDeadline))}</td><td>${escapeHtml(staticText(action.related_milestone || action.relatedMilestone))}</td></tr>`).join('') || '<tr><td colspan="4">-</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>Versions</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Version</th><th>Change</th><th>Saved by</th><th>Created</th></tr></thead>
            <tbody>
              ${versions.map((version) => `
                <tr>
                  <td>${escapeHtml(version.versionNumber || '')}</td>
                  <td>${escapeHtml(version.changeSummary || version.changeType || '')}</td>
                  <td>${escapeHtml(version.savedBy || '-')}</td>
                  <td>${escapeHtml(dateValue(version.createdAt))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <details>
          <summary>Latest payload JSON</summary>
          <pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre>
        </details>
      </section>
    `;
  }

  async function load() {
    const response = await fetch(reportId ? `/api/project-update-test/reports/${reportId}` : '/api/project-update-test/reports');
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload || payload.ok === false) {
      throw new Error(payload && payload.error ? payload.error : `Request failed with status ${response.status}.`);
    }
    if (reportId) renderDetail(payload.report);
    else renderList(payload.reports || []);
  }

  load().catch(renderError);
}());
</script>
</body>
</html>
