<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting minutes feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
.container { max-width:1280px; margin:0 auto; }
a { color:#67e8f9; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.muted, small { color:var(--muted); }
.status { margin:.75rem 0; color:var(--muted); }
.status.error { color:#fecaca; }
.status.success { color:#bbf7d0; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.75rem; }
.item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.label { color:var(--muted); font-size:.85rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:980px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
.badge { display:inline-block; border:1px solid var(--border); border-radius:999px; padding:.15rem .5rem; background:#132847; color:#dbeafe; font-size:.85rem; }
.badge.resolved { background:#064e3b; border-color:#059669; }
.badge.working_on_it { background:#713f12; border-color:#f59e0b; }
.badge.submitted { background:#1e3a8a; border-color:#3b82f6; }
.message, pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
pre { max-height:24rem; overflow:auto; }
button, .button-link { display:inline-block; background:#132847; color:#dbeafe; border:1px solid var(--border); border-radius:8px; padding:.55rem .75rem; font-weight:700; text-decoration:none; cursor:pointer; font:inherit; }
button.primary { background:linear-gradient(180deg,var(--accent),#0fb5ab); border-color:#0fb5ab; color:#02173B; }
button.danger { background:#3f0f18; border-color:#b91c1c; color:#fecaca; padding:.35rem .55rem; }
button.icon-button { min-width:2.15rem; text-align:center; }
button:disabled { opacity:.6; cursor:not-allowed; }
details.technical-context summary { cursor:pointer; color:#dbeafe; font-weight:700; }
details.technical-context summary h2 { display:inline; margin-left:.35rem; }
.form-grid { display:grid; grid-template-columns:minmax(170px, 240px) 1fr 1fr; gap:.75rem; }
label { display:block; color:var(--muted); font-weight:700; font-size:.86rem; }
select, textarea { width:100%; margin-top:.35rem; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.65rem; font:inherit; }
textarea { min-height:8rem; resize:vertical; }
.actions { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; margin-top:.75rem; }
.empty { color:var(--muted); padding:.75rem; }
@media (max-width:760px) { .form-grid { grid-template-columns:1fr; } }
</style>
  <link rel="stylesheet" href="/static/trinzo.css">
  <script defer src="/static/trinzo.js"></script>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="/meeting-minutes-final">Meeting minutes final</a>
    <a href="/meeting-minutes-feedback">Feedback listing</a>
    <a href="/auth/login" id="logoutLink">Logout</a>
  </nav>
  <main id="app">
    <section class="panel"><h1>Meeting minutes feedback</h1><p class="muted">Loading submitted feedback...</p></section>
  </main>
</div>
<script>
(function () {
  const app = document.getElementById('app');
  const detailMatch = location.pathname.match(/\/meeting-minutes-feedback\/(\d+)$/);
  const feedbackId = detailMatch ? detailMatch[1] : '';

  document.getElementById('logoutLink').addEventListener('click', async (event) => {
    event.preventDefault();
    await fetch('/api/auth/logout', { method: 'POST' }).catch(() => null);
    location.href = '/auth/login';
  });

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateValue(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value).replace(/T/g, ' ').replace(/Z$/i, '') : date.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  }

  function statusLabel(value) {
    return String(value || 'submitted').replace(/[_-]+/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function statusBadge(value) {
    const status = String(value || 'submitted');
    return `<span class="badge ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</span>`;
  }

  async function fetchJson(url, options) {
    const response = await fetch(url, options);
    const payload = await response.json().catch(() => ({}));
    if (response.status === 401) {
      location.href = '/auth/login';
      return new Promise(() => {});
    }
    if (!response.ok) throw new Error(payload.error || payload.message || `Request failed (${response.status})`);
    return payload;
  }

  function renderList(items) {
    const rows = items.map((item) => `
      <tr data-feedback-id="${escapeHtml(item.id)}">
        <td><a href="/meeting-minutes-feedback/${escapeHtml(item.id)}">#${escapeHtml(item.id)}</a></td>
        <td>${escapeHtml(dateValue(item.createdAt))}</td>
        <td>${statusBadge(item.status)}</td>
        <td>${escapeHtml(statusLabel(item.feedbackType))}</td>
        <td>${escapeHtml(item.contactName || '-')}</td>
        <td>${escapeHtml(item.message || '-')}</td>
        <td>${escapeHtml(item.selectedSnippet ? item.selectedSnippet.slice(0, 220) : '-')}</td>
        <td>${escapeHtml(item.fixDetails || item.claireComments || '-')}</td>
        <td><button class="danger icon-button delete-feedback" type="button" data-feedback-id="${escapeHtml(item.id)}" aria-label="Delete feedback #${escapeHtml(item.id)}" title="Delete feedback">🗑</button></td>
      </tr>`).join('');
    app.innerHTML = `
      <section class="panel">
        <h1>Meeting minutes feedback</h1>
        <p class="muted">Authenticated internal listing of feedback submitted from <code>/meeting-minutes-final</code>.</p>
      </section>
      <section class="panel">
        <h2>Submitted feedback</h2>
        ${items.length ? `<div class="table-scroll"><table><thead><tr><th>ID</th><th>Submitted</th><th>Status</th><th>Type</th><th>Name</th><th>Feedback</th><th>Selected snippet</th><th>Fix / comments</th><th>Delete</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">No feedback has been submitted yet.</p>'}
      </section>`;
    document.querySelectorAll('.delete-feedback').forEach((button) => {
      button.addEventListener('click', () => deleteFeedback(button.dataset.feedbackId));
    });
  }

  async function deleteFeedback(id) {
    if (!id) return;
    const confirmed = window.confirm('This action cannot be undone, are you sure you want to delete the feedback?');
    if (!confirmed) return;
    const button = document.querySelector(`.delete-feedback[data-feedback-id="${CSS.escape(String(id))}"]`);
    if (button) button.disabled = true;
    try {
      await fetchJson(`/api/meeting-minutes-final/feedback-submissions/${encodeURIComponent(id)}`, { method: 'DELETE' });
      document.querySelector(`tr[data-feedback-id="${CSS.escape(String(id))}"]`)?.remove();
      if (!document.querySelector('tbody tr')) {
        await load();
      }
    } catch (error) {
      alert(error.message);
      if (button) button.disabled = false;
    }
  }

  function renderDetail(item) {
    app.innerHTML = `
      <section class="panel">
        <h1>Feedback #${escapeHtml(item.id)}</h1>
        <p class="muted"><a href="/meeting-minutes-feedback">← Back to feedback listing</a></p>
        <div class="grid">
          <div class="item"><div class="label">Submitted</div><div class="value">${escapeHtml(dateValue(item.createdAt))}</div></div>
          <div class="item"><div class="label">Status</div><div class="value">${statusBadge(item.status)}</div></div>
          <div class="item"><div class="label">Feedback type</div><div class="value">${escapeHtml(statusLabel(item.feedbackType))}</div></div>
          <div class="item"><div class="label">Contact</div><div class="value">${escapeHtml([item.contactName, item.contactEmail].filter(Boolean).join(' · ') || '-')}</div></div>
          <div class="item"><div class="label">Fixed</div><div class="value">${escapeHtml(dateValue(item.fixedAt))}</div></div>
          <div class="item"><div class="label">Last edited</div><div class="value">${escapeHtml(dateValue(item.editedAt))}</div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Feedback</h2>
        <div class="message">${escapeHtml(item.message || '-')}</div>
      </section>
      <section class="panel">
        <h2>Selected snippet</h2>
        <pre>${escapeHtml(item.selectedSnippet || 'No selected snippet submitted with this feedback.')}</pre>
      </section>
      <section class="panel">
        <h2>Update status</h2>
        <div class="form-grid">
          <label>Status
            <select id="statusField">
              <option value="submitted">Submitted</option>
              <option value="working_on_it">Working on it</option>
              <option value="resolved">Resolved</option>
            </select>
          </label>
          <label>Comments from Claire
            <textarea id="claireCommentsField" maxlength="4000" placeholder="Internal notes or context from Claire..."></textarea>
          </label>
          <label>Fix details
            <textarea id="fixDetailsField" maxlength="4000" placeholder="What changed, commit, deployment notes..."></textarea>
          </label>
        </div>
        <div class="actions"><button id="saveButton" class="primary" type="button">Save feedback status</button><span id="saveStatus" class="status"></span></div>
      </section>
      <section class="panel">
        <details class="technical-context">
          <summary><h2>Technical context</h2></summary>
          <pre>${escapeHtml(JSON.stringify(item.metadata || {}, null, 2))}</pre>
          <p class="muted"><small>User agent: ${escapeHtml(item.userAgent || '-')}</small></p>
        </details>
      </section>`;
    document.getElementById('statusField').value = item.status || 'submitted';
    document.getElementById('claireCommentsField').value = item.claireComments || '';
    document.getElementById('fixDetailsField').value = item.fixDetails || '';
    document.getElementById('saveButton').addEventListener('click', async () => {
      const button = document.getElementById('saveButton');
      const status = document.getElementById('saveStatus');
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Saving...';
      try {
        await fetchJson(`/api/meeting-minutes-final/feedback-submissions/${encodeURIComponent(item.id)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: document.getElementById('statusField').value,
            claireComments: document.getElementById('claireCommentsField').value,
            fixDetails: document.getElementById('fixDetailsField').value
          })
        });
        status.className = 'status success';
        status.textContent = 'Saved.';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  }

  async function load() {
    try {
      if (feedbackId) {
        const payload = await fetchJson(`/api/meeting-minutes-final/feedback-submissions/${encodeURIComponent(feedbackId)}`);
        renderDetail(payload.feedback);
      } else {
        const payload = await fetchJson('/api/meeting-minutes-final/feedback-submissions?limit=100');
        renderList(payload.feedback || []);
      }
    } catch (error) {
      app.innerHTML = `<section class="panel"><h1>Meeting minutes feedback</h1><p class="status error">${escapeHtml(error.message)}</p></section>`;
    }
  }

  load();
}());
</script>
</body>
</html>
