<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting minutes final</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; }
* { box-sizing: border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
.container { max-width:1240px; margin:0 auto; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, small, .note { color:var(--muted); }
.field { margin:.9rem 0; }
label { display:block; margin-bottom:.35rem; font-weight:700; }
input[type=file], textarea { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.7rem; font:inherit; }
textarea { min-height:260px; resize:vertical; }
button { background:linear-gradient(180deg,var(--accent),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.65rem .95rem; font-weight:700; cursor:pointer; }
button.secondary { background:#132847; color:#dbeafe; border:1px solid var(--border); }
button:disabled { opacity:.6; cursor:not-allowed; }
.actions, .json-heading { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:space-between; }
.panel-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-top:.85rem; }
.message { margin-top:1rem; padding:.75rem; border-radius:10px; background:#17233f; border:1px solid var(--border); white-space:pre-wrap; }
.message.error { background:#3a1515; border-color:#7f1d1d; }
.message.success { background:#0f2f29; border-color:#116149; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem; }
.summary-item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.summary-label { color:var(--muted); font-size:.85rem; }
.summary-value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.schema-table { width:100%; border-collapse:collapse; background:#071126; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.schema-table th, .schema-table td { border-bottom:1px solid var(--border); padding:.8rem; text-align:left; vertical-align:top; }
.schema-table th { width:220px; color:var(--muted); font-size:.9rem; font-weight:700; background:#0b1530; }
.schema-table tr:last-child th, .schema-table tr:last-child td { border-bottom:none; }
.schema-table input[type=text], .schema-table textarea { width:100%; background:#091224; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.65rem; font:inherit; }
.schema-table textarea { min-height:120px; resize:vertical; }
.schema-list { margin:0; padding-left:1.1rem; }
.schema-list li { margin:.15rem 0; }
.schema-empty { color:var(--muted); }
.schema-subtable { width:100%; border-collapse:collapse; }
.schema-subtable th, .schema-subtable td { border:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
.schema-subtable th { width:auto; background:#0b1530; color:var(--muted); font-size:.85rem; }
.schema-subtable td { background:#091224; }
.schema-subtable input[type=text] { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.55rem; font:inherit; }
.schema-subtable textarea.action-field { width:100%; min-height:72px; max-height:180px; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.55rem; font:inherit; line-height:1.35; resize:vertical; overflow:auto; }
.schema-inline-actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:.5rem; }
.schema-inline-actions button { padding:.45rem .7rem; border-radius:8px; }
pre { white-space:pre-wrap; overflow:auto; max-height:650px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.accordion { margin-top:1rem; }
.accordion details { background:#071126; border:1px solid var(--border); border-radius:10px; margin:.75rem 0; overflow:hidden; }
.accordion summary { cursor:pointer; list-style:none; padding:.85rem 1rem; font-weight:700; }
.accordion summary::-webkit-details-marker { display:none; }
.accordion .accordion-body { padding:0 1rem 1rem; }
.hidden { display:none; }
a { color:#67e8f9; }
@media (max-width: 760px) {
  .schema-table, .schema-table tbody, .schema-table tr, .schema-table th, .schema-table td { display:block; width:100%; }
  .schema-table tr { border-bottom:1px solid var(--border); }
  .schema-table tr:last-child { border-bottom:none; }
  .schema-table th, .schema-table td { border-bottom:none; }
  .schema-table th { padding-bottom:.25rem; }
}
</style>
</head>

</html>
