<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Transcript to Minutes Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; }
* { box-sizing: border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
.container { max-width:1240px; margin:0 auto; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, small, .note { color:var(--muted); }
.field { margin:.9rem 0; }
label { display:block; margin-bottom:.35rem; font-weight:700; }
input[type=file], textarea { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.7rem; font:inherit; }
textarea { min-height:260px; resize:vertical; }
button { background:linear-gradient(180deg,var(--accent),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.65rem .95rem; font-weight:700; cursor:pointer; }
button.secondary { background:#132847; color:#dbeafe; border:1px solid var(--border); }
button:disabled { opacity:.6; cursor:not-allowed; }
.actions, .json-heading { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:space-between; }
.panel-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-top:.85rem; }
.message { margin-top:1rem; padding:.75rem; border-radius:10px; background:#17233f; border:1px solid var(--border); white-space:pre-wrap; }
.message.error { background:#3a1515; border-color:#7f1d1d; }
.message.success { background:#0f2f29; border-color:#116149; }
.message.warning { background:#3a2c15; border-color:#7f5f1d; }
.safeguard-banner { margin:.75rem 0; padding:.75rem; border-radius:10px; background:rgba(23,208,196,.08); border:1px solid rgba(23,208,196,.35); color:#dbeafe; }
.safeguard-banner.quiet { background:rgba(15,23,42,.42); border-color:rgba(148,163,184,.28); color:#cbd5e1; }
.safeguard-banner.warning { background:#3a2c15; border-color:#7f5f1d; color:#fde68a; }
.safeguard-banner.success { background:#0f2f29; border-color:#116149; color:#bbf7d0; }
.progress-card { margin-top:1rem; padding:1rem; border:1px solid rgba(23,208,196,.45); border-radius:14px; background:linear-gradient(145deg,#0a1731,#071126); box-shadow:0 14px 38px rgba(0,0,0,.2); }
.progress-card.hidden { display:none; }
.progress-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.65rem; }
.progress-title { font-weight:700; color:#e0fffd; }
.progress-time { color:var(--muted); font-size:.88rem; white-space:nowrap; }
.progress-track { position:relative; overflow:hidden; height:12px; border-radius:999px; background:#061022; border:1px solid var(--border); }
.progress-fill { position:absolute; inset:0 auto 0 0; width:38%; border-radius:999px; background:linear-gradient(90deg,#17D0C4,#67e8f9,#17D0C4); animation:progressSlide 1.35s ease-in-out infinite; }
.progress-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.45rem; margin-top:.8rem; }
.progress-step { color:var(--muted); border:1px solid var(--border); background:#071126; border-radius:999px; padding:.35rem .55rem; font-size:.86rem; }
.progress-step.active { color:#e0fffd; border-color:rgba(23,208,196,.65); background:rgba(23,208,196,.1); }
.progress-tip { margin-top:.7rem; color:var(--muted); font-size:.9rem; }
@keyframes progressSlide { 0% { transform:translateX(-105%); } 55% { transform:translateX(85%); } 100% { transform:translateX(265%); } }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem; }
.summary-item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.summary-label { color:var(--muted); font-size:.85rem; }
.summary-value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.schema-table { width:100%; border-collapse:collapse; background:#071126; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.schema-table th, .schema-table td { border-bottom:1px solid var(--border); padding:.8rem; text-align:left; vertical-align:top; }
.schema-table th { width:220px; color:var(--muted); font-size:.9rem; font-weight:700; background:#0b1530; }
.schema-table tr:last-child th, .schema-table tr:last-child td { border-bottom:none; }
.schema-table input[type=text], .schema-table textarea { width:100%; background:#091224; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.65rem; font:inherit; }
.schema-table textarea { min-height:120px; resize:vertical; }
.schema-list { margin:0; padding-left:1.1rem; }
.schema-list li { margin:.15rem 0; }
.schema-empty { color:var(--muted); }
.schema-subtable { width:100%; border-collapse:collapse; }
.schema-subtable th, .schema-subtable td { border:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
.schema-subtable th { width:auto; background:#0b1530; color:var(--muted); font-size:.85rem; }
.schema-subtable td { background:#091224; }
.schema-subtable input[type=text] { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.55rem; font:inherit; }
.schema-subtable textarea.action-field { width:100%; min-height:72px; max-height:180px; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.55rem; font:inherit; line-height:1.35; resize:vertical; overflow:auto; }
.schema-inline-actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:.5rem; }
.schema-inline-actions button { padding:.45rem .7rem; border-radius:8px; }
pre { white-space:pre-wrap; overflow:auto; max-height:650px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.accordion { margin-top:1rem; }
.accordion details { background:#071126; border:1px solid var(--border); border-radius:10px; margin:.75rem 0; overflow:hidden; }
.accordion summary { cursor:pointer; list-style:none; padding:.85rem 1rem; font-weight:700; }
.accordion summary::-webkit-details-marker { display:none; }
.accordion .accordion-body { padding:0 1rem 1rem; }
.hidden { display:none; }
a { color:#67e8f9; }
.feedback-trigger { position:fixed; right:1rem; bottom:1rem; width:3rem; height:3rem; display:inline-flex; align-items:center; justify-content:center; padding:0; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.38); z-index:20; font-size:1.25rem; }
.feedback-trigger:focus-visible, .feedback-modal button:focus-visible, .feedback-modal input:focus-visible, .feedback-modal select:focus-visible, .feedback-modal textarea:focus-visible { outline:3px solid #67e8f9; outline-offset:2px; }
.feedback-backdrop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:1rem; background:rgba(2,6,23,.72); z-index:30; }
.feedback-backdrop.hidden { display:none; }
.feedback-modal { width:min(94vw, 520px); background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:16px; padding:1rem; box-shadow:0 24px 80px rgba(0,0,0,.55); }
.feedback-modal header { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:.75rem; }
.feedback-modal h2 { margin:.15rem 0 .25rem; }
.feedback-modal p { margin:.25rem 0 .75rem; color:var(--muted); }
.feedback-modal input, .feedback-modal select, .feedback-modal textarea { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.7rem; font:inherit; }
.feedback-modal textarea { min-height:120px; }
.feedback-modal .close-button { background:transparent; color:#dbeafe; border:1px solid var(--border); padding:.45rem .65rem; }
.feedback-status { margin-top:.75rem; min-height:1.3rem; color:var(--muted); }
.feedback-status.error { color:#fecaca; }
.feedback-status.success { color:#86efac; }
.snippet-feedback-context { margin:.5rem 0 .75rem; padding:.65rem; background:#071126; border:1px solid var(--border); border-radius:10px; }
.snippet-feedback-context.hidden { display:none; }
.snippet-feedback-context small { display:block; margin-bottom:.35rem; }
.snippet-feedback-context blockquote { margin:0; max-height:9rem; overflow:auto; white-space:pre-wrap; color:#dbeafe; border-left:3px solid var(--accent); padding-left:.75rem; }
@media (max-width: 760px) {
  .schema-table, .schema-table tbody, .schema-table tr, .schema-table th, .schema-table td { display:block; width:100%; }
  .schema-table tr { border-bottom:1px solid var(--border); }
  .schema-table tr:last-child { border-bottom:none; }
  .schema-table th, .schema-table td { border-bottom:none; }
  .schema-table th { padding-bottom:.25rem; }
}
</style>

  <script defer src="/static/trinzo.js"></script>
</head>
<body>
<div class="container">
  <nav class="nav" aria-label="Primary navigation">
    <a href="/dashboard">Dashboard</a>
    <a href="/meeting-minutes-final">Meeting transcript to minutes</a>
    <a href="/jobs">Library</a>
    <a href="/project-update-test">Project Updates</a>
    <a href="/project-update-test/roadmap">Roadmap</a>
  </nav>
  <main id="transcriptMinilmOnlyRoot"></main>
</div>
<button id="feedbackWidgetButton" class="feedback-trigger" type="button" aria-label="Open feedback form" title="Send feedback about this page">💬</button>
<div id="feedbackWidgetBackdrop" class="feedback-backdrop hidden" role="presentation">
  <section class="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedbackWidgetTitle" aria-describedby="feedbackWidgetDescription">
    <header>
      <div>
        <h2 id="feedbackWidgetTitle">Send feedback</h2>
        <p id="feedbackWidgetDescription">Tell us what worked, what broke, or what would make this page easier.</p>
      </div>
      <button id="feedbackWidgetClose" class="close-button" type="button" aria-label="Close feedback form">✕</button>
    </header>
    <form id="feedbackWidgetForm" novalidate>
      <div class="field">
        <label for="feedbackType">Feedback type</label>
        <select id="feedbackType" name="feedbackType">
          <option value="general">General feedback</option>
          <option value="bug">Something is broken</option>
          <option value="confusing">Something is confusing</option>
          <option value="idea">Feature idea</option>
          <option value="praise">This worked well</option>
        </select>
      </div>
      <div id="feedbackSnippetContext" class="snippet-feedback-context hidden" aria-live="polite">
        <small>Selected snippet for this feedback</small>
        <blockquote id="feedbackSnippetQuote"></blockquote>
      </div>
      <div class="field">
        <label for="feedbackMessage">Feedback <small>(required)</small></label>
        <textarea id="feedbackMessage" name="message" maxlength="2000" required placeholder="What should we know? Please avoid sharing transcript content or sensitive meeting data."></textarea>
      </div>
      <div class="field">
        <label for="feedbackName">Name <small>(optional)</small></label>
        <input id="feedbackName" name="contactName" type="text" maxlength="120" autocomplete="name" />
      </div>
      <div class="panel-actions">
        <button id="feedbackWidgetCancel" class="secondary" type="button">Cancel</button>
        <button id="feedbackWidgetSubmit" type="submit">Send feedback</button>
      </div>
      <div id="feedbackWidgetStatus" class="feedback-status" role="status" aria-live="polite"></div>
    </form>
  </section>
</div>
<script src="/static/test-transcript-page.js"></script>
<script>
buildTranscriptMinilmOnlyPage({
  title: 'Meeting Transcript to Minutes Tool',
  intro: 'Upload or paste a transcript to create draft meeting minutes. Then use Improve minutes to polish the wording before you review and save.',
  buttonText: 'Run meeting minutes',
  endpoint: '/api/meeting-minutes-final',
  queuedEndpoint: '/api/meeting-minutes-final/jobs',
  jobsPageUrl: '/jobs',
  improveEndpoint: '/api/meeting-minutes-final/improve',
  snippetImproveEndpoint: '/api/meeting-minutes-final/improve-snippet'
});

(function initialiseFeedbackWidget() {
  const openButton = document.getElementById('feedbackWidgetButton');
  const backdrop = document.getElementById('feedbackWidgetBackdrop');
  const closeButton = document.getElementById('feedbackWidgetClose');
  const cancelButton = document.getElementById('feedbackWidgetCancel');
  const form = document.getElementById('feedbackWidgetForm');
  const message = document.getElementById('feedbackMessage');
  const submitButton = document.getElementById('feedbackWidgetSubmit');
  const status = document.getElementById('feedbackWidgetStatus');
  const snippetContext = document.getElementById('feedbackSnippetContext');
  const snippetQuote = document.getElementById('feedbackSnippetQuote');
  let lastFocusedElement = null;
  let currentSnippet = '';

  function setStatus(text, className) {
    status.textContent = text || '';
    status.className = className ? `feedback-status ${className}` : 'feedback-status';
  }

  function getSelectedSnippetText() {
    const outputRoot = document.getElementById('minilmOnlyOutput');
    const active = document.activeElement;
    if (outputRoot && active && outputRoot.contains(active) && typeof active.selectionStart === 'number' && typeof active.selectionEnd === 'number') {
      const selected = String(active.value || '').slice(active.selectionStart, active.selectionEnd).trim();
      if (selected) return selected;
    }
    const selection = window.getSelection ? window.getSelection() : null;
    if (!selection || selection.isCollapsed) return '';
    if (outputRoot && selection.anchorNode && selection.focusNode && outputRoot.contains(selection.anchorNode) && outputRoot.contains(selection.focusNode)) {
      return selection.toString().trim();
    }
    return '';
  }

  function openModal(snippet) {
    currentSnippet = String(snippet || '').trim();
    lastFocusedElement = document.activeElement;
    backdrop.classList.remove('hidden');
    setStatus('', '');
    message.value = '';
    if (currentSnippet) {
      snippetQuote.textContent = currentSnippet;
      snippetContext.classList.remove('hidden');
      message.placeholder = 'What should change about the selected snippet?';
    } else {
      snippetQuote.textContent = '';
      snippetContext.classList.add('hidden');
      message.placeholder = 'What should we know? Please avoid sharing transcript content or sensitive meeting data.';
    }
    window.setTimeout(() => message.focus(), 0);
  }

  function closeModal() {
    backdrop.classList.add('hidden');
    setStatus('', '');
    if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
  }

  openButton.addEventListener('click', () => openModal());
  closeButton.addEventListener('click', closeModal);
  cancelButton.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (event) => {
    if (event.target === backdrop) closeModal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !backdrop.classList.contains('hidden')) closeModal();
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === 'f') {
      if (!backdrop.classList.contains('hidden')) return;
      const snippet = getSelectedSnippetText();
      if (!snippet) return;
      event.preventDefault();
      openModal(snippet);
    }
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(form);
    const payload = {
      route: window.location.pathname,
      feedbackType: String(formData.get('feedbackType') || 'general'),
      message: String(formData.get('message') || '').trim(),
      contactName: String(formData.get('contactName') || '').trim(),
      contactEmail: '',
      selectedSnippet: currentSnippet
    };

    if (payload.message.length < 10) {
      setStatus('Please add a little more detail before sending.', 'error');
      message.focus();
      return;
    }

    submitButton.disabled = true;
    setStatus('Sending feedback…', '');
    try {
      const response = await fetch('/api/meeting-minutes-final/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || 'Feedback could not be sent.');
      form.reset();
      setStatus('Thank you — feedback sent.', 'success');
      window.setTimeout(closeModal, 1200);
    } catch (error) {
      setStatus(error.message || 'Feedback could not be sent. Please try again.', 'error');
    } finally {
      submitButton.disabled = false;
    }
  });
}());
</script>
</body>
</html>
