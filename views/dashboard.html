<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Trinzo tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --soft:#071126; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; min-height:100vh; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; line-height:1.5; }
.container { max-width:720px; margin:0 auto; padding:1rem 0 3rem; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:18px; padding:1.1rem; }
h1 { margin:0 0 1rem; }
.tiles { display:grid; gap:.75rem; }
.tile { display:flex; align-items:center; justify-content:space-between; gap:1rem; min-height:4.5rem; padding:1.1rem 1.25rem; border:1px solid var(--border); border-top:3px solid var(--accent); border-radius:var(--radius, 14px); background:var(--panel); color:var(--heading, var(--text)); font-size:1.1rem; font-weight:700; text-decoration:none; box-shadow:var(--shadow, none); }
.tile::after { content:"→"; color:var(--accent); font-size:1.3rem; }
.tile:hover, .tile:focus-visible { border-color:var(--accent); text-decoration:none; color:var(--heading, var(--text)); }
@media (min-width:720px) { .tiles { grid-template-columns:repeat(3, 1fr); } .tile { min-height:6rem; } }
</style>
  <link rel="stylesheet" href="/static/trinzo.css">
  <script defer src="/static/trinzo.js"></script>
<link rel="stylesheet" href="/static/trinzo-fonts.css">
</head>
<body>
<main class="container">
  <nav class="nav" aria-label="Primary navigation"></nav>

  <h1>Dashboard</h1>

  <section class="tiles" aria-label="Tools">
    <a class="tile" href="/meeting-minutes-agent">Process meeting transcript</a>
    <a class="tile" href="/project-update-test?stage=process&amp;projectId=19">View AI team project</a>
    <a class="tile" href="/jobs">View processed meeting minutes</a>
  </section>
</main>
</body>
</html>
