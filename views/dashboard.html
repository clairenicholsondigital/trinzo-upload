<!doctype html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Trinzo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; }
    * { box-sizing: border-box; }
    body { margin:0; padding:1rem; min-height:100vh; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; }
    .container { max-width:960px; margin:0 auto; padding:3rem 0; }
    .panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1.25rem; margin-bottom:1rem; }
    .eyebrow { margin:0 0 .45rem; color:var(--accent); font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:.78rem; }
    h1 { margin:.2rem 0 .5rem; font-size:clamp(2rem, 5vw, 3.4rem); line-height:1.05; }
    .intro { margin:0; color:var(--muted); max-width:680px; line-height:1.6; }
    .dashboard-card { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:1.25rem; background:#071126; border:1px solid var(--border); border-radius:14px; padding:1rem; }
    .dashboard-card h2 { margin:.1rem 0 .35rem; font-size:1.1rem; }
    .dashboard-card p { margin:0; color:var(--muted); line-height:1.5; }
    a.button { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; background:linear-gradient(180deg,var(--accent),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.75rem 1rem; font-weight:700; text-decoration:none; }
    a.button:focus-visible { outline:3px solid #67e8f9; outline-offset:2px; }
    @media (max-width: 680px) {
      .container { padding:1.5rem 0; }
      .dashboard-card { align-items:flex-start; flex-direction:column; }
      a.button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <p class="eyebrow">Trinzo dashboard</p>
      <h1>Meeting minutes workspace</h1>
      <p class="intro">Use the feedback listing to review submitted feedback and follow up on meeting minutes improvements.</p>
    </section>

    <section class="dashboard-card" aria-labelledby="feedbackListingTitle">
      <div>
        <h2 id="feedbackListingTitle">Feedback listing</h2>
        <p>Review feedback submissions and snippet-specific notes.</p>
      </div>
      <a class="button" href="/meeting-minutes-feedback">Open feedback listing</a>
    </section>
  </main>
</body>
</html>
