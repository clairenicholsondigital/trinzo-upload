<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Meeting Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#02173B; --accent2:#17D0C4; --danger:#dc2626; }
* { box-sizing: border-box; }
body { margin:0; padding:1rem; background: radial-gradient(1200px 650px at 10% -10%, #1e293b, var(--bg)); color:var(--text); font-family:"Roboto",sans-serif; }
.container { max-width:1000px; margin:0 auto; }
.card { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:18px; padding:1rem; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
label { display:block; margin:.5rem 0 .25rem; color:var(--muted); }
input, textarea { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.65rem; font:inherit; }
textarea { min-height:110px; resize:vertical; }
button { background:linear-gradient(180deg,var(--accent2),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.65rem .95rem; font-weight:700; cursor:pointer; }
button.secondary { background:#17233f; color:var(--text); border:1px solid var(--border); }
button.danger { background:var(--danger); color:white; }
a { color:#67e8f9; }
.status { margin:.75rem 0; padding:.75rem .9rem; border-radius:12px; background:#17233f; border:1px solid var(--border); }
.toolbar { display:flex; gap:.5rem; flex-wrap:wrap; margin:.8rem 0; }
.find-panel { display:none; margin:.8rem 0; padding:.9rem; border-radius:14px; background:#0f172a; border:1px solid var(--border); }
.find-panel.open { display:block; }
.find-summary { color:var(--muted); font-size:.95rem; margin-top:.5rem; }
@media (max-width:900px){ .row { grid-template-columns:1fr; } }
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>Review & Edit Meeting Details</h1>

    <p>
      <button type="button" onclick="saveAndReturnToWorkflow()">← Back to workflow</button>
    </p>

    <div id="status" class="status">Edit fields and save your updates.</div>

    <div class="toolbar">
      Tools:
      <button type="button" class="secondary" onclick="toggleFindReplace()">Find and replace</button>
      <button type="button" class="secondary" onclick="normaliseAllEditableText(true)">Apply British spelling</button>
    </div>

    <div id="findReplacePanel" class="find-panel">
      <div class="row">
        <div>
          <label>Find</label>
          <input id="findText" type="text" placeholder="e.g. Analyze" oninput="countFindMatches()" />
        </div>
        <div>
          <label>Replace with</label>
          <input id="replaceText" type="text" placeholder="e.g. Analyse" />
        </div>
      </div>

      <div class="toolbar">
        <button type="button" onclick="replaceAcrossFields()">Replace all visible fields</button>
        <button type="button" class="secondary" onclick="countFindMatches()">Count matches</button>
      </div>

      <div id="findSummary" class="find-summary">Enter a word or phrase to find.</div>
    </div>

    <div class="row">
      <div><label>Meeting title</label><input id="meetingTitle" type="text" /></div>
      <div><label>Meeting date</label><input id="meetingDate" type="date" /></div>
    </div>

    <div class="row">
      <div><label>Location</label><input id="meetingLocation" type="text" /></div>
      <div><label>Client attendees (comma separated)</label><input id="clientAttendees" type="text" /></div>
    </div>

    <div class="row">
      <div><label>Trinzo participants (comma separated)</label><input id="trinzoParticipants" type="text" /></div>
      <div><label>Objectives (one per line)</label><textarea id="meetingObjectives"></textarea></div>
    </div>

    <label>Description</label>
    <textarea id="meetingDescription"></textarea>

    <label>Meeting minutes (Topic: points, one topic block per line)</label>
    <textarea id="meetingMinutes"></textarea>

    <label>Next steps (Action | Owner | Deadline, one per line)</label>
    <textarea id="nextSteps"></textarea>

    <div style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap;">
      <button onclick="saveReviewData()">Save edits</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'reviewData';

const EDITABLE_FIELD_IDS = [
  'meetingTitle',
  'meetingLocation',
  'clientAttendees',
  'trinzoParticipants',
  'meetingObjectives',
  'meetingDescription',
  'meetingMinutes',
  'nextSteps'
];

const US_TO_UK_REPLACEMENTS = [
  ['Analyze', 'Analyse'],
  ['analyze', 'analyse'],
  ['Analyzed', 'Analysed'],
  ['analyzed', 'analysed'],
  ['Analyzing', 'Analysing'],
  ['analyzing', 'analysing'],
  ['Organization', 'Organisation'],
  ['organization', 'organisation'],
  ['Organizations', 'Organisations'],
  ['organizations', 'organisations'],
  ['Organized', 'Organised'],
  ['organized', 'organised'],
  ['Organizing', 'Organising'],
  ['organizing', 'organising'],
  ['Optimize', 'Optimise'],
  ['optimize', 'optimise'],
  ['Optimized', 'Optimised'],
  ['optimized', 'optimised'],
  ['Optimizing', 'Optimising'],
  ['optimizing', 'optimising'],
  ['Prioritize', 'Prioritise'],
  ['prioritize', 'prioritise'],
  ['Prioritized', 'Prioritised'],
  ['prioritized', 'prioritised'],
  ['Finalize', 'Finalise'],
  ['finalize', 'finalise'],
  ['Finalized', 'Finalised'],
  ['finalized', 'finalised'],
  ['Utilize', 'Utilise'],
  ['utilize', 'utilise'],
  ['Utilized', 'Utilised'],
  ['utilized', 'utilised'],
  ['Customize', 'Customise'],
  ['customize', 'customise'],
  ['Customized', 'Customised'],
  ['customized', 'customised'],
  ['Center', 'Centre'],
  ['center', 'centre'],
  ['Centers', 'Centres'],
  ['centers', 'centres'],
  ['Color', 'Colour'],
  ['color', 'colour'],
  ['Colors', 'Colours'],
  ['colors', 'colours'],
  ['Program', 'Programme'],
  ['program', 'programme'],
  ['Programs', 'Programmes'],
  ['programs', 'programmes'],
  ['Behavior', 'Behaviour'],
  ['behavior', 'behaviour'],
  ['Labor', 'Labour'],
  ['labor', 'labour'],
  ['Favor', 'Favour'],
  ['favor', 'favour'],
  ['Emphasize','Emphasise'],
  ['emphasize', 'emphasise'],
];

function splitLines(text){
  return (text || '').split('\n').map(v => v.trim()).filter(Boolean);
}

function splitComma(text){
  return (text || '').split(',').map(v => v.trim()).filter(Boolean);
}

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

function escapeRegExp(value){
  return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function getEditableFields(){
  return EDITABLE_FIELD_IDS
    .map(id => document.getElementById(id))
    .filter(Boolean);
}

function toggleFindReplace(){
  document.getElementById('findReplacePanel').classList.toggle('open');
  countFindMatches();
}

function countFindMatches(){
  const findText = document.getElementById('findText').value;
  const summary = document.getElementById('findSummary');

  if (!findText) {
    summary.textContent = 'Enter a word or phrase to find.';
    return 0;
  }

  const regex = new RegExp(escapeRegExp(findText), 'gi');
  let count = 0;

  getEditableFields().forEach(field => {
    const matches = field.value.match(regex);
    if (matches) count += matches.length;
  });

  summary.textContent = `${count} match${count === 1 ? '' : 'es'} found across visible editable fields.`;
  return count;
}

function replaceAcrossFields(){
  const findText = document.getElementById('findText').value;
  const replaceText = document.getElementById('replaceText').value;

  if (!findText) {
    setStatus('Add text to find first.');
    return;
  }

  const regex = new RegExp(escapeRegExp(findText), 'gi');
  let replacements = 0;

  getEditableFields().forEach(field => {
    const before = field.value;
    const matches = before.match(regex);
    if (matches) replacements += matches.length;
    field.value = before.replace(regex, replaceText);
  });

  countFindMatches();
  setStatus(`${replacements} replacement${replacements === 1 ? '' : 's'} applied.`);
}

function replaceWholeWord(text, from, to){
  const regex = new RegExp(`\\b${escapeRegExp(from)}\\b`, 'g');
  return text.replace(regex, to);
}

function normaliseBritishSpelling(text){
  let updated = text || '';

  US_TO_UK_REPLACEMENTS.forEach(([from, to]) => {
    updated = replaceWholeWord(updated, from, to);
  });

  return updated;
}

function normaliseAllEditableText(showStatus){
  let changes = 0;

  getEditableFields().forEach(field => {
    const before = field.value;
    const after = normaliseBritishSpelling(before);

    if (before !== after) {
      changes += 1;
      field.value = after;
    }
  });

  if (showStatus) {
    setStatus(changes ? 'British spelling applied across visible fields.' : 'No spelling changes needed.');
  }
}

function populateFields(data){
  document.getElementById('meetingTitle').value = data.meetingTitle || '';
  document.getElementById('meetingDate').value = data.meetingDate || '';
  document.getElementById('meetingLocation').value = data.meetingLocation || '';
  document.getElementById('clientAttendees').value = (data.participants?.client || []).join(', ');
  document.getElementById('trinzoParticipants').value = (data.participants?.trinzo || []).join(', ');
  document.getElementById('meetingObjectives').value = (data.meetingObjectives || []).join('\n');
  document.getElementById('meetingDescription').value = data.meetingDescription || '';
  document.getElementById('meetingMinutes').value = (data.meetingMinutes || []).map(item => `${item.topic}: ${(item.discussionPoints || []).join('; ')}`).join('\n');
  document.getElementById('nextSteps').value = (data.nextSteps || []).map(item => `${item.action} | ${item.owner} | ${item.deadline}`).join('\n');
}

function collectReviewData(){
  normaliseAllEditableText(false);

  const minutes = splitLines(document.getElementById('meetingMinutes').value).map(line => {
    const [topic, ...rest] = line.split(':');

    return {
      topic: (topic || '').trim(),
      discussionPoints: splitLines((rest.join(':') || '').split(';').join('\n'))
    };
  }).filter(v => v.topic || v.discussionPoints.length);

  const nextSteps = splitLines(document.getElementById('nextSteps').value).map(line => {
    const [action, owner, deadline] = line.split('|').map(v => (v || '').trim());
    return { action: action || '', owner: owner || '', deadline: deadline || '' };
  }).filter(v => v.action || v.owner || v.deadline);

  return {
    meetingTitle: document.getElementById('meetingTitle').value.trim(),
    meetingDate: document.getElementById('meetingDate').value,
    meetingLocation: document.getElementById('meetingLocation').value.trim(),
    meetingDescription: document.getElementById('meetingDescription').value.trim(),
    meetingObjectives: splitLines(document.getElementById('meetingObjectives').value),
    participants: {
      client: splitComma(document.getElementById('clientAttendees').value),
      trinzo: splitComma(document.getElementById('trinzoParticipants').value)
    },
    meetingMinutes: minutes,
    nextSteps
  };
}

function saveReviewData(){
  const payload = collectReviewData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  setStatus('Edits saved. British spelling has been applied where matched.');
}

function saveAndReturnToWorkflow(){
  const payload = collectReviewData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  localStorage.setItem('workflowReturnStep', 'review');

  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = '/';
  }
}

const existing = localStorage.getItem(STORAGE_KEY);

if (existing) {
  try {
    populateFields(JSON.parse(existing));
  } catch {
    setStatus('Unable to load saved review data.');
  }
} else {
  setStatus('No review data yet. Process a transcript first from the workflow screen.');
}
</script>
</body>
</html>
