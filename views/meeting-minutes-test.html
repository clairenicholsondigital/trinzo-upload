<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript">
(function(c,l,a,r,i,t,y){
  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window, document, "clarity", "script", "x0ats5auf9");
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting minutes test</title>

<style>
:root {
  color-scheme: dark;
  --bg:#0b1020;
  --panel:#11192f;
  --panel2:#0f172a;
  --border:#2d3d60;
  --muted:#95a7cb;
  --text:#eef3ff;
  --accent:#17D0C4;
  --danger:#dc2626;
  --success:#16a34a;
  --input:#071126;
}

* { box-sizing: border-box; }

body {
  margin:0;
  padding:1rem;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
}

.container {
  max-width:1200px;
  margin:0 auto;
}

.panel {
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:14px;
  padding:1rem;
  margin-bottom:1rem;
}

h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }

.intro,
small,
.note {
  color:var(--muted);
}

.field { margin:.9rem 0; }

label {
  display:block;
  margin-bottom:.35rem;
  font-weight:700;
}

input[type=file],
textarea,
input,
select {
  width:100%;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.7rem;
  font:inherit;
}

textarea {
  min-height:260px;
  resize:vertical;
}

button {
  background:linear-gradient(180deg,var(--accent),#0fb5ab);
  color:#02173B;
  border:none;
  border-radius:10px;
  padding:.65rem .95rem;
  font-weight:700;
  cursor:pointer;
}

button.secondary {
  background:#132847;
  color:#dbeafe;
  border:1px solid var(--border);
}

button.danger {
  background:var(--danger);
  color:#fff;
}

button:disabled {
  opacity:.6;
  cursor:not-allowed;
}

.actions,
.json-heading,
.toolbar {
  display:flex;
  gap:.5rem;
  align-items:center;
  flex-wrap:wrap;
  justify-content:space-between;
}

.toolbar {
  justify-content:flex-start;
  margin-top:1rem;
}

.message {
  margin-top:1rem;
  padding:.75rem;
  border-radius:10px;
  background:#17233f;
  border:1px solid var(--border);
  white-space:pre-wrap;
}

.message.error {
  background:#3a1515;
  border-color:#7f1d1d;
}

.message.success {
  background:#0f2f29;
  border-color:#116149;
}

.summary-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:.75rem;
}

.summary-item {
  background:#071126;
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem;
}

.summary-label {
  color:var(--muted);
  font-size:.85rem;
}

.summary-value {
  margin-top:.25rem;
  font-weight:700;
  overflow-wrap:anywhere;
}

.minutes-table-wrap {
  width:100%;
  overflow-x:auto;
  margin-top:1rem;
}

.minutes-table {
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

.minutes-table th,
.minutes-table td {
  border:1px solid var(--border);
  padding:.65rem;
  vertical-align:top;
}

.minutes-table th {
  text-align:left;
  color:var(--accent);
  background:#071126;
  font-size:.9rem;
}

.minutes-table textarea {
  min-height:90px;
}

pre {
  white-space:pre-wrap;
  overflow:auto;
  max-height:650px;
  background:#071126;
  border:1px solid var(--border);
  border-radius:10px;
  padding:1rem;
}

details {
  margin-top:1rem;
}

summary {
  cursor:pointer;
  color:var(--accent);
  font-weight:700;
  padding:.75rem;
  background:#071126;
  border:1px solid var(--border);
  border-radius:10px;
}

details[open] summary {
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
}

details pre {
  margin-top:0;
  border-top:0;
  border-top-left-radius:0;
  border-top-right-radius:0;
}

.hidden {
  display:none;
}

.empty-state {
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:12px;
  padding:1rem;
  margin-top:1rem;
}

a {
  color:#67e8f9;
}
</style>
</head>

<body>
<div class="container">
  <p><a href="/">← Back to workflow</a></p>

  <main id="transcriptTestRoot"></main>

  <section class="panel" id="editableOutputPanel" hidden>
    <h2>Editable meeting output</h2>
    <p class="note">
      Review and clean the meeting output here. The full raw JSON is kept below in a collapsible section for debugging.
    </p>

    <div id="meetingMeta"></div>

    <div class="toolbar">
      <button type="button" id="copyEditedJsonBtn">Copy edited JSON</button>
      <button type="button" id="copyTableTextBtn" class="secondary">Copy table text</button>
      <button type="button" id="downloadEditedJsonBtn" class="secondary">Download edited JSON</button>
      <button type="button" id="clearEditedTableBtn" class="danger">Clear table</button>
    </div>

    <div class="minutes-table-wrap">
      <table class="minutes-table">
        <thead>
          <tr>
            <th style="width:15%">Type</th>
            <th style="width:20%">Owner / speaker</th>
            <th style="width:65%">Editable output</th>
          </tr>
        </thead>
        <tbody id="editableMinutesTableBody"></tbody>
      </table>
    </div>

    <div id="editableEmptyState" class="empty-state" hidden>
      No reviewable meeting rows found in the JSON yet.
    </div>

    <details id="rawJsonDetails">
      <summary>Show raw JSON</summary>
      <pre id="rawJsonOutput"></pre>
    </details>
  </section>
</div>

<script src="/static/test-transcript-page.js"></script>

<script>
let latestRawJson = null;
let latestEditableRows = [];

function asArray(value) {
  return Array.isArray(value) ? value : [];
}

function cleanText(value) {
  return String(value || '')
    .replace(/\s+/g, ' ')
    .replace(/\s+\./g, '.')
    .trim();
}

function firstDefined(...values) {
  return values.find(value => value !== undefined && value !== null && value !== '');
}

function getEvidenceSpeaker(item) {
  const evidence = asArray(item.evidence || item._evidence);
  const first = evidence.find(ev => ev.speaker);
  return first ? first.speaker : '';
}

function addRowsFromArray(rows, source, type, textKeyCandidates) {
  asArray(source).forEach((item, index) => {
    if (!item || typeof item !== 'object') return;

    const text = cleanText(firstDefined(
      ...textKeyCandidates.map(key => item[key]),
      item.text,
      item.summary,
      item.topic
    ));

    if (!text) return;

    rows.push({
      id: `${type}-${index}`,
      type,
      owner: firstDefined(item.owner, item.speaker, getEvidenceSpeaker(item), ''),
      text,
      source: item
    });
  });
}

function buildEditableRows(json) {
  const rows = [];

  addRowsFromArray(
    rows,
    json.actions,
    'Action',
    ['action', 'task', 'meetingActionPoint', 'text']
  );

  const actionPoints = asArray(json.meetingActionPoint);

  actionPoints.forEach((text, index) => {
    rows.push({
      id: `meeting-action-${index}`,
      type: 'Action',
      owner: cleanText(asArray(json.meetingActionPointOwner)[index] || ''),
      text: cleanText(text),
      source: {}
    });
  });

  addRowsFromArray(
    rows,
    json.decisionDetails,
    'Decision',
    ['decision', 'decisionPoint', 'text', 'summary']
  );

  addRowsFromArray(
    rows,
    json.finalDiscussionPoints || json.discussionPointDetails,
    'Discussion',
    ['discussionPoint', 'text', 'summary']
  );

  addRowsFromArray(
    rows,
    json.statusReviewWorkstreams || json.statusReviewPoints,
    'Status',
    ['topic', 'summary', 'text']
  );

  addRowsFromArray(
    rows,
    json.discussionPoints,
    'Discussion',
    ['discussionPoint', 'text', 'summary']
  );

  addRowsFromArray(
    rows,
    json.decisions,
    'Decision',
    ['decision', 'decisionPoint', 'text', 'summary']
  );

  return dedupeRows(rows);
}

function dedupeRows(rows) {
  const seen = new Set();

  return rows.filter(row => {
    const key = `${row.type}|${row.owner}|${row.text}`.toLowerCase();

    if (seen.has(key)) return false;

    seen.add(key);
    return true;
  });
}

function renderMeetingMeta(json) {
  const meta = document.getElementById('meetingMeta');

  const title = cleanText(json.meetingTitle || json.title || '');
  const date = cleanText(json.meetingDate || json.date || '');
  const location = cleanText(json.meetingLocation || json.location || '');
  const type = cleanText(json.meetingType || '');
  const trinzo = asArray(json['participants.trinzo'] || json.participants?.trinzo).join(', ');
  const client = asArray(json['participants.client'] || json.participants?.client).join(', ');

  meta.innerHTML = `
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-label">Title</div>
        <div class="summary-value">${escapeHtml(title || '—')}</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Date</div>
        <div class="summary-value">${escapeHtml(date || '—')}</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Location</div>
        <div class="summary-value">${escapeHtml(location || '—')}</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Type</div>
        <div class="summary-value">${escapeHtml(type || '—')}</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Client participants</div>
        <div class="summary-value">${escapeHtml(client || '—')}</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Trinzo participants</div>
        <div class="summary-value">${escapeHtml(trinzo || '—')}</div>
      </div>
    </div>
  `;
}

function renderEditableTable(json) {
  latestRawJson = json;
  latestEditableRows = buildEditableRows(json);

  document.getElementById('editableOutputPanel').hidden = false;
  document.getElementById('rawJsonOutput').textContent = JSON.stringify(json, null, 2);

  renderMeetingMeta(json);

  const tbody = document.getElementById('editableMinutesTableBody');
  const empty = document.getElementById('editableEmptyState');

  tbody.innerHTML = '';

  if (!latestEditableRows.length) {
    empty.hidden = false;
    return;
  }

  empty.hidden = true;

  latestEditableRows.forEach((row, index) => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>
        <select data-field="type" data-index="${index}">
          ${['Action', 'Decision', 'Discussion', 'Status', 'Note'].map(type => `
            <option value="${type}" ${row.type === type ? 'selected' : ''}>${type}</option>
          `).join('')}
        </select>
      </td>

      <td>
        <input
          data-field="owner"
          data-index="${index}"
          value="${escapeAttribute(row.owner)}"
        />
      </td>

      <td>
        <textarea
          data-field="text"
          data-index="${index}"
        >${escapeHtml(row.text)}</textarea>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

function getEditedRowsFromDom() {
  const rows = latestEditableRows.map(row => ({ ...row }));

  document.querySelectorAll('[data-field][data-index]').forEach(input => {
    const index = Number(input.dataset.index);
    const field = input.dataset.field;

    if (!Number.isNaN(index) && rows[index]) {
      rows[index][field] = input.value;
    }
  });

  return rows;
}

function buildEditedJson() {
  const editedRows = getEditedRowsFromDom();

  return {
    meetingTitle: latestRawJson?.meetingTitle || '',
    meetingDate: latestRawJson?.meetingDate || '',
    meetingLocation: latestRawJson?.meetingLocation || '',
    meetingType: latestRawJson?.meetingType || '',
    participants: {
      client: latestRawJson?.['participants.client'] || latestRawJson?.participants?.client || [],
      trinzo: latestRawJson?.['participants.trinzo'] || latestRawJson?.participants?.trinzo || []
    },
    editedRows,
    raw: latestRawJson
  };
}

function copyText(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    textarea.remove();
  });
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = filename;
  link.click();

  URL.revokeObjectURL(url);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

document.getElementById('copyEditedJsonBtn').addEventListener('click', () => {
  copyText(JSON.stringify(buildEditedJson(), null, 2));
});

document.getElementById('copyTableTextBtn').addEventListener('click', () => {
  const text = getEditedRowsFromDom()
    .map(row => `${row.type} | ${row.owner || '—'}\n${row.text}`)
    .join('\n\n');

  copyText(text);
});

document.getElementById('downloadEditedJsonBtn').addEventListener('click', () => {
  downloadText('edited-meeting-output.json', JSON.stringify(buildEditedJson(), null, 2));
});

document.getElementById('clearEditedTableBtn').addEventListener('click', () => {
  document.getElementById('editableMinutesTableBody').innerHTML = '';
  document.getElementById('editableEmptyState').hidden = false;
  latestEditableRows = [];
});

const originalMeetingMinutesSummary = window.meetingMinutesSummary;

window.meetingMinutesSummary = function meetingMinutesSummaryWithEditableTable(result) {
  const json = result?.json || result?.data || result?.result || result;

  if (json && typeof json === 'object') {
    renderEditableTable(json);
  }

  if (typeof originalMeetingMinutesSummary === 'function') {
    return originalMeetingMinutesSummary(result);
  }

  return result;
};

buildTranscriptTestPage({
  title: 'Meeting minutes test',
  intro: 'Upload or paste a transcript to generate structured meeting-minutes JSON.',
  buttonText: 'Generate minutes JSON',
  endpoint: '/api/meeting-minutes-test',
  summary: window.meetingMinutesSummary
});
</script>
</body>
</html>
