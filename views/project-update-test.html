<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project update test</title>
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; }
* { box-sizing: border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Arial, Helvetica, sans-serif; }
.container { max-width:1280px; margin:0 auto; }
.project-nav { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, small { color:var(--muted); }
.field { margin:.9rem 0; }
label { display:block; margin-bottom:.35rem; font-weight:700; }
input[type=file], input[type=text], input[type=date], select, textarea { width:100%; background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.7rem; font:inherit; }
textarea { min-height:260px; resize:vertical; }
button { background:linear-gradient(180deg,var(--accent),#0fb5ab); color:#02173B; border:none; border-radius:10px; padding:.65rem .95rem; font-weight:700; cursor:pointer; }
button.secondary { background:#132847; color:#dbeafe; border:1px solid var(--border); }
button:disabled { opacity:.6; cursor:not-allowed; }
.actions, .json-heading { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:space-between; }
.message { margin-top:1rem; padding:.75rem; border-radius:10px; background:#17233f; border:1px solid var(--border); white-space:pre-wrap; }
.message.error { background:#3a1515; border-color:#7f1d1d; }
.message.success { background:#0f2f29; border-color:#116149; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem; }
.summary-item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.summary-label { color:var(--muted); font-size:.85rem; }
.summary-value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
pre { white-space:pre-wrap; overflow:auto; max-height:650px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
details.raw-json summary { cursor:pointer; color:#dbeafe; font-weight:700; }
details.raw-json[open] summary { margin-bottom:.75rem; }
.hidden { display:none; }
a { color:#67e8f9; }
.project-tabs { display:flex; gap:.4rem; flex-wrap:wrap; border-bottom:1px solid var(--border); margin:.25rem 0 1rem; }
.project-tab { background:transparent; color:#dbeafe; border:1px solid transparent; border-radius:8px 8px 0 0; padding:.55rem .75rem; }
.project-tab.active { background:#071126; color:var(--accent); border-color:var(--border); border-bottom-color:#071126; }
.project-tab-panel { min-height:260px; }
.project-form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.85rem; }
.project-form-grid label { color:var(--muted); font-size:.86rem; }
.project-form-grid label.wide { grid-column:1 / -1; }
.project-form-grid input, .project-form-grid select, .project-form-grid textarea { margin-top:.35rem; color:var(--text); font-weight:400; }
.project-form-grid textarea { min-height:120px; }
.project-meta-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; margin-bottom:1rem; }
.project-table-actions { display:flex; justify-content:flex-end; margin-bottom:.6rem; }
.project-row-action { padding:.45rem .65rem; white-space:nowrap; }
.autosave-status { display:block; color:var(--muted); margin-top:.65rem; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
.project-table { width:100%; border-collapse:separate; border-spacing:0; min-width:920px; }
.project-table th, .project-table td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.55rem; vertical-align:top; }
.project-table thead th { color:#dbeafe; background:#132847; position:sticky; top:0; z-index:1; text-align:left; }
.project-table tbody th { min-width:150px; color:#dbeafe; text-align:left; }
.project-table tr:last-child th, .project-table tr:last-child td { border-bottom:0; }
.project-table th:last-child, .project-table td:last-child { border-right:0; }
.project-table input, .project-table select, .project-table textarea { border-radius:8px; padding:.55rem; }
.project-table textarea { min-height:72px; }
.project-table.dense { min-width:1180px; }
.project-table.dense textarea { min-height:86px; }
.project-display-value { display:block; margin-top:.35rem; padding:.65rem .7rem; min-height:2.45rem; background:#071126; border:1px solid var(--border); border-radius:10px; color:var(--text); font-weight:700; overflow-wrap:anywhere; }
.project-table .project-display-value { margin-top:0; padding:.55rem; min-height:2.2rem; border-radius:8px; }
.project-colour-field { display:flex; align-items:center; justify-content:center; min-width:4.25rem; min-height:2.2rem; }
.project-colour-swatch { display:inline-block; width:1.55rem; height:1.55rem; border-radius:999px; border:2px solid rgba(238,243,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); }
.project-colour-swatch.unknown { background:transparent; border-style:dashed; border-color:var(--muted); }
.project-hidden-field { position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }
.project-hint { display:block; color:var(--muted); font-size:.78rem; font-weight:400; margin-top:.25rem; }
@media (max-width: 760px) {
  body { padding:.7rem; }
  .panel { padding:.85rem; border-radius:10px; }
  .project-form-grid { grid-template-columns:1fr; }
  .project-tab { flex:1 1 auto; }
}
</style>
</head>
<body>
<div class="container">
  <nav class="project-nav">
    <a href="/">Back to workflow</a>
    <a href="/project-update-test/reports">Reports</a>
    <a href="/project-update-test/milestones">Milestones</a>
  </nav>
  <main id="transcriptTestRoot"></main>
</div>
<script src="/static/test-transcript-page.js"></script>
<script>
buildTranscriptTestPage({
  title: 'Project update test',
  intro: 'Upload or paste a project check-in transcript to extract milestone statuses and change-ready JSON.',
  buttonText: 'Process meeting',
  endpoint: '/api/project-update-test',
  projectReportUi: true,
  summary: projectUpdateSummary
});
</script>
</body>
</html>
