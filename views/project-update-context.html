<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project update context</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; line-height:1.45; }
.container { max-width:1280px; margin:0 auto; }
.nav, .actions { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
a { color:#67e8f9; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, .muted, .label { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.75rem; }
.card { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:860px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
button, .button-link { display:inline-block; background:#132847; color:#dbeafe; border:1px solid var(--border); border-radius:8px; padding:.55rem .75rem; font-weight:700; text-decoration:none; white-space:nowrap; cursor:pointer; font:inherit; }
button.primary { background:linear-gradient(180deg,var(--accent),#0fb5ab); border-color:#0fb5ab; color:#02173B; }
button:disabled { opacity:.6; cursor:not-allowed; }
input, select, textarea { background:#071126; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.65rem; font:inherit; }
textarea { min-height:120px; resize:vertical; width:100%; }
label { display:grid; gap:.35rem; color:var(--muted); font-weight:700; }
.status { margin:.75rem 0; color:var(--muted); }
.status.error { color:#fecaca; }
.status.success { color:#bbf7d0; }
pre { white-space:pre-wrap; overflow:auto; max-height:520px; background:#071126; border:1px solid var(--border); border-radius:10px; padding:1rem; }
.trend-improving, .trend-resolved { color:#bbf7d0; }
.trend-deteriorating, .trend-new_risk { color:#fecaca; }
.trend-new_update, .trend-replanned { color:#bfdbfe; }
.trend-stable { color:#fde68a; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="/project-update-test">Project update test</a>
    <a href="/project-update-test/reports">Reports</a>
    <a href="/project-update-test/milestones">Milestones</a>
    <a href="/project-update-test/context">Context</a>
  </nav>
  <main id="app">
    <section class="panel"><h1>Project context</h1><p class="intro">Loading project context...</p></section>
  </main>
</div>
<script>
(function () {
  const app = document.getElementById('app');

  function authedFetch(url, options = {}) {
    return fetch(url, { credentials: 'same-origin', ...options });
  }

  function authMessage() {
    return 'You need to log in before changing project update data. Open /auth/login, then retry this action.';
  }
  const snapshotMatch = location.pathname.match(/\/project-update-test\/context\/snapshots\/(\d+)$/);
  const snapshotId = snapshotMatch ? snapshotMatch[1] : '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateValue(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value).replace(/T/g, ' ').replace(/Z$/i, '') : date.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  }

  function friendlyLabel(value) {
    const words = String(value || '').replace(/[_-]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    return words.length ? words.map((word) => {
      const lower = word.toLowerCase();
      if (['ai', 'rag', 'sow', 'ei'].includes(lower)) return lower.toUpperCase();
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }).join(' ') : '-';
  }

  function asArray(value) { return Array.isArray(value) ? value : []; }
  function trendClass(value) { return `trend-${String(value || 'unknown').toLowerCase().replace(/[^a-z0-9]+/g, '_')}`; }
  function renderJson(value) { return `<pre>${escapeHtml(JSON.stringify(value || {}, null, 2))}</pre>`; }

  function renderError(error) {
    app.innerHTML = `<section class="panel"><h1>Project context</h1><p class="status error">${escapeHtml(error.message || 'Could not load project context.')}</p></section>`;
  }

  function renderContext(context) {
    const milestones = asArray(context.activeMilestones);
    const recentReports = asArray(context.recentReports);
    const healthHistory = asArray(context.healthHistory);
    const activeRisks = asArray(context.activeRisks);
    const risks = asArray(context.riskSuggestions);
    app.innerHTML = `
      <section class="panel">
        <h1>Project context</h1>
        <p class="intro">This is the history/context layer that future /project-update-test trend analysis can consume before analysing a new transcript.</p>
        <div class="actions">
          <label>Project name <input id="projectNameInput" type="text" value="${escapeHtml(context.projectName || 'Project update test')}" /></label>
          <button id="loadContextBtn" type="button">Load context</button>
          <button id="createSnapshotBtn" type="button" ${context.found ? '' : 'disabled'}>Create context snapshot</button>
          <button id="markOfficialBtn" type="button" class="primary" ${context.found ? '' : 'disabled'}>Mark active context official</button>
          <button id="cleanupTestsBtn" type="button" ${context.found ? '' : 'disabled'}>Clear test clutter</button>
        </div>
        <p id="contextStatus" class="status"></p>
        ${context.found ? '' : '<p class="status error">No saved project exists yet for this name. Create/save a project update report first.</p>'}
      </section>
      <section class="panel">
        <h2>Project</h2>
        <div class="grid">
          <div class="card"><div class="label">Name</div><div class="value">${escapeHtml(context.projectName || '-')}</div></div>
          <div class="card"><div class="label">Status</div><div class="value">${escapeHtml(friendlyLabel(context.status))}</div></div>
          <div class="card"><div class="label">Milestones</div><div class="value">${milestones.length}</div></div>
          <div class="card"><div class="label">Active risks</div><div class="value">${activeRisks.length}</div></div>
          <div class="card"><div class="label">Recent reports</div><div class="value">${recentReports.length}</div></div>
          <div class="card"><div class="label">Latest snapshot</div><div class="value">${context.latestSnapshot ? `<a href="/project-update-test/context/snapshots/${escapeHtml(context.latestSnapshot.snapshotId)}">Snapshot ${escapeHtml(context.latestSnapshot.snapshotId)}</a>` : '-'}</div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Active milestones and latest assessment</h2>
        <div class="table-scroll"><table><thead><tr><th>Milestone</th><th>Official</th><th>Latest status</th><th>Previous status</th><th>Trend</th><th>Forecast</th><th>Summary</th></tr></thead><tbody>
          ${milestones.map((milestone) => {
            const latest = milestone.latestAssessment || {};
            const previous = milestone.previousAssessment || {};
            return `<tr><td>${escapeHtml(friendlyLabel(milestone.milestoneName))}</td><td>${milestone.isOfficial ? `✅ ${escapeHtml(milestone.officialLabel || 'Official')}` : '—'}</td><td>${escapeHtml(friendlyLabel(latest.status))}</td><td>${escapeHtml(friendlyLabel(previous.status))}</td><td class="${escapeHtml(trendClass(latest.trend))}">${escapeHtml(friendlyLabel(latest.trend))}</td><td>${escapeHtml(String(latest.forecastFinishDate || milestone.forecastFinishDate || '-').slice(0, 10))}</td><td>${escapeHtml(latest.summary || '-')}</td></tr>`;
          }).join('') || '<tr><td colspan="7">No active milestones yet.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Recent reports</h2>
        <div class="table-scroll"><table><thead><tr><th>Report</th><th>Period</th><th>Status</th><th>Overall health</th><th>Created</th><th>Summary</th></tr></thead><tbody>
          ${recentReports.map((report) => `<tr><td><a href="/project-update-test/reports/${escapeHtml(report.reportId)}">Report ${escapeHtml(report.reportId)}</a></td><td>${escapeHtml(report.periodLabel || '-')}</td><td>${escapeHtml(friendlyLabel(report.reportStatus))}</td><td>${escapeHtml(friendlyLabel(report.overallHealth || report.overallHealthRag))}</td><td>${escapeHtml(dateValue(report.versionCreatedAt || report.createdAt))}</td><td>${escapeHtml(report.summary || '-')}</td></tr>`).join('') || '<tr><td colspan="6">No reports yet.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Health history</h2>
        <div class="table-scroll"><table><thead><tr><th>Area</th><th>Status</th><th>Trend</th><th>Confidence</th><th>Report</th><th>Rationale</th></tr></thead><tbody>
          ${healthHistory.map((item) => `<tr><td>${escapeHtml(friendlyLabel(item.area))}</td><td>${escapeHtml(friendlyLabel(item.status))}</td><td class="${escapeHtml(trendClass(item.trend))}">${escapeHtml(friendlyLabel(item.trend))}</td><td>${escapeHtml(item.confidence || '-')}</td><td><a href="/project-update-test/reports/${escapeHtml(item.reportId)}">Report ${escapeHtml(item.reportId)}</a></td><td>${escapeHtml(item.rationale || '-')}</td></tr>`).join('') || '<tr><td colspan="6">No health history yet.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Active core risks</h2>
        <div class="table-scroll"><table><thead><tr><th>Risk</th><th>Official</th><th>Category</th><th>Description</th><th>Mitigation</th></tr></thead><tbody>
          ${activeRisks.map((risk) => `<tr><td>${escapeHtml(risk.riskTitle || '-')}</td><td>${risk.isOfficial ? `✅ ${escapeHtml(risk.officialLabel || 'Official')}` : '—'}</td><td>${escapeHtml(risk.category || '-')}</td><td>${escapeHtml(risk.description || '-')}</td><td>${escapeHtml(risk.mitigation || '-')}</td></tr>`).join('') || '<tr><td colspan="5">No active core risks yet.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Risk suggestions</h2>
        <div class="table-scroll"><table><thead><tr><th>Risk</th><th>Review status</th><th>Confidence</th><th>Report</th><th>Description</th><th>Mitigation</th></tr></thead><tbody>
          ${risks.map((risk) => `<tr><td>${escapeHtml(risk.riskTitle || '-')}</td><td>${escapeHtml(friendlyLabel(risk.reviewStatus))}</td><td>${escapeHtml(risk.confidence || '-')}</td><td><a href="/project-update-test/reports/${escapeHtml(risk.reportId)}">Report ${escapeHtml(risk.reportId)}</a></td><td>${escapeHtml(risk.description || '-')}</td><td>${escapeHtml(risk.suggestedMitigation || '-')}</td></tr>`).join('') || '<tr><td colspan="6">No risk suggestions yet.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Project knowledge</h2>
        <p class="intro">Paste standing context such as SoW notes, background decisions, or client constraints. This is supplemental knowledge for future retrieval, not transcript evidence.</p>
        <div class="grid">
          <label>Title <input id="knowledgeTitle" type="text" placeholder="Statement of work / background note" /></label>
          <label>Type <select id="knowledgeType"><option value="background_doc">Background doc</option><option value="decision">Decision</option><option value="note">Note</option><option value="risk">Risk</option></select></label>
        </div>
        <label>Content <textarea id="knowledgeContent" placeholder="Paste project background here..."></textarea></label>
        <div class="actions" style="margin-top:.75rem">
          <button id="saveKnowledgeBtn" type="button" class="primary" ${context.projectId ? '' : 'disabled'}>Save knowledge</button>
          <button id="processKnowledgeBtn" type="button" ${context.projectId ? '' : 'disabled'}>Process embedding queue</button>
        </div>
        <p id="knowledgeStatus" class="status"></p>
        <div id="knowledgeList" class="table-scroll"><table><tbody><tr><td>Loading knowledge items...</td></tr></tbody></table></div>
      </section>
      <section class="panel">
        <details><summary>Raw context JSON</summary>${renderJson(context)}</details>
      </section>
    `;

    document.getElementById('loadContextBtn').addEventListener('click', () => {
      const name = document.getElementById('projectNameInput').value || 'Project update test';
      const projectId = new URLSearchParams(location.search).get('projectId') || '';
      location.href = `/project-update-test/context?projectName=${encodeURIComponent(name)}${projectId ? `&projectId=${encodeURIComponent(projectId)}` : ''}`;
    });
    document.getElementById('createSnapshotBtn').addEventListener('click', async () => {
      const button = document.getElementById('createSnapshotBtn');
      const status = document.getElementById('contextStatus');
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Creating context snapshot...';
      try {
        const response = await authedFetch('/api/project-update-test/context/snapshots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: context.projectId, projectName: document.getElementById('projectNameInput').value || context.projectName })
        });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        status.className = 'status success';
        status.innerHTML = `Snapshot created: <a href="/project-update-test/context/snapshots/${escapeHtml(result.snapshot.snapshotId)}">Snapshot ${escapeHtml(result.snapshot.snapshotId)}</a>`;
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not create snapshot.';
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById('markOfficialBtn').addEventListener('click', async () => {
      const button = document.getElementById('markOfficialBtn');
      const status = document.getElementById('contextStatus');
      const officialLabel = window.prompt('Official label for this baseline?', 'AI Program Q2 official baseline');
      if (!officialLabel) return;
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Marking active milestones and risks as official...';
      try {
        const response = await authedFetch('/api/project-update-test/context/mark-official', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: context.projectId, projectName: document.getElementById('projectNameInput').value || context.projectName, officialLabel })
        });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        status.className = 'status success';
        status.textContent = `Marked official: ${result.result.officialMilestones} milestones, ${result.result.officialRisks} risks. Reloading...`;
        window.setTimeout(() => window.location.reload(), 700);
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not mark context official.';
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById('cleanupTestsBtn').addEventListener('click', async () => {
      const button = document.getElementById('cleanupTestsBtn');
      const status = document.getElementById('contextStatus');
      if (!window.confirm('Clear test clutter for this project? This archives draft reports, deactivates non-official milestones/risks, and removes non-official context snapshots. Official items stay active.')) return;
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Clearing test clutter...';
      try {
        const response = await authedFetch('/api/project-update-test/context/cleanup-tests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: context.projectId, projectName: document.getElementById('projectNameInput').value || context.projectName })
        });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        status.className = 'status success';
        status.textContent = `Cleanup complete: archived ${result.result.archivedReports} reports and ${result.result.archivedKnowledgeItems || 0} knowledge items, deactivated ${result.result.deactivatedMilestones} milestones and ${result.result.deactivatedRisks} risks, removed ${result.result.deletedSnapshots} snapshots. Reloading...`;
        window.setTimeout(() => window.location.reload(), 900);
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not clear test clutter.';
      } finally {
        button.disabled = false;
      }
    });

    async function loadKnowledgeItems() {
      const list = document.getElementById('knowledgeList');
      if (!context.projectId) {
        list.innerHTML = '<table><tbody><tr><td>No project selected.</td></tr></tbody></table>';
        return;
      }
      const response = await authedFetch(`/api/project-update-test/knowledge/items?projectId=${encodeURIComponent(context.projectId)}&status=active`);
      const result = await response.json().catch(() => null);
      if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
      const items = asArray(result.items);
      list.innerHTML = `<table><thead><tr><th>Title</th><th>Type</th><th>Official</th><th>Chunks</th><th>Embeddings</th><th>Updated</th><th>Action</th></tr></thead><tbody>${items.map((item) => {
        const counts = item.embeddingCounts || {};
        return `<tr><td>${escapeHtml(item.title)}</td><td>${escapeHtml(friendlyLabel(item.itemType))}</td><td>${item.isOfficial ? '✅' : '—'}</td><td>${escapeHtml(item.chunkCount || 0)}</td><td>queued ${escapeHtml(counts.queued || 0)} · embedded ${escapeHtml(counts.embedded || 0)} · failed ${escapeHtml(counts.failed || 0)}</td><td>${escapeHtml(dateValue(item.updatedAt))}</td><td><button type="button" data-archive-knowledge="${escapeHtml(item.itemId)}">Archive</button></td></tr>`;
      }).join('') || '<tr><td colspan="7">No knowledge items yet.</td></tr>'}</tbody></table>`;
      list.querySelectorAll('[data-archive-knowledge]').forEach((button) => {
        button.addEventListener('click', async () => {
          const itemId = button.getAttribute('data-archive-knowledge');
          await authedFetch(`/api/project-update-test/knowledge/items/${encodeURIComponent(itemId)}`, { method: 'DELETE' });
          await loadKnowledgeItems();
        });
      });
    }

    document.getElementById('saveKnowledgeBtn').addEventListener('click', async () => {
      const status = document.getElementById('knowledgeStatus');
      status.className = 'status';
      status.textContent = 'Saving knowledge item...';
      try {
        const response = await authedFetch('/api/project-update-test/knowledge/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: context.projectId, title: document.getElementById('knowledgeTitle').value, content: document.getElementById('knowledgeContent').value, itemType: document.getElementById('knowledgeType').value, isOfficial: true, metadata: { source: 'manual_context_page' } })
        });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        status.className = 'status success';
        status.textContent = `Saved ${result.item.chunkCount || 0} chunks. Embedding worker ${result.embeddingWorker?.spawned ? 'started' : 'not started'}.`;
        document.getElementById('knowledgeTitle').value = '';
        document.getElementById('knowledgeContent').value = '';
        await loadKnowledgeItems();
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not save knowledge item.';
      }
    });

    document.getElementById('processKnowledgeBtn').addEventListener('click', async () => {
      const status = document.getElementById('knowledgeStatus');
      status.className = 'status';
      status.textContent = 'Starting embedding worker...';
      try {
        const response = await authedFetch('/api/project-update-test/knowledge/embeddings/process', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projectId: context.projectId }) });
        const result = await response.json().catch(() => null);
        if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
        status.className = 'status success';
        status.textContent = result.embeddingWorker?.spawned ? 'Embedding worker started.' : 'Embedding worker was not started.';
        window.setTimeout(loadKnowledgeItems, 1500);
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not process embeddings.';
      }
    });

    loadKnowledgeItems().catch((error) => {
      const status = document.getElementById('knowledgeStatus');
      status.className = 'status error';
      status.textContent = error.message || 'Could not load knowledge items.';
    });
  }

  function renderSnapshot(snapshot) {
    const items = asArray(snapshot.items);
    app.innerHTML = `
      <section class="panel">
        <h1>Context snapshot ${escapeHtml(snapshot.snapshotId)}</h1>
        <p class="intro">${escapeHtml(snapshot.summary || 'Saved project context snapshot.')}</p>
        <div class="grid">
          <div class="card"><div class="label">Project</div><div class="value">${escapeHtml(snapshot.projectName || '-')}</div></div>
          <div class="card"><div class="label">Type</div><div class="value">${escapeHtml(friendlyLabel(snapshot.snapshotType))}</div></div>
          <div class="card"><div class="label">Source version</div><div class="value">${escapeHtml(snapshot.sourceReportVersionId || '-')}</div></div>
          <div class="card"><div class="label">Created</div><div class="value">${escapeHtml(dateValue(snapshot.createdAt))}</div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Snapshot items</h2>
        <div class="table-scroll"><table><thead><tr><th>Type</th><th>Item</th><th>Status</th><th>Previous</th><th>Trend</th><th>Confidence</th></tr></thead><tbody>
          ${items.map((item) => `<tr><td>${escapeHtml(friendlyLabel(item.itemType))}</td><td>${escapeHtml(item.itemLabel || item.itemKey || '-')}</td><td>${escapeHtml(friendlyLabel(item.status))}</td><td>${escapeHtml(friendlyLabel(item.previousStatus))}</td><td class="${escapeHtml(trendClass(item.trend))}">${escapeHtml(friendlyLabel(item.trend))}</td><td>${escapeHtml(item.confidence || '-')}</td></tr>`).join('') || '<tr><td colspan="6">No snapshot items.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel"><details open><summary>Raw snapshot JSON</summary>${renderJson(snapshot)}</details></section>
    `;
  }

  async function load() {
    if (snapshotId) {
      const response = await authedFetch(`/api/project-update-test/context/snapshots/${encodeURIComponent(snapshotId)}`);
      const result = await response.json().catch(() => null);
      if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
      renderSnapshot(result.snapshot);
      return;
    }
    const params = new URLSearchParams(location.search);
    const projectName = params.get('projectName') || 'Project update test';
    const projectId = params.get('projectId') || '';
    const response = await authedFetch(`/api/project-update-test/context?projectName=${encodeURIComponent(projectName)}${projectId ? `&projectId=${encodeURIComponent(projectId)}` : ''}&limit=8`);
    const result = await response.json().catch(() => null);
    if (!response.ok || !result || result.ok === false) throw new Error(response.status === 401 ? authMessage() : (result && result.error ? result.error : `Request failed with status ${response.status}.`));
    renderContext(result.context);
  }

  load().catch(renderError);
}());
</script>
