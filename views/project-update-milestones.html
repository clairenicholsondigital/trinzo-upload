<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project update milestones</title>
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Arial, Helvetica, sans-serif; }
.container { max-width:1280px; margin:0 auto; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
a { color:#67e8f9; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
.intro, .muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.75rem; }
.item { background:#071126; border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.label { color:var(--muted); font-size:.85rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:#071126; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:920px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
.status { margin:.75rem 0; color:var(--muted); }
.evidence { margin:.5rem 0 0; padding-left:1.1rem; color:#dbeafe; }
.colour-field { display:flex; align-items:center; justify-content:center; min-height:1.6rem; }
.colour-swatch { display:inline-block; width:1.35rem; height:1.35rem; border-radius:999px; border:2px solid rgba(238,243,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); }
.colour-swatch.unknown { background:transparent; border-style:dashed; border-color:var(--muted); }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="/project-update-test">Project update test</a>
    <a href="/project-update-test/reports">Reports</a>
    <a href="/project-update-test/milestones">Milestones</a>
  </nav>
  <main id="app">
    <section class="panel"><h1>Project milestones</h1><p class="intro">Loading saved milestones...</p></section>
  </main>
</div>
<script>
(function () {
  const app = document.getElementById('app');
  const milestoneMatch = location.pathname.match(/\/project-update-test\/milestones\/(\d+)$/);
  const milestoneId = milestoneMatch ? milestoneMatch[1] : '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateOnly(value) {
    return value ? String(value).slice(0, 10) : '-';
  }

  function dateValue(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
  }

  function friendlyLabel(value) {
    const label = String(value || '').replace(/[_-]+/g, ' ').trim().replace(/\b\w/g, (letter) => letter.toUpperCase());
    return label ? label.charAt(0).toUpperCase() + label.slice(1).toLowerCase() : '-';
  }

  function colourValue(value) {
    const key = String(value || '').trim().toLowerCase().replace(/[^a-z]+/g, '_');
    const colours = {
      blue: '#2563eb',
      green: '#16a34a',
      amber: '#f59e0b',
      yellow: '#facc15',
      red: '#dc2626',
      blocked: '#7f1d1d',
      off_track: '#dc2626',
      at_risk: '#f59e0b',
      on_track: '#16a34a',
      completed: '#2563eb'
    };
    return colours[key] || '';
  }

  function renderColour(value) {
    const colour = colourValue(value);
    const label = friendlyLabel(value);
    return `<span class="colour-field" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"><span class="colour-swatch ${colour ? '' : 'unknown'}" style="${colour ? `background:${escapeHtml(colour)}` : ''}"></span></span>`;
  }

  function renderError(error) {
    app.innerHTML = `<section class="panel"><h1>Project milestones</h1><p class="status">${escapeHtml(error.message || 'Could not load milestones.')}</p></section>`;
  }

  function renderList(milestones) {
    app.innerHTML = `
      <section class="panel">
        <h1>Project milestones</h1>
        <p class="intro">${milestones.length ? `${milestones.length} active milestone${milestones.length === 1 ? '' : 's'}.` : 'No saved milestones yet.'}</p>
      </section>
      <section class="panel">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Milestone</th><th>Project</th><th>Period</th><th>Baseline</th><th>Forecast</th><th>Latest status</th><th>Trend</th></tr></thead>
            <tbody>
              ${milestones.map((milestone) => {
                const latest = milestone.latestAssessment || {};
                return `
                  <tr>
                    <td><a href="/project-update-test/milestones/${escapeHtml(milestone.milestoneId)}">${escapeHtml(milestone.milestoneName || '-')}</a></td>
                    <td>${escapeHtml(milestone.projectName || '-')}</td>
                    <td>${escapeHtml(milestone.periodLabel || '-')}</td>
                    <td>${escapeHtml(dateOnly(milestone.baselineFinishDate))}</td>
                    <td>${escapeHtml(dateOnly(milestone.forecastFinishDate || latest.forecastFinishDate))}</td>
                    <td>${escapeHtml(friendlyLabel(latest.status))}</td>
                    <td>${escapeHtml(friendlyLabel(latest.trend))}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </section>
    `;
  }

  function renderDetail(milestone) {
    const assessments = Array.isArray(milestone.assessments) ? milestone.assessments : [];
    app.innerHTML = `
      <section class="panel">
        <h1>${escapeHtml(milestone.milestoneName || 'Milestone')}</h1>
        <div class="grid">
          <div class="item"><div class="label">Project</div><div class="value">${escapeHtml(milestone.projectName || '-')}</div></div>
          <div class="item"><div class="label">Period</div><div class="value">${escapeHtml(milestone.periodLabel || '-')}</div></div>
          <div class="item"><div class="label">Baseline</div><div class="value">${escapeHtml(dateOnly(milestone.baselineFinishDate))}</div></div>
          <div class="item"><div class="label">Forecast</div><div class="value">${escapeHtml(dateOnly(milestone.forecastFinishDate))}</div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Assessment history</h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Report</th><th>Status</th><th>Colour</th><th>Trend</th><th>Confidence</th><th>Forecast</th><th>Summary and evidence</th><th>Created</th></tr></thead>
            <tbody>
              ${assessments.map((assessment) => `
                <tr>
                  <td><a href="/project-update-test/reports/${escapeHtml(assessment.reportId)}">Report ${escapeHtml(assessment.reportId)}</a></td>
                  <td>${escapeHtml(friendlyLabel(assessment.status))}</td>
                  <td>${renderColour(assessment.ragStatus || assessment.agreedRagStatus)}</td>
                  <td>${escapeHtml(friendlyLabel(assessment.trend))}</td>
                  <td>${escapeHtml(assessment.confidence || '-')}</td>
                  <td>${escapeHtml(dateOnly(assessment.forecastFinishDate))}</td>
                  <td>
                    ${escapeHtml(assessment.summary || '-')}
                    <ul class="evidence">
                      ${(Array.isArray(assessment.evidence) ? assessment.evidence : []).map((item) => `<li>${escapeHtml(item.evidenceText || '')}</li>`).join('')}
                    </ul>
                  </td>
                  <td>${escapeHtml(dateValue(assessment.createdAt))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>
    `;
  }

  async function load() {
    const response = await fetch(milestoneId ? `/api/project-update-test/milestones/${milestoneId}` : '/api/project-update-test/milestones');
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload || payload.ok === false) {
      throw new Error(payload && payload.error ? payload.error : `Request failed with status ${response.status}.`);
    }
    if (milestoneId) renderDetail(payload.milestone);
    else renderList(payload.milestones || []);
  }

  load().catch(renderError);
}());
</script>
</body>
</html>
