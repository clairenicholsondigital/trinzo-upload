<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; --bg:#0b1020; --panel:#11192f; --panel2:#0f172a; --border:#2d3d60; --muted:#95a7cb; --text:#eef3ff; --accent:#17D0C4; --danger:#dc2626; --success:#16a34a; --soft:#071126; }
* { box-sizing:border-box; }
body { margin:0; padding:1rem; background:var(--bg); color:var(--text); font-family:Roboto, Arial, Helvetica, sans-serif; line-height:1.45; }
.container { max-width:1280px; margin:0 auto; }
.nav { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
a { color:#67e8f9; }
.panel { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
h1 { margin:.2rem 0 .5rem; }
h2 { margin:.1rem 0 .75rem; font-size:1.1rem; }
h3 { margin:.1rem 0 .5rem; font-size:1rem; }
.intro, .muted, .label { color:var(--muted); }

/* Inputs / buttons (shared across stages) */
button, .button-link { display:inline-block; background:#132847; color:#dbeafe; border:1px solid var(--border); border-radius:8px; padding:.55rem .75rem; font-weight:700; text-decoration:none; white-space:nowrap; cursor:pointer; font:inherit; }
button.primary { background:linear-gradient(180deg,var(--accent),#0fb5ab); border-color:#0fb5ab; color:#02173B; }
button.danger { background:#7f1d1d; border-color:#dc2626; color:#fee2e2; }
button.subtle { background:rgba(19,40,71,.55); border-color:rgba(148,163,184,.28); color:#cbd5e1; }
button:disabled { opacity:.6; cursor:not-allowed; }
input, select, textarea { width:100%; background:var(--soft); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.65rem; font:inherit; }
textarea { min-height:120px; resize:vertical; }
label { display:grid; gap:.35rem; color:var(--muted); font-weight:700; }

/* Status lines */
.status { margin:.75rem 0; color:var(--muted); }
.status.error { color:#fecaca; }
.status.success { color:#bbf7d0; }
.message { margin-top:1rem; padding:.75rem; border-radius:10px; background:#17233f; border:1px solid var(--border); white-space:pre-wrap; }
.message.hidden { display:none; }
.message.error { background:#3a1515; border-color:#7f1d1d; }
.message.success { background:#0f2f29; border-color:#116149; }
.message.warning { background:#3a2c15; border-color:#7f5f1d; }
.autosave-status { display:block; margin:.55rem 0 0; color:var(--muted); }
.autosave-status.hidden { display:none; }
.autosave-status.error { color:#fecaca; }
.autosave-status.success { color:#bbf7d0; }
.safeguard-banner { margin:.75rem 0; padding:.75rem; border-radius:10px; background:rgba(23,208,196,.08); border:1px solid rgba(23,208,196,.35); color:#dbeafe; }
.safeguard-banner.quiet { background:rgba(15,23,42,.42); border-color:rgba(148,163,184,.28); color:#cbd5e1; }
.safeguard-banner.warning { background:#3a2c15; border-color:#7f5f1d; color:#fde68a; }
.safeguard-banner.success { background:#0f2f29; border-color:#116149; color:#bbf7d0; }

/* Grids / cards / tables */
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.75rem; }
.card, .item { background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:.75rem; }
.value { margin-top:.25rem; font-weight:700; overflow-wrap:anywhere; }
.at-glance-strip { display:flex; gap:1rem; align-items:center; justify-content:space-between; flex-wrap:wrap; background:rgba(7,17,38,.55); border:1px solid rgba(148,163,184,.22); border-radius:14px; padding:.85rem 1rem; }
.glance-primary { min-width:220px; }
.glance-primary .label { display:block; color:var(--muted); font-size:.82rem; margin-bottom:.2rem; }
.glance-primary strong { display:block; font-size:1.05rem; color:#eef3ff; overflow-wrap:anywhere; }
.glance-metrics { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
.glance-metrics span { display:inline-flex; align-items:center; gap:.25rem; border:1px solid var(--border); border-radius:999px; padding:.32rem .62rem; color:#cbd5e1; background:rgba(15,23,42,.54); font-size:.9rem; }
.glance-metrics strong { color:#eef3ff; }
.table-scroll { overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--soft); }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:860px; }
th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:.65rem; text-align:left; vertical-align:top; }
thead th { background:#132847; color:#dbeafe; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
th:last-child, td:last-child { border-right:0; }
.profile-editor-scroll { max-width:100%; }
.profile-editor-table { min-width:1120px; table-layout:fixed; }
.profile-editor-table th:nth-child(1), .profile-editor-table td:nth-child(1) { width:260px; }
.profile-editor-table th:nth-child(2), .profile-editor-table td:nth-child(2) { width:140px; }
.profile-editor-table th:nth-child(3), .profile-editor-table td:nth-child(3) { width:300px; }
.profile-editor-table th:nth-child(4), .profile-editor-table td:nth-child(4),
.profile-editor-table th:nth-child(5), .profile-editor-table td:nth-child(5) { width:150px; }
.profile-editor-table th:nth-child(6), .profile-editor-table td:nth-child(6) { width:120px; }
.profile-editor-table th:nth-child(7), .profile-editor-table td:nth-child(7) { width:150px; }
.profile-editor-table textarea { min-height:5.25rem; line-height:1.35; overflow:auto; white-space:pre-wrap; }
.profile-editor-table .profile-title-field { min-height:4.6rem; font-weight:650; }
.profile-editor-table input[type="date"] { min-width:8.5rem; }
.profile-editor-table .actions { display:flex; flex-direction:column; gap:.45rem; }
.monitor-checkbox { display:flex; align-items:center; gap:.45rem; color:#dbeafe; font-weight:700; }
.monitor-checkbox input { width:auto; min-width:1rem; transform:scale(1.1); accent-color:var(--accent); }
.monitor-indicator { display:inline-flex; align-items:center; justify-content:center; width:1.4rem; height:1.4rem; border-radius:999px; background:rgba(23,208,196,.16); color:var(--accent); font-weight:800; }
.evidence { margin:.5rem 0 0; padding-left:1.1rem; color:#dbeafe; }

/* Forms */
.form-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.75rem; align-items:end; }
.form-grid label { color:var(--muted); font-size:.86rem; font-weight:700; }
.form-grid textarea { min-height:5.5rem; }
.form-grid .wide { grid-column:span 2; }
.form-grid .full { grid-column:1 / -1; }
.actions { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; }
.bulk-actions { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:.75rem; }
.bulk-actions .status { margin:0; }
.select-cell { width:3rem; text-align:center; }
.select-cell input { width:auto; margin:0; }

/* Colour swatches (RAG) */
.colour-field { display:flex; align-items:center; justify-content:center; min-height:1.6rem; }
.colour-swatch, .project-colour-swatch { display:inline-block; width:1.35rem; height:1.35rem; border-radius:999px; border:2px solid rgba(238,243,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); }
.colour-swatch.unknown, .project-colour-swatch.unknown { background:transparent; border-style:dashed; border-color:var(--muted); }

/* Trend colours */
.trend-improving, .trend-resolved { color:#bbf7d0; }
.trend-deteriorating, .trend-new_risk { color:#fecaca; }
.trend-new_update, .trend-replanned { color:#bfdbfe; }
.trend-stable { color:#fde68a; }

/* Ask-project-memory (insights) */
.ask-panel { border-color:rgba(23,208,196,.55); box-shadow:0 14px 42px rgba(0,0,0,.18); }
.ask-layout { display:grid; grid-template-columns:minmax(280px, 1fr) minmax(260px, .8fr); gap:1rem; align-items:start; }
.ask-help { background:rgba(23,208,196,.08); border:1px solid rgba(23,208,196,.25); color:#c9fffb; border-radius:12px; padding:.85rem; }
.ask-help ul { margin:.45rem 0 0; padding-left:1.1rem; }
.badges { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0; }
.badge { display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--border); border-radius:999px; padding:.3rem .55rem; background:var(--soft); color:#dbeafe; font-size:.86rem; font-weight:700; }
.badge.success { border-color:rgba(34,197,94,.45); color:#bbf7d0; background:rgba(22,163,74,.12); }
.badge.warn { border-color:rgba(250,204,21,.45); color:#fde68a; background:rgba(202,138,4,.12); }
.badge.muted { color:var(--muted); }
.ask-answer { background:var(--soft); border:1px solid rgba(23,208,196,.35); border-radius:14px; padding:1rem; margin:.75rem 0; }
.ask-answer h3 { margin:0 0 .4rem; font-size:1rem; color:#c9fffb; }
.ask-answer p { margin:.35rem 0 0; }
.citation-list { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
.chunk-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:.75rem; margin-top:.75rem; }
.chunk-card { background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:.75rem; }
.chunk-meta { display:flex; gap:.4rem; flex-wrap:wrap; margin:.45rem 0; }
.chunk-text { color:#dbeafe; font-size:.94rem; }
.empty-state { border:1px dashed var(--border); border-radius:12px; padding:1rem; color:var(--muted); background:rgba(7,17,38,.55); }
pre { white-space:pre-wrap; overflow:auto; max-height:520px; background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:1rem; }
.support-details { background:rgba(7,17,38,.35); border:1px solid rgba(148,163,184,.22); border-radius:12px; padding:.7rem .85rem; color:var(--muted); }
.support-details summary { cursor:pointer; color:#cbd5e1; font-weight:700; }
.support-details[open] { background:rgba(7,17,38,.62); }
.support-details details { border-top:1px solid rgba(148,163,184,.16); padding-top:.65rem; }
.support-details textarea, .support-details pre { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.9rem; }
.print-only { display:none; }
#projectReportPrintOutput { display:none; }

/* ---- Workspace-specific chrome ---- */
.project-bar { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; justify-content:space-between; border-color:rgba(23,208,196,.4); }
.project-bar .identity { display:flex; flex-direction:column; gap:.15rem; min-width:12rem; }
.project-bar .identity .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:.72rem; }
.project-bar .identity .name { font-size:1.35rem; font-weight:700; }
.project-bar .meta { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
.project-bar .bar-actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-left:auto; }
.status-pill { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:999px; padding:.2rem .55rem; font-size:.8rem; font-weight:700; color:#dbeafe; background:var(--soft); text-transform:capitalize; }
.status-pill[data-status="active"] { border-color:rgba(34,197,94,.45); color:#bbf7d0; background:rgba(22,163,74,.12); }
.status-pill[data-status="paused"] { border-color:rgba(250,204,21,.45); color:#fde68a; background:rgba(202,138,4,.12); }
.status-pill[data-status="completed"] { border-color:rgba(37,99,235,.5); color:#bfdbfe; background:rgba(37,99,235,.14); }
.status-pill[data-status="archived"] { color:var(--muted); }

.stage-tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin:0 0 1rem; }
.supporting-tools { background:rgba(7,17,38,.55); border:1px solid var(--border); border-radius:14px; padding:.85rem 1rem; margin-bottom:1rem; }
.supporting-tools summary { cursor:pointer; font-weight:700; color:#dbeafe; }
.supporting-tools .stage-tabs { margin:.75rem 0 0; }
.stage-tab { display:flex; gap:.55rem; align-items:baseline; background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:.6rem .9rem; color:#dbeafe; }
.stage-tab .step-no { display:inline-flex; align-items:center; justify-content:center; width:1.35rem; height:1.35rem; border-radius:999px; background:#132847; color:var(--muted); font-size:.78rem; font-weight:700; }
.stage-tab .step-label { font-weight:700; }
.stage-tab .step-hint { color:var(--muted); font-weight:400; font-size:.82rem; }
.stage-tab.active { border-color:var(--accent); background:rgba(23,208,196,.1); }
.stage-tab.active .step-no { background:var(--accent); color:#02173B; }

/* Project chooser */
.chooser-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.85rem; }
.project-card { display:flex; flex-direction:column; gap:.5rem; text-align:left; align-items:stretch; background:var(--soft); border:1px solid var(--border); border-radius:14px; padding:1rem; cursor:pointer; color:var(--text); white-space:normal; }
.project-card:hover { border-color:var(--accent); }
.project-card.selected { border-color:var(--accent); box-shadow:0 0 0 2px rgba(23,208,196,.18); background:rgba(23,208,196,.08); }
.project-card .pc-name { font-size:1.1rem; font-weight:700; }
.project-card .pc-meta { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:auto; }
.new-project-card { border-style:dashed; align-items:center; justify-content:center; text-align:center; color:var(--muted); min-height:9rem; font-weight:700; }
.project-switcher-panel { border-color:rgba(23,208,196,.32); }
.project-switcher-panel .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:.72rem; }
.compact-project-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.65rem; margin:.85rem 0; }
.compact-project-grid .project-card { padding:.8rem; }
.switcher-actions { justify-content:space-between; }
.project-switcher-collapsed { display:flex; justify-content:space-between; gap:.75rem; align-items:center; padding:.75rem 1rem; }
.project-switcher-collapsed p { margin:0; color:var(--muted); }

/* Project update meeting scaffold */
.meeting-hero { border-color:rgba(23,208,196,.5); box-shadow:0 18px 48px rgba(0,0,0,.2); }
.meeting-hero .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:.72rem; }
.meeting-scaffold-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.85rem; margin-top:1rem; }
.scaffold-card { background:rgba(23,208,196,.07); border:1px solid rgba(23,208,196,.24); border-radius:14px; padding:.9rem; }
.scaffold-card ul { margin:.5rem 0 0; padding-left:1.1rem; color:#dbeafe; }
.section-heading-row { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
.meeting-agenda { display:grid; gap:.8rem; }
.agenda-step { display:grid; grid-template-columns:auto 1fr; gap:.75rem; background:var(--soft); border:1px solid var(--border); border-radius:14px; padding:.85rem; }
.agenda-step .step-no { display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:999px; background:rgba(23,208,196,.16); color:var(--accent); font-weight:800; }
.agenda-step h3 { margin:.1rem 0 .35rem; }
.agenda-step ul { margin:.35rem 0 0; padding-left:1.1rem; }
.agenda-step li { margin:.35rem 0; }

@media (max-width: 860px) {
  .form-grid { grid-template-columns:1fr; }
  .form-grid .wide, .form-grid .full { grid-column:auto; }
  .ask-layout { grid-template-columns:1fr; }
  .project-bar .bar-actions { margin-left:0; }
  .project-switcher-collapsed { align-items:stretch; flex-direction:column; }
}
@media print {
  body { background:#fff; color:#111827; padding:0; }
  .nav, .project-bar, .stage-tabs, .project-report-actions { display:none !important; }
  #projectReportOutput { display:none !important; }
  #projectReportPrintOutput { display:block; }
  .print-only { display:inline-block; }
  .panel { background:#fff; color:#111827; border-color:#d1d5db; break-inside:avoid; }
  a { color:#111827; }
  th { background:#f3f4f6; color:#111827; }
  th, td, .table-scroll { border-color:#d1d5db; }
  table { table-layout:fixed; width:100%; }
  th, td { word-break:normal; overflow-wrap:anywhere; hyphens:none; }
  .colour-swatch, .project-colour-swatch {
    width:10px;
    height:10px;
    border-width:1px;
    border-color:#111827;
    box-shadow:none;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
    forced-color-adjust:none;
  }
}
</style>
</head>
