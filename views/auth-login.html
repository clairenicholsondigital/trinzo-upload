<!doctype html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Trinzo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Roboto", sans-serif;
      background:
        radial-gradient(circle at top left, #1e293b 0%, #0f172a 45%),
        #020617;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 32px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.14);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.1;
      color: #f8fafc;
    }

    .intro {
      margin: 0 0 28px;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }

    .field-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .links {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      white-space: pre-wrap;
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #fecaca;
    }

    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.28);
      color: #bbf7d0;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .auth-card {
        padding: 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="auth-shell">
    <div class="auth-card">

      <div class="eyebrow">
        Secure login
      </div>

      <h1>Welcome back</h1>

      <p class="intro">
        Sign in to access your Trinzo workspace and uploaded meeting data.
      </p>

      <form id="loginForm">

        <div class="field-group">
          <label for="email">Email address</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Password</label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button id="submitButton" type="submit">
          Login
        </button>

      </form>

      <div id="status" class="status"></div>

      <div class="links">
        <a href="/auth/forgot-password">
          Forgot password?
        </a>
      </div>

      <div class="footer-note">
        Trinzo secure authentication
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submitButton');
    const statusBox = document.getElementById('status');

    function showStatus(message, type) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = message;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      statusBox.className = 'status';
      statusBox.textContent = '';

      button.disabled = true;
      button.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Login failed.');
        }

        showStatus('Login successful. Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);

      } catch (error) {
        showStatus(error.message || 'Unable to login.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
