<!doctype html><html><head><meta charset='utf-8'><title>Login</title></head><body><h1>Login</h1>
<p><a href='/auth'>Back to auth</a></p>
<input id='email' placeholder='Email'><input id='password' type='password' placeholder='Password'><button id='go'>Login</button><pre id='out'></pre>
<script>
document.getElementById('go').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});out.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
