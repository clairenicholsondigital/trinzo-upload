<!doctype html>
<html lang="en">
<head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Trinzo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brand:#79b1c2; --accent:#2c7a90; --accent-600:#24657a; --accent-700:#1c5061;
      --brand-050:#f0f6f8; --brand-100:#dcebf0; --brand-200:#c3dde5;
      --text:#17222c; --heading:#142b34; --muted:#596875;
      --border:#d9e1e8; --border-strong:#c3ced8;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Roboto", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1000px 520px at 50% -10%, #ffffff 0%, #eef2f6 55%),
        #eef2f6;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-shell { width: 100%; max-width: 420px; }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(20, 43, 52, 0.10), 0 2px 6px rgba(20, 43, 52, 0.05);
    }

    .brand-logo { display: block; height: 30px; width: auto; margin-bottom: 22px; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--brand-100); color: var(--accent-700);
      border: 1px solid var(--brand-200); border-radius: 999px;
      padding: 5px 12px; font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 18px;
    }

    h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; color: var(--heading); letter-spacing: -.01em; }

    .intro { margin: 0 0 26px; color: var(--muted); font-size: 15px; line-height: 1.6; }

    .field-group { margin-bottom: 18px; }

    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; color: var(--heading); }

    input {
      width: 100%; border: 1px solid var(--border-strong); background: #fff; color: var(--text);
      border-radius: 10px; padding: 12px 14px; font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease; outline: none;
    }
    input::placeholder { color: #9aa8b4; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(44,122,144,0.15); }

    .password-input { position: relative; }
    .password-input input { padding-right: 52px; }

    .password-toggle {
      position: absolute; top: 50%; right: 10px; width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center; padding: 0;
      border: 0; border-radius: 8px; background: transparent; color: var(--muted);
      box-shadow: none; transform: translateY(-50%); cursor: pointer;
    }
    .password-toggle:hover { color: var(--accent-700); background: var(--brand-050); transform: translateY(-50%); }
    .password-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .password-toggle svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .password-toggle .icon-eye-off { display: none; }
    .password-toggle[aria-pressed="true"] .icon-eye { display: none; }
    .password-toggle[aria-pressed="true"] .icon-eye-off { display: block; }

    button {
      width: 100%; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; padding: 13px 18px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 8px 20px rgba(44, 122, 144, 0.22);
    }
    button:hover { background: var(--accent-600); transform: translateY(-1px); }
    button:disabled { opacity: 0.7; cursor: wait; transform: none; }

    .status { margin-top: 18px; padding: 13px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; display: none; white-space: pre-wrap; }
    .status.error { display: block; background: #fdeceb; border: 1px solid #f3c6c2; color: #b42318; }
    .status.success { display: block; background: #e7f5ec; border: 1px solid #b6e0c5; color: #146c43; }

    @media (max-width: 520px) {
      .auth-card { padding: 24px; border-radius: 16px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="auth-shell">
    <div class="auth-card">

      <img class="brand-logo" src="/static/trinzo-logo-dark.svg" alt="Trinzo">

      <div class="eyebrow">
        Secure login
      </div>

      <h1>Welcome back</h1>

      <p class="intro">
        Sign in to access your Trinzo workspace and uploaded meeting data.
      </p>

      <form id="loginForm">

        <div class="field-group">
          <label for="email">Email address</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Password</label>

          <div class="password-input">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              id="passwordToggle"
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-3.2 4.5"></path>
                <path d="M6.6 6.6A18.7 18.7 0 0 0 2 12s3.5 8 10 8a10.8 10.8 0 0 0 4.1-.8"></path>
              </svg>
            </button>
          </div>
        </div>

        <button id="submitButton" type="submit">
          Login
        </button>

      </form>

      <div id="status" class="status"></div>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submitButton');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const statusBox = document.getElementById('status');

    function showStatus(message, type) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = message;
    }

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';

      passwordInput.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      passwordInput.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      statusBox.className = 'status';
      statusBox.textContent = '';

      button.disabled = true;
      button.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Login failed.');
        }

        showStatus('Login successful. Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = data.user && data.user.role === 'client' ? '/staged-meeting-minutes/' : '/dashboard';
        }, 600);

      } catch (error) {
        showStatus(error.message || 'Unable to login.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
