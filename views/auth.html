<!doctype html><html lang="en"><head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0ats5auf9");

<meta charset='utf-8'><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authentication | Trinzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .auth-wrap { max-width: 460px; margin: 8vh auto 0; padding: 0 1rem; }
  .auth-wrap .brand-logo { height: 28px; margin-bottom: 1.25rem; }
  .auth-wrap ul { list-style: none; padding: 0; margin: .5rem 0 1rem; display: flex; gap: .6rem; flex-wrap: wrap; }
  .auth-wrap li a { display: inline-flex; padding: .5rem .8rem; border: 1px solid var(--border-strong); border-radius: 8px; font-weight: 600; }
  .auth-wrap #out { color: var(--muted); }
</style>
  <link rel="stylesheet" href="/static/trinzo.css">
  <script defer src="/static/trinzo.js"></script>
</head><body>
<div class="auth-wrap">
  <img class="brand-logo" src="/static/trinzo-logo-dark.svg" alt="Trinzo">
  <div class="panel">
    <p class="eyebrow">Account</p>
    <h1>Authentication</h1>
    <ul>
      <li><a href='/auth/login'>Login</a></li>
      <li><a href='/auth/forgot-password'>Reset password</a></li>
    </ul>
    <p class="muted">Self-registration is disabled. Ask an administrator to create an account.</p>
    <button class="button secondary" id='logout'>Logout</button>
    <p id='out' role='status'></p>
  </div>
</div>
<script>
const out=document.getElementById('out');
async function me(){const r=await fetch('/api/auth/me'); const data=await r.json().catch(()=>({})); out.textContent=r.ok && data.authenticated ? `Signed in as ${data.user.email}.` : 'Not signed in.';} me();
document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'}).catch(()=>null); out.textContent='Signed out.'};
</script>
</body></html>
