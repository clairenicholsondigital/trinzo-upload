<h1>Authentication</h1>
<ul>
<li><a href='/auth/login'>Login</a></li>
<li><a href='/auth/register'>Register</a></li>
<li><a href='/auth/forgot-password'>Forgot Password</a></li>
</ul>
<button id='logout'>Logout</button>
<pre id='out'></pre>
<script>
const out=document.getElementById('out');
async function me(){const r=await fetch('/api/auth/me'); out.textContent=JSON.stringify(await r.json(),null,2);} me();
document.getElementById('logout').onclick=async()=>{const r=await fetch('/api/auth/logout',{method:'POST'}); out.textContent=JSON.stringify(await r.json(),null,2)};
</script>
